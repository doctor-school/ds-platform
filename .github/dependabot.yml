# Dependabot version updates — GitHub Actions only (#3005).
# Every `uses:` in .github/workflows is pinned to a commit SHA with the release
# tag as a trailing comment (enforced by tools/lint/action-pin-lint.ts);
# Dependabot rewrites the SHA and the comment together. npm stays on
# Dependabot's default security-only updates — no npm ecosystem here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
