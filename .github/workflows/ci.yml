name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual re-verification of the pipeline itself (#1246) — `gh workflow run CI
  # --ref <branch>` replaces the throwaway no-op PR (#1244, opened only to exercise
  # the pool). A dispatch takes the same non-PR path as `push: main`, so no guard
  # behaves differently.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

# ─── Job topology (#1235) ────────────────────────────────────────────────────
# This workflow is BATCHED: every job pays its own checkout + `pnpm install`,
# so this workflow's 44 declared jobs meant 44 installs (47 executing across
# both workflows, counting `pr-body-guards.yml`'s six and excluding the three
# job-level `if: false` placeholders this file carried AT THE TIME — #1236 later
# activated one of them, `db-drift`, leaving two) — the CI-minutes diet
# ADR-0008 §2.1 names as an enabler. The guards themselves are unchanged — only their
# PACKAGING is:
#
#   core                   setup+lint+types+unit+build+api-build-smoke+
#                          docs-build+tokens-fresh+endpoint-authz   (BLOCK)
#   api-e2e                unchanged                                (BLOCK)
#   playwright-axe / playwright-axe-portal
#                          unchanged                                (BLOCK)
#   guards-block           the hard-red light guards + primitives-first +
#                          db-drift                                  (BLOCK)
#   guards-warn            the 23 WARN light guards                  (WARN)
#   ci                     the single required status check
#
# SEVERITY LIVES IN EXIT CODES (ADR-0007 §2.6, #1253). No tool anywhere reads a
# check-run NAME to decide whether it blocks — the merge gate blocks on any red
# check-run, full stop, so the workflow must not manufacture a red it does not
# mean:
#   • BLOCK guard → a plain step; it fails its batch, and `guards-block` is in
#     the `ci` needs-list.
#   • WARN guard  → `continue-on-error: true` on the STEP inside `guards-warn`,
#     PLUS a final `if: always()` WARN-REPORT step that lists every flagged
#     guard in the job summary and exits 0. Those two exit codes are the whole
#     mechanism: a run carrying WARN findings CONCLUDES SUCCESS, so it is
#     VISIBLE (per-step red annotation + log + job summary) and never blocks
#     anything — no classifier exemption needed or wanted.
#     The batch job itself is never `continue-on-error`: an infra failure
#     (checkout/install/dead runner/malformed step) must still fail it. After
#     the above, that is the ONLY thing a red `guards-warn` can mean — the
#     guards never ran — and it must block, because on the board that is
#     indistinguishable from "everything is clean".
#   • `primitives-first` keeps its tool-encoded posture (#1108): WARN lives in
#     the TOOL EXIT CODE, so a non-zero exit is a real #828 BLOCK-class finding.
#     It is a plain step of `guards-block`; wrapping it in `continue-on-error`
#     inside `guards-warn` would swallow that BLOCK class.
# Trade-off, deliberate: batching is fail-fast — the first hard failure in a
# batch skips its remaining steps, where the old parallel fan-out reported every
# failure at once. Splitting a batch back out is mechanical (each step already carries
# its own posture comment). `api-drift`/`generated-artifacts` stay their own
# jobs: they are `if: false` placeholders that cost no runner time. `db-drift`
# was the third such placeholder until #1236 activated it — being live, it is a
# STEP of `guards-block` like every other active light guard, so it pays no
# checkout/install of its own.
#
# ─── PR-time path gating (#1251) ─────────────────────────────────────────────
# #1235 changed job PACKAGING, not the trigger surface: a docs-only PR still
# billed `api-e2e` + both axe jobs + every code step of `core` — ≈5–6 wasted
# job-minutes per PR on metered private-repo Actions minutes.
#
# The trigger surface stays UNCHANGED on purpose. Workflow-level `paths-ignore`
# would mean the workflow does not run at all, so the required `ci` status check
# never registers, and `tools/gh/merge-gate.mjs` treats zero registered
# check-runs at head as FAIL (skill `merge-when-green` Step 1) — a docs PR would
# become UNMERGEABLE rather than cheap. So the gate is JOB-level, the same shape
# `api-drift`/`generated-artifacts` use (a job-level `if:` yielding a SKIPPED
# job, which the merge gate reads as green):
#
#   changes                cheap classifier job — one checkout, no install; emits
#                          `code=true|false` for the PR's changed-file set
#   api-e2e / playwright-axe / playwright-axe-portal
#                          `needs: changes` + `if: needs.changes.outputs.code == 'true'`
#   core                   ALWAYS runs (it owns `docs-build`); its CODE steps
#                          carry the same step-level `if:`, so a docs-only diff
#                          pays install + docs-build only
#   guards-block / guards-warn / pr-body-guards
#                          UNCONDITIONAL — they are exactly the checks that DO
#                          apply to a docs diff (markdown-links, spec-link,
#                          EARS/glossary/product-note, …)
#
# `code` is TRUE unless EVERY changed file is docs-class (`*.md` anywhere,
# `apps/docs/content/**`, `design-source/**`). Fail-open by construction: a
# non-`pull_request` event (`push: main`, `workflow_dispatch`), an empty diff, or
# an unclassifiable path all yield `code=true` — `main` still verifies the FULL
# set, and the filter is a PR-time optimization only. `.changeset/*.md` entries
# ride the `*.md` rule; `.changeset/config.json` is deliberately code-class
# (release tooling config).
#
# The `ci` aggregator can no longer treat `skipped` as red across the board (see
# its own comment): unconditional needs must be `success`, path-gated needs must
# be `success` OR `skipped`, and `changes` is itself an unconditional need — so a
# broken classifier reds `ci` instead of silently skipping the gated jobs green.
jobs:
  # ─── Changed-path classifier (#1251) ──────────────────────────────────
  # One checkout, no `pnpm install`, no build — the cheapest possible job. It
  # exists so the expensive jobs can carry a job-level `if:` (SKIPPED, hence
  # still a registered check-run) instead of the workflow carrying `paths-ignore`
  # (no run at all, hence no `ci` check-run and a failed merge gate).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # Full history: the classifier diffs the PR head against the PR base sha,
      # and both parents of the merge ref must be present.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify the changed-file set
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          emit() {
            echo "code=$1" >> "$GITHUB_OUTPUT"
            echo "code-relevant changes: $1" >> "$GITHUB_STEP_SUMMARY"
          }

          # Fail-open 1: anything that is not a PR (`push: main`,
          # `workflow_dispatch`) runs the FULL set — the filter never reduces
          # what `main` verifies.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "event '$EVENT_NAME' is not a pull_request — full run"
            emit true; exit 0
          fi

          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"

          # Fail-open 2: an empty/unreadable diff is not evidence of a docs-only
          # change — run everything.
          if [ -z "$files" ]; then
            echo "empty changed-file set — full run"
            emit true; exit 0
          fi

          echo "changed files:"; printf '%s\n' "$files"

          code=false
          while IFS= read -r f; do
            if [ -z "$f" ]; then continue; fi
            case "$f" in
              # docs-class: prose + spec content + vendored design canvases.
              # `apps/docs/content/**` is any extension (mdx, meta.json, assets)
              # — it is built by the unconditional `docs-build` step.
              apps/docs/content/*|design-source/*|*.md) continue ;;
            esac
            echo "code-relevant path: $f"
            code=true
          done <<EOF
          $files
          EOF

          emit "$code"

  # ─── Heavy chain: one runner, one install ─────────────────────────────
  # The old setup→{lint,types,unit,build,api-build-smoke,docs-build,tokens-fresh,
  # endpoint-authz} fan-out paid 9 checkouts + 9 installs for work that is mostly
  # sequential anyway. Collapsed into one job; step order follows the old
  # topological order (install first, then the former siblings). Every member was
  # BLOCK, so this batch carries no WARN step and needs no aggregate.
  #
  # The JOB is unconditional (#1251) — it owns `docs-build`, which a docs-only
  # diff DOES need, and keeping it in the `ci` needs-list as a must-be-`success`
  # need is the simplest correct shape. The gating is per-STEP instead: every
  # code step carries `if: needs.changes.outputs.code == 'true'`, so a docs-only
  # PR pays checkout + install + docs-build (~2 min) instead of ~7 min. Splitting
  # `docs-build` into its own job was rejected: a second checkout + install would
  # be charged to EVERY code PR to save nothing on it.
  core:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # lint — `pnpm lint` runs, in order: `eslint .` (incl. the #197 auth-field
      # gate and the #234 design-system guardrails — local/no-arbitrary-tailwind-value,
      # local/no-token-redefinition, rhythmguard-tailwind/tailwind-class-use-scale),
      # then `pnpm lint:oxlint` (#234 spec §4 level 1 — tailwindcss/no-hardcoded-colors
      # via oxlint-tailwindcss), then `pnpm lint:stylelint` (#234 level 2 CSS side —
      # rhythmguard/use-scale), then `turbo run lint` (per-package). All blocking;
      # this job is in the `ci` meta-job needs-list, so any guardrail failure blocks merge.
      - name: lint
        if: needs.changes.outputs.code == 'true'
        run: pnpm lint

      - name: types
        if: needs.changes.outputs.code == 'true'
        run: pnpm typecheck

      - name: build
        if: needs.changes.outputs.code == 'true'
        run: pnpm build

      # unit — pure-unit tests for every package EXCEPT @ds/api. @ds/api's suites
      # boot DatabaseModule / hit Postgres + pgvector, so they run in the
      # `api-e2e` job against a service container (#66). Keeping them out here
      # lets this step stay service-free and fast.
      - name: unit
        if: needs.changes.outputs.code == 'true'
        run: pnpm exec turbo run test --filter='!@ds/api'
      - name: unit (tools)
        if: needs.changes.outputs.code == 'true'
        run: pnpm test:tools

      # api-build-smoke — apps/api build smoke (#158). A single COLD `pnpm build`
      # (the `build` step above) cannot catch either Issue-#158 defect: (1) a
      # stale external tsbuildinfo surviving `deleteOutDir` makes a WARM
      # `nest build` emit an empty `dist/`, and (2) an extensionless
      # `@nestjs/common/constants` subpath is unresolvable for built ESM on Node
      # (only tsx/Vitest/webpack tolerate it). `build:smoke` builds twice + does
      # a real Node `import()` of the built module. Infra-free: both defects fail
      # before any DB/Redis/Zitadel I/O — no services.
      #
      # The built AppModule imports the workspace packages @ds/db + @ds/schemas
      # by their built `dist/` (their package `exports`), so build deps first.
      - name: api-build-smoke (deps)
        if: needs.changes.outputs.code == 'true'
        run: pnpm exec turbo run build --filter=@ds/api^...
      - name: api-build-smoke
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @ds/api build:smoke

      - name: docs-build
        run: pnpm --filter @ds/docs build

      # tokens-fresh — design-token freshness guard (#233). The generated design
      # tokens (packages/design-system/src/styles/tokens.css + allowed-tokens.json)
      # are committed so apps build with no prebuild. This regenerates them from
      # the DTCG source and fails if the committed output is stale — keeping the
      # source-of-truth (tokens/*.json) and the emitted CSS in lockstep. The
      # token-build also validates that every reference resolves.
      - name: tokens-fresh (build)
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @ds/design-system build
      - name: tokens-fresh — verify generated tokens are committed and up to date
        if: needs.changes.outputs.code == 'true'
        run: git diff --exit-code -- packages/design-system/src/styles/tokens.css packages/design-system/src/styles/allowed-tokens.json

      # endpoint-authz — endpoint authorization completeness gate (BLOCK).
      # Spec: 2026-05-18-ds-platform-endpoint-authorization-matrix-design-en.md §6.
      # Deliberate exception to the Phase-0 WARN posture (ADR-0007 §2.6 / spec §6.3):
      # ADR-0001 §2.5 and engineering-readiness §3 both mandate hard failure on
      # missing @Authz metadata, and the matrix is a named pre-pilot security
      # BLOCKER. Vacuously green when there are no routes to classify. No Postgres
      # service: the gate boots a Nest application *context* (no listen) with a
      # placeholder DATABASE_URL and never issues a query (the pool is lazy).
      # It boots the real AppModule, which imports @ds/db + @ds/schemas by their
      # built `dist/` — already built by the `build` step above.
      - name: endpoint-authz
        if: needs.changes.outputs.code == 'true'
        run: pnpm lint:endpoint-authz

  # ─── apps/api e2e against a real Postgres (docker profile) ────────────
  # apps/api e2e (readiness EARS-1, health EARS-1) + unit specs against a real
  # Postgres 17 + pgvector + pg_partman. The Vitest globalSetup runs
  # `drizzle:migrate:ci` (drizzle-kit migrate, no dev-stand snapshot) before the
  # suite (#66); migration 0004 installs the pg_partman extension, so the DB must
  # carry the partman BINARY.
  #
  # GitHub Actions `services:` can only pull a pre-built image, and the bare
  # pgvector/pgvector:pg17 image has no pg_partman — so instead of a `services:`
  # block we BUILD the data-layer image from infra/dev-stand/postgres/Dockerfile
  # (the SSOT image: pgvector + pg_partman, #369) and run it as a step. The
  # migration self-creates the partman schema + extension, so no init.sql mount
  # is needed. Same creds/port/DB name the suite expects on DATABASE_URL.
  #
  # Runs on the `docker` pool profile — a different lane from `heavy`, so it no
  # longer waits on a `setup` job (#1235): it installs for itself and starts
  # immediately, in parallel with `core`.
  #
  # PATH-GATED (#1251): a diff confined to prose/spec/canvas files cannot change
  # a migration, an entity or a suite, so this job is skipped there — a SKIPPED
  # check-run (still registered, still read as green by the merge gate), never an
  # absent one.
  api-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ds:ds@localhost:5432/ds_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build the data-layer Postgres image (pgvector + pg_partman)
        run: docker build -t ds-platform/postgres:pg17-partman infra/dev-stand/postgres
      - name: Start Postgres
        run: |
          docker run -d --name ds-postgres \
            -e POSTGRES_USER=ds \
            -e POSTGRES_PASSWORD=ds \
            -e POSTGRES_DB=ds_test \
            -p 5432:5432 \
            ds-platform/postgres:pg17-partman
      - name: Wait for Postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec ds-postgres pg_isready -U ds -d ds_test; then
              echo "Postgres is ready"; exit 0
            fi
            echo "waiting for Postgres ($i/30)..."; sleep 2
          done
          echo "Postgres did not become ready in time"; docker logs ds-postgres; exit 1
      - run: pnpm exec turbo run test --filter=@ds/api

  # ─── Drift guards from ADR-0006 §7 — GitHub-hosted placeholders ───────
  # TWO of the three §7 drift rows are still dormant, and each states the ONE
  # real precondition it is waiting on (#1236 — a gate comment naming an
  # already-landed precondition is the defect, not the dormancy). They are
  # `if: false` one-step jobs on `ubuntu-latest`, NOT the pool, and left
  # un-batched on purpose (#1235): they cost zero wall-time today, and folding
  # them into a batch would only add some. The third row, `db-drift`, is LIVE as
  # of #1236 — as a step of the `guards-block` batch below, not a job here, so
  # it reuses that batch's checkout + install (the same reason every other
  # active light guard lives there).
  api-drift:
    # Enabled when the OpenAPI snapshot artifact (`openapi.snapshot.json`) lands
    # — nothing in the repo emits or commits one today, so there is no committed
    # baseline for a generated spec to be diffed against. `apps/api` itself
    # landed long ago and is NOT what this is waiting on.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "api-drift placeholder"

  # `db-drift` is no longer a placeholder job: see the `db-drift` step of
  # `guards-block` below (`pnpm lint:db-drift`).

  generated-artifacts:
    # Enabled when a REGENERATING generator pipeline lands. `pnpm generate:all`
    # exists, but today it is exactly `pnpm generate:glossary` — one generator,
    # whose committed output (`packages/glossary/(src/)?ids.ts`) is ALREADY
    # covered by the `glossary-roundtrip` step of `guards-block`. A regenerate-
    # and-assert-clean job here would duplicate that check, and duplicating a
    # BLOCK guard buys nothing but a second way to be red for one cause. The
    # precondition is a second committed generated artifact with no roundtrip
    # guard of its own — `packages/api-client` is the expected first (it is
    # generated per AGENTS.md §8 but has no generator wired into `generate:all`);
    # the glossary regenerating pipeline is tracked by #460.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "generated-artifacts placeholder"

  # ─── BLOCK light guards (hard-red; wired into the `ci` needs-list) ────
  # Batch of the light-profile guards that are BLOCK today. Every step here is a
  # plain step: a failure fails the batch, which fails `ci`. No WARN member, so
  # no WARN-report step — a guard whose findings must not block belongs in
  # `guards-warn` instead. The checkout is FULL (`fetch-depth: 0`) because the
  # lychee link check walks the whole tree.
  guards-block:
    runs-on: ubuntu-latest
    # Union of the member jobs' permission blocks: only `prod-surface` needed one
    # (`issues: read`, for its deferred-Issue OPEN check). No member reaches
    # GitHub through the `gh` CLI or a tools/lint/lib/gh.ts consumer, so the
    # Issue-#10 `pull-requests: read` pattern does not apply here.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # events-drift — ADR-0006 §7 "Events drift" row (@OutboxEmit call-sites ↔ spec
      # events.md). REAL guard as of #448 (was a 5-line exit-0 stub). Empty-state is
      # evaluated emptiness, not hardcoded: it scans, finds no emitters and no
      # events.md manifests today, and exits 0 "nothing to check" (endpoint-authz
      # vacuously-green semantics) — it bites the moment the first emitter/manifest
      # lands. POSTURE: KEPT hard-red (BLOCK, in the `ci` needs-list). It is a
      # deterministic literal set comparison with no false-positive class, clean on
      # main, and ADR-0006 §7.0 does NOT phase it into the Pilot tier (unlike the two
      # glossary checks) — so no burn-in is warranted.
      - name: events-drift
        run: pnpm exec tsx tools/lint/events-lint.ts

      # glossary-roundtrip — ADR-0006 §6 roundtrip (glossary source ids ↔ generated
      # `packages/glossary/(src/)?ids.ts`). REAL guard as of #448 (was a 5-line exit-0
      # stub). Parse-and-compare (not regenerate — the §6.2 generator does not exist
      # yet; pipeline tracked by #460); empty-state is evaluated emptiness: no
      # generated ids.ts today → exits 0 "nothing to roundtrip", bites the moment
      # the #460 pipeline lands the committed artifact. POSTURE: KEPT
      # hard-red (BLOCK, in the `ci` needs-list). It is a deterministic symmetric
      # id-set diff with no false-positive class; ADR-0006 §7.0 Pilot-phases it, but
      # that phasing targets FP/overhead noise a set-diff on a currently-ABSENT
      # artifact cannot create — it can only fire on a genuine source↔generated drift
      # worth blocking the instant the pipeline lands. (Contrast glossary-mdx in the
      # `guards-warn` batch, burned in for genuine `[[…]]` namespace ambiguity.)
      - name: glossary-roundtrip
        run: pnpm exec tsx tools/lint/glossary-roundtrip-lint.ts

      # db-drift — ADR-0006 §7 "DB drift" row, ACTIVATED in #1236 (was one of
      # three `if: false` echo placeholders). Regenerates the Drizzle migrations
      # from `packages/db/src/schema/*` into the committed `apps/api/drizzle/`
      # and fails if the working tree changed — i.e. a schema edit shipped
      # without its migration. `drizzle-kit generate` diffs the schema against
      # the latest `meta/` snapshot and opens NO database connection (only
      # `push`/`migrate` do), so this needs no service container; the full
      # checkout above is what makes the `git status` comparison meaningful.
      # POSTURE: BLOCK — a plain step of this batch. The defect it catches (ORM
      # types a column no database has) is invisible to typecheck/unit/e2e and
      # surfaces only as a prod runtime error, and the remedy is always the same
      # one command. It has ONE false-positive class, routine and worth naming: a
      # `drizzle-kit` version bump that changes snapshot shape or generated-SQL
      # formatting reds this step on an unrelated PR (Dependabot included),
      # because generated output is compared byte-wise against output committed
      # by an OLDER generator. Read a red on a dep-bump PR as that, not as a
      # missing migration — the fix ("regenerate and commit") is the same either
      # way, which is why it does not argue for WARN. Guard rationale, the
      # schema-coverage check, and SKIP semantics: the file header of
      # tools/lint/db-drift-lint.ts.
      - name: db-drift
        run: pnpm lint:db-drift

      # prod-surface — prod-surface readiness gate (BLOCK). Issue #771 (wave-1
      # prod-smoke retro). Deliberate exception to the Phase-0 WARN posture
      # (ADR-0007 §2.6): documented day-0 BLOCK mandate — a scaffold face on a
      # prod-reachable route is the F-22 "no scaffold face in prod" class.
      # GH_TOKEN enables the deferred-Issue OPEN check (skipped without it).
      - name: prod-surface
        run: pnpm lint:prod-surface
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # primitives-first — a raw `<button>`/`<a>`/`<input>`/`<select>`/`<textarea>`
      # (or a `next/link` default import under ANY alias), plus (#1103)
      # summary/details/role=button raw hosts and DS-primitive SHELLs whose
      # className rebuilds the look, in product-app UI source must compose the
      # @ds/design-system primitive that owns the interaction contract + identity
      # (AGENTS.md §6 adopt-before-bespoke; #818/#828/#1103). Reasoned
      # per-occurrence opt-out: `primitives-first-ok: <reason>`. Static source
      # scan — no PR/gh context needed.
      #
      # POSTURE: this guard's severity lives in the TOOL EXIT CODE (#1108) — the
      # #1103 WARN classes print findings and exit 0, only the #828 raw-state
      # BLOCK class (zero in-repo today) exits 1. A non-zero exit is therefore a
      # real BLOCK-class finding, which is why the step belongs in THIS batch and
      # not in `guards-warn` (#1253): every step there is wrapped in
      # `continue-on-error: true`, which would swallow this guard's BLOCK class
      # outright. Here it is a plain step, so its red fails the batch — a red
      # BLOCK check-run in the `ci` needs-list, blocking and visibly so.
      - name: primitives-first (tool-encoded WARN/BLOCK — a non-zero exit is the BLOCK class)
        run: pnpm lint:primitives-first

      # markdown-links — lychee link check over the whole tree (needs the full
      # checkout above). Last in the batch: it is the only network-bound step, so
      # the deterministic local guards fail fast ahead of it.
      - name: markdown-links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments .
          fail: true

  # ─── WARN light guards ────────────────────────────────────────────────
  # Batch of every light-profile guard whose finding must NOT block a merge.
  # Every member is WARN — a guard that must block goes in `guards-block` (that
  # is where `primitives-first` lives: its severity is tool-exit-code-encoded, so
  # a non-zero exit is a real BLOCK finding).
  #
  # WARN lives on each STEP (`continue-on-error: true`), so one flagged guard
  # never stops the others, and the final WARN-report step lists the flagged
  # guards in the job summary and exits 0. Net: a WARN-findings run CONCLUDES
  # SUCCESS — visible, never blocking, with no classifier special-casing this
  # job's name. This batch is also NOT in the `ci` needs-list.
  #
  # The JOB is deliberately not `continue-on-error`, so an infrastructure failure
  # still fails it — and that is now the ONLY meaning of a red check-run here
  # ("the 23 guards never ran"), which the merge gate blocks on. Adding a WARN
  # guard WITHOUT `continue-on-error` therefore blocks every PR: that is the
  # loud direction, on purpose.
  #
  # The checkout is intentionally SHALLOW: `migration-index` fetches origin/main
  # itself and falls back to SKIP, which is the behavior its posture assumes.
  guards-warn:
    runs-on: ubuntu-latest
    # Union of the member jobs' permission blocks: `tdd-signal` and `product-note`
    # are tools/lint/lib/gh.ts consumers, so the batch carries the canonical
    # Issue-#10 pattern (`contents: read` + `pull-requests: read`) and both steps
    # carry `GH_TOKEN`/`PR_NUMBER` — enforced by the `workflow-auth` guard below.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # module-readme: every top-level NestJS module dir under apps/*/src (a dir with a
      # *.module.ts) carries a README (ADR-0006 §7). Was an exit-0 stub; implemented as
      # a REAL WARN v1 in #438 — EXITS NON-ZERO on findings, with a tracked-Issue
      # grandfather allowlist for the 6 pre-existing gaps. Promotion clock (ADR-0007
      # §2.6, 4 clean weeks) starts at merge — 2026-07-02. Kept WARN until the sweep
      # flips it; do not remove the `continue-on-error` here.
      - name: WARN · module-readme
        id: warn_module_readme
        continue-on-error: true
        run: pnpm exec tsx tools/lint/module-readme-lint.ts

      # route-targets: every internal navigation target in apps/portal + apps/admin
      # (a `<Link href>`, `router.push/replace`, or `redirect` string/template) must
      # resolve to an existing app-router route (page.tsx/route.ts). Guards the #673
      # class of defect — a `/webinars/<slug>/room` link shipped before its route
      # existed. WARN v1 (ADR-0007 §2.6; new guard lands WARN, promote to BLOCK once
      # stable), and NOT in the `ci` needs-list.
      - name: WARN · route-targets
        id: warn_route_targets
        continue-on-error: true
        run: pnpm exec tsx tools/lint/route-target-lint.ts

      # axe-exclude: every `AxeBuilder.exclude(...)` in an e2e a11y spec
      # (apps/*/e2e/**/*axe*.e2e.spec.ts) must be leaf-scoped (a `#id`/`[attr]`
      # selector) or carry a `// axe-exclude-ok: #<issue> <reason>` marker. Guards the
      # #713 class of defect — `.exclude(".bg-header")` excluded a whole container
      # band, hiding the interactive theme-toggle glyph (#702) from the contrast scan.
      # WARN v1 (ADR-0007 §2.6), and NOT in the `ci` needs-list.
      - name: WARN · axe-exclude
        id: warn_axe_exclude
        continue-on-error: true
        run: pnpm exec tsx tools/lint/axe-exclude-lint.ts

      # glossary-mdx — ADR-0006 §6.4 MDX glossary-lint (a `[[term-id]]` directive in
      # docs prose must resolve to a glossary term). REAL guard as of #448 (was a
      # 5-line exit-0 stub). POSTURE: BURN-IN — WARN and NOT in the `ci` needs-list
      # (BLOCK = in needs-list, WARN = non-blocking for `ci`, never both). Rationale:
      # (a) ADR-0006 §7.0 phases glossary-mdx into the Pilot tier (#449 posture note) —
      # not pre-pilot-mandatory; (b) the `[[…]]` syntax is OVERLOADED — glossary terms
      # vs. memory/decision cross-refs (`[[reference_*]]`/`[[feedback_*]]`/`[[project_*]]`,
      # the separate §7.0 `[[refs]]` check) vs. code-fenced syntax examples — so the
      # guard's namespace-exclusion + code-masking disambiguation is HEURISTIC, a real
      # false-positive class the deterministic events-drift/roundtrip checks lack;
      # (c) no real glossary `[[term-id]]` directive is in use yet, so as BLOCK it
      # would gate nothing real while carrying that FP risk. RE-ENTRY (→ BLOCK: move
      # the step into the `guards-block` batch): when the ADR-0006 §6.2 glossary
      # generation pipeline (#460) + real `[[term-id]]` usage land, the §6.4
      # directive-marker collision is settled by the ADR-0006 §6 reconcile (#459),
      # AND the Pilot phase opens — earliest sweep 2026-07-02 per ADR-0007 §2.6 +
      # ADR-0006 §7.0.
      - name: WARN · glossary-mdx
        id: warn_glossary_mdx
        continue-on-error: true
        run: pnpm exec tsx tools/lint/glossary-mdx-lint.ts

      # glossary-ids — ADR-0006 §6.3 glossary canonical-id SSOT enforcement. The
      # ESLint rule `local/glossary-canonical-ids` (#468) forbids a bare string
      # literal equal to a glossary canonical id in glossary-CONSUMER code
      # (`apps/cms/**`, `apps/docs/**`), steering it to the typed `GLOSSARY_IDS.<id>`
      # so a rename breaks the build. It is also wired at `warn` in the main
      # `eslint.config.js` (editor/dev feedback, rides the `lint` step in `core`
      # non-blockingly); THIS step is the promotable pass/fail check surface — a
      # dedicated `eslint.glossary-ids.config.mjs` running ONLY that rule at `error`.
      #
      # The id-vs-domain-enum collision (`doctor_guest` — a glossary id AND the live
      # RBAC role wire-value, SSOT apps/api authz.types.ts ROLES / idp.types.ts
      # DOCTOR_GUEST_ROLE) is handled two ways: the surface scope keeps the rule off
      # apps/api/**·packages/db|schemas/** entirely, and `domainEnumIds:["doctor_guest"]`
      # makes the rule abstain on that id. Clean on main (no glossary-consumer code
      # hardcodes an id yet); it bites the moment one does.
      #
      # POSTURE: BURN-IN — WARN v1 (ADR-0007 §2.6), NOT in the `ci` needs-list.
      # RE-ENTRY (→ BLOCK): when a real glossary-consumer surface (Payload
      # GlossaryRef / docs component) lands and the ADR-0007 §2.6 sweep opens — move
      # the step into `guards-block`, no rule change.
      - name: WARN · glossary-ids
        id: warn_glossary_ids
        continue-on-error: true
        run: pnpm lint:glossary-ids

      # no-stub: user-facing source must not ship a "set this env var" dev
      # placeholder or an untracked TODO/FIXME stub (AGENTS.md §6). WARN per the
      # ADR-0007 §2.6 new-guard posture — promote to BLOCK once stable.
      - name: WARN · no-stub
        id: warn_no_stub
        continue-on-error: true
        run: pnpm lint:no-stub

      # no-hardcoded-path: committed tooling (`tools/**/*.{mjs,ts}`) must not bake a
      # machine-specific absolute path literal (drive-letter `C:/…` / home
      # `/home/<user>/…` / `/Users/<user>/…` / repo-root) into runtime code — a
      # hardcoded value standing in for config (AGENTS.md §6; dev-stand "never
      # hardcode a host/port/path"). Derive the root via `git rev-parse
      # --show-toplevel`. #936 (PR #933 renderBrief() leak). WARN per the ADR-0007
      # §2.6 new-guard posture — promote to BLOCK once stable.
      - name: WARN · no-hardcoded-path
        id: warn_no_hardcoded_path
        continue-on-error: true
        run: pnpm lint:no-hardcoded-path

      # external-anchor: external-document anchors on user-facing surfaces
      # (`apps/portal`, `apps/admin`, `packages/design-system/src`) must carry
      # `target="_blank"` + a `rel` containing `noreferrer`/`noopener`. #867 — the
      # #864/#865 same-tab drift: the program-PDF affordance shipped WITHOUT them on
      # the public page while the admin surface had them, and no gate caught the
      # surface-parity gap. WARN per the ADR-0007 §2.6 new-guard posture — promote to
      # BLOCK once stable.
      - name: WARN · external-anchor
        id: warn_external_anchor
        continue-on-error: true
        run: pnpm lint:external-anchor

      # migration-index: Drizzle migration-index collision guard (#799). Parallel
      # branches independently generate the same next migration index off a stale
      # base; on merge one branch's _journal.json entry / snapshot drops the sibling
      # (observed 2026-07-12, #705: 0011_neat_vapor vs 0011_users_deactivated_at).
      # Fails on a branch-new idx ≤ origin/main max, a duplicate journal idx, a
      # duplicate SQL-file prefix, or a dropped base entry. The checkout is shallow,
      # so the guard fetches origin/main itself (falls back to SKIP, never a false
      # red). WARN v1 — promote to BLOCK per ADR-0007 §2.6.
      - name: WARN · migration-index
        id: warn_migration_index
        continue-on-error: true
        run: pnpm lint:migration-index

      # tsc-version: one-compiler guard (#1258). `apps/api` builds with `nest build`,
      # whose TypeScriptBinaryLoader resolves `typescript` cwd-FIRST — cwd = apps/api,
      # which pins it — so the prod artifact has always been emitted by the workspace
      # compiler; the typescript@5.9.3 vendored inside @nestjs/cli was installed but
      # never loaded (#1258 was filed on that installed-vs-loaded confusion). The guard
      # keeps it that way: red when the compiler resolved from apps/api differs from the
      # workspace one, when apps/api stops declaring `typescript` (the real vector — its
      # build compiler would then be inherited by accident), or when a workspace manifest
      # pins a different range. A merely-present vendored copy is INFO, never red. Needs
      # the install to have run (it does — this job installs); an absent install is a
      # SKIP, never a false red. WARN v1 — promote to BLOCK per ADR-0007 §2.6.
      - name: WARN · tsc-version
        id: warn_tsc_version
        continue-on-error: true
        run: pnpm lint:tsc-version

      # audit-coverage: universal edit-audit coverage guard (010 EARS-8, #1089).
      # Spec 010 audits every domain-table mutation via one generic PL/pgSQL trigger
      # attached per table by migration; the owner-confirmed requirement is that a
      # NEW domain table cannot silently ship WITHOUT that trigger. This guard
      # asserts every `pgTable` in packages/db/src/schema is EITHER covered by an
      # `audit_row_change()` trigger in apps/api/drizzle/*.sql OR carries a
      # rationale-bearing AUDIT_CAPTURE_ALLOWLIST entry (packages/db/src/audit.ts) —
      # red on any table in neither set. Static source scan — no PR/gh context.
      # WARN v1 — promote to BLOCK per ADR-0007 §2.6.
      - name: WARN · audit-coverage
        id: warn_audit_coverage
        continue-on-error: true
        run: pnpm lint:audit-coverage

      # showcase-coverage: the design-system living showcase (apps/showcase) is the
      # rendered viewer of @ds/design-system — it must stay *living*. This guard
      # asserts every package COMPONENT export has a catalogued entry in the showcase
      # registry (apps/showcase/app/lib/registry.ts), so a new primitive/block cannot
      # ship without appearing in the catalogue (design-system-showcase spec §5.1,
      # #350). Static source scan — no PR/gh context needed. WARN per ADR-0007 §2.6.
      - name: WARN · showcase-coverage
        id: warn_showcase_coverage
        continue-on-error: true
        run: pnpm lint:showcase-coverage

      # showcase-snippet: the showcase (apps/showcase) is the rendered VIEWER of
      # @ds/design-system — it re-implements nothing (design-system-showcase spec §2.4).
      # A hand-typed usage snippet (a STRING/template-literal constant depicting a block
      # import or PascalCase JSX) is a second, hand-maintained copy of code the package
      # owns and DRIFTS; mature systems auto-extract displayed code from the real source
      # so it cannot. This guard flags such literals (#396). Static source scan — no
      # PR/gh context needed. WARN per ADR-0007 §2.6.
      - name: WARN · showcase-snippet
        id: warn_showcase_snippet
        continue-on-error: true
        run: pnpm lint:showcase-snippet

      # asset-format: product assets are vector-first (ADR-0013 §8, #275) — logos /
      # icons ship as SVG, raster as WEBP minimum; committed *.png / *.jpg / *.jpeg
      # under apps/*/public or @ds/design-system is an asset-hygiene defect. Static
      # file scan — no PR/gh context needed. WARN per ADR-0007 §2.6.
      - name: WARN · asset-format
        id: warn_asset_format
        continue-on-error: true
        run: pnpm lint:asset-format

      # interaction-states: a @ds/design-system clickable primitive must carry its
      # hover + focus-visible contract, and the globals.css layer-1 base-reset
      # (cursor / prefers-reduced-motion) must stay intact (ADR-0013 §7 layer 3,
      # #269). Static source scan — no PR/gh context needed. WARN per ADR-0007 §2.6.
      # (Its RUNTIME twin, `playwright-axe`, is BLOCK.)
      - name: WARN · interaction-states
        id: warn_interaction_states
        continue-on-error: true
        run: pnpm lint:interaction-states

      # aa-contrast: the cheap STATIC pre-filter for the AA-contrast usage rule (ADR-0013
      # §7), left of the runtime playwright-axe tier (#351). Flags the two deterministic
      # token-level anti-patterns — an opacity-dimmed `text-*-foreground/NN` and a
      # text-bearing raw `bg-primary` fill — that no colour / arbitrary-value guard catches
      # (both are valid tokens). The #351 retarget caught 4 such defects only at runtime;
      # this gate catches the static subset early (#402). Static source scan — no PR/gh
      # context needed. WARN per ADR-0007 §2.6.
      - name: WARN · aa-contrast
        id: warn_aa_contrast
        continue-on-error: true
        run: pnpm lint:aa-contrast

      # form-error: a form-level error/message in app UI source must route through the
      # @ds/design-system `FormError` / `FormMessage` primitive, not be hand-typed as a
      # raw `<p role="alert" className="text-destructive">` per page (ADR-0013 §7,
      # #333 redo / #339). `text-destructive` is a valid token, so no color / arbitrary
      # -value guard catches the duplication — only this one does. Static source scan —
      # no PR/gh context needed. WARN per ADR-0007 §2.6.
      - name: WARN · form-error
        id: warn_form_error
        continue-on-error: true
        run: pnpm lint:form-error

      # form-rhythm: the settled form vertical-rhythm + error-state contract (ADR-0013
      # §7 "Form layout & validation contract", #333 redo / #334). Flags the three
      # valid-token defects the #333 owner review caught and every prior gate missed:
      # a `min-h-*` reserved blank line on a message (K-1 over-spacing), a duplicate
      # `formDescriptionId` (a `<FormDescription>` beside a `<FormMessage>` — the
      # PasswordField bug), and a `text-destructive` label in the error state (K-3 "red
      # mush"). Static source scan over the DS form primitives + app surfaces — no
      # PR/gh context. WARN per ADR-0007 §2.6.
      - name: WARN · form-rhythm
        id: warn_form_rhythm
        continue-on-error: true
        run: pnpm lint:form-rhythm

      # submit-pending: the async-submit pending standard (ADR-0013 §7 layer 2, #337).
      # Flags a `type="submit"` control disabled by an in-flight flag
      # (`disabled={isSubmitting}`) with no `loading` prop — a static disabled button that
      # gives no progress signal and reads as hung (the #333 Stage-B owner finding). The
      # design system already ships the fix (`Button.loading` = spinner + `aria-busy` +
      # disabled-while-loading); this guard catches the adoption gap, a valid-token combo
      # every prior gate passes. Static source scan over the DS blocks/primitives + app
      # surfaces — no PR/gh context. WARN per ADR-0007 §2.6.
      - name: WARN · submit-pending
        id: warn_submit_pending
        continue-on-error: true
        run: pnpm lint:submit-pending

      # ears-tests: the COVERAGE + ORPHAN direction of the EARS↔test contract (#316,
      # ADR-0006 §4). Every requirement id has a test title that cites it (folding a
      # flat `EARS-N` spec ↔ nested `EARS-N.M` tests component-wise), and no test title
      # cites a requirement no spec declares. As of #437 the guard FOLDS nested ids +
      # EXITS NON-ZERO on findings (the promotion prerequisite), with a tracked-Issue
      # deferral allowlist for the genuine gaps. Promotion clock (ADR-0007 §2.6, 4 clean
      # weeks) starts at merge — 2026-07-02. Kept WARN until the sweep flips it; do not
      # remove the `continue-on-error` here — promotion is a later sweep decision.
      - name: WARN · ears-tests
        id: warn_ears_tests
        continue-on-error: true
        run: pnpm exec tsx tools/lint/ears-test-lint.ts

      # ears-naming: the FORMAT-hygiene direction of the EARS↔test contract (#316,
      # ADR-0006 §4). `ears-tests` (above) owns coverage+orphan; this flags a MALFORMED
      # EARS prefix on a test title (ears-3:, EARS3:, EARS-3 without a colon), accepting
      # every real shape (flat / nested / compound EARS-N/M / (#issue)). It does NOT
      # demand every test be EARS-named — a legit non-EARS unit / #issue test is left
      # alone. Static title scan. WARN per ADR-0007 §2.6.
      - name: WARN · ears-naming
        id: warn_ears_naming
        continue-on-error: true
        run: pnpm lint:ears-naming

      # tdd-signal: a PR that changes production source under apps/*/src with no test
      # in the diff AND no pre-existing test in the changed module (design §5.2,
      # heuristic). Was an exit-0 stub; implemented as a REAL WARN v1 in #438 — reads
      # the changed-file set from `gh pr view` (PR-event-gated; shallow CI checkout has
      # no base to diff) and EXITS NON-ZERO on findings. Promotion clock (ADR-0007
      # §2.6, 4 clean weeks) starts at merge — 2026-07-02. Kept WARN until the sweep
      # flips it.
      #
      # The guard calls `gh pr view` — the default GITHUB_TOKEN under restrictive
      # workflow permissions lacks `pull-requests: read`, which makes `gh pr view` exit
      # non-zero before the guard's skip short-circuit (Issue #10 root cause 1). The
      # batch job's `permissions` block carries the grant; the step carries the token.
      - name: WARN · tdd-signal
        id: warn_tdd_signal
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm exec tsx tools/lint/tdd-signal-lint.ts

      # product-note: a user-facing PR (kind label `feature`/`bug`) must carry a real
      # `Product note (RU)` section in its body — the source of truth the merge-time
      # Mattermost delivery renders (Issue #654). `none`/absent is allowed only on an
      # internal-only PR (chore/CI/refactor/deps). PR-event-gated (reads labels+body via
      # `gh pr view`; exits 0 outside a PR; also run by `pnpm pr:preflight`). WARN v1 per
      # the ADR-0007 §2.6 new-guard posture — promote to BLOCK once stable.
      #
      # `gh pr view` wiring — see the tdd-signal note (Issue #10 root cause 1): the batch
      # job carries `permissions: { contents: read, pull-requests: read }` and this step
      # carries `GH_TOKEN`/`PR_NUMBER` (enforced by the workflow-auth guard below).
      - name: WARN · product-note
        id: warn_product_note
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm lint:product-note

      # workflow-auth: enforces the "Issue-#10 auth pattern" on the workflow files
      # THEMSELVES — every job that runs `gh` or a PR-event-gated guard (a
      # `tools/lint/lib/gh.ts` consumer) MUST carry `permissions: { contents: read,
      # pull-requests: read }` on the job + `GH_TOKEN`/`PR_NUMBER` on the invoking step
      # (the `spec-link` precedent, Issue #10 root cause 1). PR #455 shipped three
      # PR-gated guard jobs WITHOUT the block → all three vacuous-red on every PR; this
      # guard makes that gap deterministic + local. The gh-consumer set is DERIVED (scan
      # tools/lint for the `./lib/gh` import), never a stale literal. Static parse of the
      # workflow files — no PR/gh context needed, and this step is not itself gh-gated so
      # it (correctly) needs no auth block. WARN v1 per ADR-0007 §2.6 — promotion clock
      # starts at merge 2026-07-02.
      - name: WARN · workflow-auth
        id: warn_workflow_auth
        continue-on-error: true
        run: pnpm exec tsx tools/lint/workflow-auth-lint.ts

      # WARN report — the second half of the WARN encoding, and the batch's
      # VISIBILITY surface. It collects every WARN step whose `outcome` is
      # `failure` and writes them to the job summary; it exits 0 by design.
      #
      # It replaces an aggregate step that exited 1. That step's ONLY purpose was
      # to re-red this check-run so `tools/gh/merge-gate.mjs` — which reded ANY
      # completed non-success check-run — kept treating a WARN finding as a
      # merge-blocker. That is precisely the contradiction #1253 closes: ADR-0007
      # §2.6 defines WARN as visible and NEVER merge-blocking, yet one WARN
      # finding on any of the 23 guards below blocked `pnpm pr:land` on every open
      # PR at once while the required `ci` check stayed green. Nothing exempts
      # this check-run at the gate — the fix is that this step stops
      # manufacturing a red the contract never wanted, so a WARN-findings run
      # concludes SUCCESS and there is no red to exempt.
      #
      # WARN findings stay fully VISIBLE: each flagged step is annotated red in
      # the PR's Checks UI (a `continue-on-error` step failure is still recorded
      # per step), its log carries the findings, and the summary below names every
      # flagged guard in one place. Invisible WARN is NOT the outcome here.
      #
      # `if: always()` so the report runs even after a step failed hard. A
      # `skipped` WARN step is NOT a finding.
      - name: WARN report (job summary — non-blocking by contract)
        if: always()
        env:
          WARN_OUTCOMES: |
            module-readme=${{ steps.warn_module_readme.outcome }}
            route-targets=${{ steps.warn_route_targets.outcome }}
            axe-exclude=${{ steps.warn_axe_exclude.outcome }}
            glossary-mdx=${{ steps.warn_glossary_mdx.outcome }}
            glossary-ids=${{ steps.warn_glossary_ids.outcome }}
            no-stub=${{ steps.warn_no_stub.outcome }}
            no-hardcoded-path=${{ steps.warn_no_hardcoded_path.outcome }}
            external-anchor=${{ steps.warn_external_anchor.outcome }}
            migration-index=${{ steps.warn_migration_index.outcome }}
            tsc-version=${{ steps.warn_tsc_version.outcome }}
            audit-coverage=${{ steps.warn_audit_coverage.outcome }}
            showcase-coverage=${{ steps.warn_showcase_coverage.outcome }}
            showcase-snippet=${{ steps.warn_showcase_snippet.outcome }}
            asset-format=${{ steps.warn_asset_format.outcome }}
            interaction-states=${{ steps.warn_interaction_states.outcome }}
            aa-contrast=${{ steps.warn_aa_contrast.outcome }}
            form-error=${{ steps.warn_form_error.outcome }}
            form-rhythm=${{ steps.warn_form_rhythm.outcome }}
            submit-pending=${{ steps.warn_submit_pending.outcome }}
            ears-tests=${{ steps.warn_ears_tests.outcome }}
            ears-naming=${{ steps.warn_ears_naming.outcome }}
            tdd-signal=${{ steps.warn_tdd_signal.outcome }}
            product-note=${{ steps.warn_product_note.outcome }}
            workflow-auth=${{ steps.warn_workflow_auth.outcome }}
        run: |
          failed="$(printf '%s\n' "$WARN_OUTCOMES" | grep -E '=failure$' | cut -d= -f1 || true)"
          echo "### WARN guards (ADR-0007 §2.6 posture)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$failed" ]; then
            echo "All WARN guards clean."
            echo "All WARN guards clean." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "WARN guard(s) with findings (see each step's log):"
          printf '%s\n' "$failed"
          printf -- '- `%s`\n' $failed >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "WARN is visible, never merge-blocking (ADR-0007 §2.6): these guards are not in the \`ci\` needs-list, and this step exits 0, so the check-run stays green and no merge gate is blocked. Fix the findings or promote the guard — do not silence it." >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # ─── Runtime a11y / interaction tiers (browser profile) ───────────────
  # playwright-axe: the RUNTIME twin of the `interaction-states` STATIC lint
  # (ADR-0013 §7 layer 4, #274). RETARGETED onto the design-system showcase
  # (apps/showcase) per design-system-showcase spec §5.2 (#351): it builds the
  # showcase, boots it with `next start` (via the CI Playwright config's
  # `webServer`), and drives the real rendered catalogue — an interaction smoke
  # (computed cursor pointer/not-allowed, hover style delta, keyboard
  # focus-visible ring) + an axe-core a11y/contrast scan of every showcase route
  # (/, /tokens, /primitives, /blocks, /candidates). Because the showcase renders
  # every primitive/block in every state in one place, this is a STRICT SUPERSET
  # of the prior auth-only checks at the PRIMITIVE level (page-level portal
  # coverage lives in the sibling `playwright-axe-portal` job below, #400).
  # BACKEND-FREE — the showcase is a pure viewer with no BFF, so no api / Zitadel
  # / Mailpit / Postgres. BLOCKING per ADR-0007 §2.6 (promoted from WARN once
  # stable, #285), so this gate is wired into the `ci` meta-job needs-list. The
  # static twin (`interaction-states`, L3) stays WARN for now.
  #
  # Kept as its own job (#1235): the `browser` pool profile is a separate lane
  # from `heavy`, so batching it in would only serialize it.
  #
  # PATH-GATED (#1251): it drives the rendered showcase, which no docs-class file
  # feeds — skipped on a docs-only diff.
  playwright-axe:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Build the showcase (and its workspace deps) so `next start` serves a real
      # production build — the same path the `build` step exercises, no special env.
      - run: pnpm exec turbo run build --filter=@ds/showcase
      - run: pnpm --filter @ds/showcase exec playwright install --with-deps chromium
      - run: pnpm --filter @ds/showcase test:e2e:ci

  # playwright-axe-portal: the PAGE-LEVEL twin of `playwright-axe` (#400 — the
  # #351 showcase retarget retired the portal CI tier; this re-adds a THIN
  # product-surface scan). The showcase gate covers the DS primitives; this job
  # scans the COMPOSED portal auth pages (/login /register /reset) for what only
  # a real page can violate: landmark structure, heading hierarchy (exactly-one
  # h1), plus the full WCAG 2 A/AA axe rule set. BACKEND-FREE — the auth pages
  # render their forms client-side and the spec never submits, so no api /
  # Zitadel / Mailpit / Postgres and no special build env (same cold-build path
  # as the `build` step). BLOCKING alongside `playwright-axe` (restores coverage
  # that was BLOCK before #351), so it is wired into the `ci` needs-list.
  #
  # PATH-GATED (#1251), same rationale as `playwright-axe`: it scans the composed
  # portal auth pages, which no docs-class file feeds.
  playwright-axe-portal:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Build the portal (and its workspace deps) so `next start` serves a real
      # production build — the same path the `build` step exercises, no special env.
      - run: pnpm exec turbo run build --filter=@ds/portal
      - run: pnpm --filter @ds/portal exec playwright install --with-deps chromium
      - run: pnpm --filter @ds/portal test:e2e:ci

  # ─── AI-specific guards from ADR-0007 §2.6 ───────────────────────────
  # The PR-body-parsing guard family (spec-link BLOCK, registry-research,
  # spec-status-fresh, prior-decisions, spec-deletion, epic-autoclose) lives in
  # `pr-body-guards.yml` (#651), collapsed there into one batch job (#1235): a
  # dedicated workflow that also triggers on the PR `edited` event, so a body
  # edit re-runs the guards without re-running this matrix. spec-link is
  # therefore NOT in the `ci` aggregate needs-list — the merge gate reads its
  # head-SHA-pinned check-run directly (tools/gh/merge-gate.mjs).

  # ─── Meta-job: single status check for branch protection ─────────────
  # Phase 0 baseline: every hard-red job that actually runs today sits in this
  # needs-list (#440) — a job is either here (BLOCK), carries per-step WARN
  # (`guards-warn`), or is `if: false` (placeholder until its precondition
  # lands: api-drift, generated-artifacts — db-drift is live since #1236, as a
  # `guards-block` STEP, so it is covered here through that job). WARN-only work is
  # intentionally excluded. WARN→BLOCK promotion criterion + sweep cadence:
  # ADR-0007 §2.6 (settled in #427; first sweep 2026-07-02 — per-guard verdicts
  # recorded on the Issue); promoting a guard now means moving its STEP from the
  # `guards-warn` batch into `guards-block` (and dropping its row from that
  # batch's WARN-report step). Dropping `continue-on-error` IS the promotion:
  # from that moment the guard's failure fails a check-run the merge gate blocks
  # on (#1253).
  # Job name must stay `ci` — branch protection on `main` (per ADR-0008
  # §2.6 item 4) requires exactly one status check context named `ci`.
  # Renaming this job breaks merge gating.
  ci:
    needs:
      [
        changes,
        core,
        api-e2e,
        guards-block,
        playwright-axe,
        playwright-axe-portal,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Two classes of need, because #1251 made `skipped` a LEGITIMATE outcome
      # for three of them. The old blanket
      # `contains(needs.*.result, 'skipped') → red` cannot be kept: it would red
      # every docs-only PR. It also cannot simply be dropped — the #449 Mode (a)
      # finding it encodes is real (a red upstream job skips its dependents, and
      # the aggregate would go green on a run where nothing built or tested). So
      # the two classes are enumerated EXPLICITLY, never derived from `needs.*`:
      #
      #   UNCONDITIONAL — `changes`, `core`, `guards-block`. These carry no
      #   `if:`, so `skipped` can only mean "an upstream need failed" and
      #   `success` is the ONLY green outcome. `changes` is in this class on
      #   purpose: it is what decides the other class, so a broken classifier
      #   must red `ci` rather than skip the gated jobs into a free green.
      #
      #   PATH-GATED — `api-e2e`, `playwright-axe`, `playwright-axe-portal`.
      #   `success` OR `skipped` is green; `failure`/`cancelled` is still red.
      #   `skipped` here is reachable ONLY via `needs.changes.outputs.code`
      #   (a docs-only diff) or via `changes` itself not succeeding — and that
      #   second path is already red through the unconditional class above.
      #
      # Net: a docs-only PR is green with three SKIPPED jobs; any FAILURE in any
      # of the six is still red; a run where the classifier broke is red.
      - name: Aggregate
        env:
          UNCONDITIONAL: |
            changes=${{ needs.changes.result }}
            core=${{ needs.core.result }}
            guards-block=${{ needs['guards-block'].result }}
          PATH_GATED: |
            api-e2e=${{ needs['api-e2e'].result }}
            playwright-axe=${{ needs['playwright-axe'].result }}
            playwright-axe-portal=${{ needs['playwright-axe-portal'].result }}
        run: |
          fail=0

          while IFS='=' read -r job result; do
            if [ -z "$job" ]; then continue; fi
            if [ "$result" != "success" ]; then
              echo "RED — required job '$job' is '$result' (must be success)"
              fail=1
            else
              echo "ok — '$job' = success"
            fi
          done <<EOF
          $UNCONDITIONAL
          EOF

          while IFS='=' read -r job result; do
            if [ -z "$job" ]; then continue; fi
            case "$result" in
              success|skipped) echo "ok — path-gated '$job' = $result" ;;
              *)
                echo "RED — path-gated job '$job' is '$result' (must be success or skipped)"
                fail=1
                ;;
            esac
          done <<EOF
          $PATH_GATED
          EOF

          if [ "$fail" != 0 ]; then
            echo "Required job failed, was cancelled, or was skipped without a path gate"
            exit 1
          fi
          echo "All required jobs green (path-gated jobs may be skipped — #1251)"
