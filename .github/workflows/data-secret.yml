name: Data-box secret

# The data-box secret rotation (#4068; spec
# apps/docs/content/specs/tech/2026-10-16-release-pipeline-off-workstation-en.md §4
# «Secrets and access», §5 «Data-prod verbs.» → secret-recipient / secret-apply;
# runbook infra/deploy/README.md → «Rotating the box's pgBackRest S3 key»). No
# break-glass key and no hand-run `docker compose` on ds-data-prod.
#
#   gh workflow run data-secret.yml --ref main -f action=recipient
#   gh workflow run data-secret.yml --ref main -f action=tunnel-key
#   gh workflow run data-secret.yml --ref main -f action=apply -f sha=<live sha> \
#     -f owner_quote="<the owner's words>" -f ciphertext=<`pnpm prod:data-secret` output>
#
#   recipient — prints ds-data-prod's intake certificate (public) and its fingerprint;
#               the box generates the key pair on first call and never lets the key
#               out. The operator commits it as infra/deploy/keys/data-secret-recipient.pem.
#   tunnel-key  — box=data only (#4287): prints the public key of ds-data-prod's repo2
#               tunnel to the relay host and its SHA256 fingerprint; the box generates the
#               ed25519 pair on first call and never lets the private key out. The relay's
#               owner adds it (infra/deploy/README.md → «repo2 through the tunnel»).
#   apply     — the owner's word as for an env-change redeploy. ds-api-prod's forced
#               command `data-secret-apply prod <sha>` (the live SHA only, refused while
#               any ds-prod-* unit runs) hands the ciphertext over the hop to
#               ds-data-prod, which decrypts it, checks the allowlisted names and value
#               shapes and starts the durable unit ds-prod-<sha12>-data-secret: data.env
#               backed up, the lines replaced, postgres + pgbackrest recreated with
#               data-up's command on the recorded image overlay, `pgbackrest check`; a
#               failed check puts the backup back and recreates again. The job polls,
#               then closes the attempt with `finish`.
# box=api: the same on ds-api-prod itself, with its own intake key
#   (infra/deploy/keys/api-secret-recipient.pem) and verbs `api-secret-*`: the unit
#   ds-prod-<sha12>-api-secret backs up api.env / the compose .env, replaces or appends
#   the allowlisted lines, recreates every container on the live SHA's images (the
#   redeploy's recreate) and checks /v1/health at the live SHA; a failed check puts both
#   backups back and recreates again.
#
# The repository is public: the input is ciphertext only — the values never enter
# GitHub (no input, secret or log line) — and the log carries status lines only.

run-name: Box secret ${{ inputs.box }} ${{ inputs.action }} ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      box:
        description: "`data` (ds-data-prod's data.env) or `api` (ds-api-prod's api.env and compose .env)."
        required: true
        default: data
        type: choice
        options:
          - data
          - api
      action:
        description: "`recipient` (print the box's intake certificate), `apply` (change the box's env lines) or `tunnel-key` (box=data: print repo2's tunnel public key)."
        required: true
        type: choice
        options:
          - recipient
          - apply
          - tunnel-key
      sha:
        description: "Apply: the live prod SHA (full 40 hex)."
        required: false
        type: string
      owner_quote:
        description: "Apply: the owner's word in chat, verbatim."
        required: false
        type: string
      ciphertext:
        description: "Apply: the base64 line `pnpm prod:data-secret` / `pnpm prod:api-secret` printed for this sha (valid 6 h, once)."
        required: false
        type: string

permissions:
  contents: read

# One rotation at a time, none cancelled. Not the release's `deploy-prod` group: a
# GitHub group keeps one pending run, so a rotation could cancel a queued release.
# The boxes keep the two apart: the apply refuses while any ds-prod-* unit runs (a
# release's -driver included), and a release or a redeploy refuses while the
# rotation unit runs.
concurrency:
  group: data-secret
  cancel-in-progress: false

env:
  # ds-api-prod's public address, as deploy-prod.yml.
  PROD_SSH_HOST: 77.233.220.222
  PROD_SSH_USER: deploy

jobs:
  data-secret:
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    # The poll below gives up after 20 min; the job limit only backs it up.
    timeout-minutes: 30
    steps:
      - name: Check the inputs
        env:
          ACTION: ${{ inputs.action }}
          BOX: ${{ inputs.box }}
          SHA: ${{ inputs.sha }}
          OWNER_QUOTE: ${{ inputs.owner_quote }}
          CIPHERTEXT: ${{ inputs.ciphertext }}
        run: |
          [ "$ACTION" = recipient ] && exit 0
          if [ "$ACTION" = tunnel-key ]; then
            [ "$BOX" = data ] || { echo "::error::tunnel-key is ds-data-prod's (box=data)"; exit 1; }
            exit 0
          fi
          if [ -z "${OWNER_QUOTE//[[:space:]]/}" ]; then
            echo "::error::owner_quote is empty — a box secret change needs the owner's word in chat"
            exit 1
          fi
          echo "owner quote: present (${#OWNER_QUOTE} chars)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full sha: $SHA"; exit 1; }
          # The shape only; the box decrypts and checks the contents.
          [[ ${#CIPHERTEXT} -le 16384 && "$CIPHERTEXT" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] ||
            { echo "::error::ciphertext is not one base64 line of at most 16384 characters"; exit 1; }
          echo "ciphertext: present (${#CIPHERTEXT} chars)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Write the ssh key
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/prod-ssh"
          mkdir -p "$dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$dir/key"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$dir/known_hosts"
          chmod 600 "$dir/key" "$dir/known_hosts"

      - name: Print the intake certificate
        if: inputs.action == 'recipient'
        env:
          BOX: ${{ inputs.box }}
        run: |
          ssh -i "$RUNNER_TEMP/prod-ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/prod-ssh/known_hosts" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "$PROD_SSH_USER@$PROD_SSH_HOST" "$BOX-secret-recipient prod" </dev/null

      - name: Print the repo2 tunnel public key
        if: inputs.action == 'tunnel-key'
        run: |
          ssh -i "$RUNNER_TEMP/prod-ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/prod-ssh/known_hosts" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "$PROD_SSH_USER@$PROD_SSH_HOST" "data-repo2-tunnel-key prod" </dev/null

      - name: Apply, poll and close the rotation
        if: inputs.action == 'apply'
        env:
          BOX: ${{ inputs.box }}
          SHA: ${{ inputs.sha }}
          CIPHERTEXT: ${{ inputs.ciphertext }}
        run: |
          box() {
            ssh -i "$RUNNER_TEMP/prod-ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/prod-ssh/known_hosts" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
              "$PROD_SSH_USER@$PROD_SSH_HOST" "$@"
          }
          # The box prints status lines only (names, unit, refusal reason).
          printf '{"ciphertext":"%s"}' "$CIPHERTEXT" | box "$BOX-secret-apply prod $SHA"
          state=running
          for _ in $(seq 1 80); do
            sleep 15
            if ! json=$(box "$BOX-secret-status prod $SHA" </dev/null 2>"$RUNNER_TEMP/ssh.err"); then
              echo "status: ssh failed ($(head -n 1 "$RUNNER_TEMP/ssh.err"))"
              continue
            fi
            state=$(printf '%s' "$json" | node tools/deploy/data-secret.mjs verdict --box "$BOX" "$SHA")
            [ "$state" = running ] || break
          done
          if [ "$state" = running ]; then
            echo "::error::the $BOX-secret unit did not end within 20 min; re-run this workflow with the same inputs to attach"
            exit 1
          fi
          box "$BOX-secret-finish prod $SHA $state" </dev/null
          if [ "$state" != succeeded ]; then
            if [ "$BOX" = api ]; then
              echo "::error::the new values failed /v1/health; ds-api-prod runs the previous api.env and compose .env again"
            else
              echo "::error::the new values failed pgbackrest check; ds-data-prod runs the previous data.env again"
            fi
            exit 1
          fi

      - name: Remove the ssh key
        if: always()
        run: rm -rf "$RUNNER_TEMP/prod-ssh"
