name: Deploy prod

# The production release, run from Actions on the owner's word in chat (#3158; spec
# apps/docs/content/specs/tech/2026-10-16-release-pipeline-off-workstation-en.md
# §3 item 3, §4, §5 «Prod release driver.», §8 step (e)).
#
#   gh workflow run deploy-prod.yml --ref main -f sha=<sha> -f owner_quote="<the owner's words>"
#
#   preflight — refuses an empty or whitespace-only owner_quote before anything
#               else, then `tools/deploy/release-runner.mjs preflight`: the SHA is in
#               `main`, `stage-suite` is success, CI is green, the release gate and
#               the live-broadcast gate pass, the recorded `images-<sha>.json` exists.
#   deploy    — Environment `production` (deployment branches `main`, no required
#               reviewer, `deployment: false`): ships the manifest to ds-api-prod's
#               forced command `release prod <sha>` (the prod release driver, a
#               `systemd-run` unit that runs every box step, smoke included, and
#               survives this job's death) and polls `status prod <sha>`, printing
#               status lines only (spec §4: the repository's Actions logs are public).
#               After a terminal status: the release cut (success only) and the ONE
#               GitHub Deployment record, success or failure, carrying the quote.
#   digest    — on success, the Mattermost digest through `release-digest.yml`. The
#               record above is written with GITHUB_TOKEN, whose events start no
#               workflow, so its `deployment_status` trigger never fires for it.
#
# Rollback mode (#2987; spec §3 item 3 «Rollback mode», §5 «Prod rollback», §9
# «A release broke prod»):
#
#   gh workflow run deploy-prod.yml --ref main -f mode=rollback -f sha=<target sha> -f reason="<why>"
#
#   preflight — refuses an empty or whitespace-only reason (no owner quote: a release
#               that visibly broke prod is rolled off without an owner word, §10),
#               then `release-runner.mjs rollback-preflight`: the SHA is the target of
#               one of the latest 3 `release-*` Releases, strictly behind the live
#               SHA, with its `images-<sha>.json` recorded. No stage-suite, release
#               gate or live-broadcast check.
#   deploy    — the same Environment and key: `rollback prod <sha>` with the manifest
#               on stdin, polls `rollback-status prod <sha>` (status lines only; the
#               verdict reads the unit state as well as the record), then no release
#               cut, the ONE Deployment record `rollback to <sha12> — <reason>` and the
#               Mattermost notice «откат прода на <sha12>: <reason>». No digest.
#
# Redeploy mode (#3354; spec §3 item 3 «Redeploy mode», §5 «Prod release driver.»,
# §9 «An env file changed on the box»):
#
#   gh workflow run deploy-prod.yml --ref main -f mode=redeploy -f sha=<live sha> -f owner_quote="<the owner's words>"
#
#   preflight — refuses a blank owner_quote exactly as a release does, then
#               `release-runner.mjs redeploy-preflight`: the SHA has a success
#               production Deployment (it really was released) and its
#               `images-<sha>.json` is recorded. No stage-suite, CI, release-gate or
#               live-broadcast check: the SHA passed them when it was released.
#   deploy    — the same start, poll and status-only log as a release, with the verb
#               `redeploy prod <sha>`: the driver refuses unless <sha> is the live prod
#               SHA and runs that release again as a fresh attempt, every container
#               recreated with the box's current env files. Then no release cut and
#               a new Deployment record `redeploy @ <sha12> — «<quote>»`. No digest.
#
# The rollback runs on this path; the escape hatches do not: no skip-ci-check,
# release-gate exemption, live-broadcast override or hotfix ref. Those stay
# break-glass on the workstation path (`pnpm deploy:prod`).

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-hex SHA on `main` to release.
        required: true
        type: string
      mode:
        description: "`release` (default), `rollback` to a recent release behind the live SHA, or `redeploy` of the live SHA (recreates its containers with the box's current env files)."
        required: false
        default: release
        type: choice
        options:
          - release
          - rollback
          - redeploy
      owner_quote:
        description: "Release and redeploy mode: the owner's word in chat that authorises this run, verbatim."
        required: false
        type: string
      reason:
        description: "Rollback mode: why production is rolled back (required in that mode)."
        required: false
        type: string

permissions:
  contents: read

# One release at a time, none cancelled. Its own group: the changesets workflow
# `release.yml` holds `release`, and a push to `main` must never cancel a release
# waiting here (#3125). The box `flock` + `ds-release` lease is the last line.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  SHA: ${{ inputs.sha }}
  # ds-api-prod's public address (`api_prod_public_ip`, infra/deploy/README.md).
  # The `ds-api-prod` ssh alias exists only in operator ssh configs.
  PROD_SSH_HOST: 77.233.220.222
  PROD_SSH_USER: deploy

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      # The release gate's basis fallback reads the production Deployment.
      deployments: read
      # The release gate lists `release-blocker` Issues and reads range PRs.
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      images-run-id: ${{ steps.preflight.outputs.images-run-id || steps.rollback-preflight.outputs.images-run-id || steps.redeploy-preflight.outputs.images-run-id }}
    steps:
      - name: Refuse an empty owner quote or rollback reason
        env:
          MODE: ${{ inputs.mode }}
          OWNER_QUOTE: ${{ inputs.owner_quote }}
          REASON: ${{ inputs.reason }}
        run: |
          case "$MODE" in
            release | redeploy)
              if [ -z "${OWNER_QUOTE//[[:space:]]/}" ]; then
                echo "::error::owner_quote is empty — every production release and redeploy needs the owner's word in chat"
                exit 1
              fi
              echo "owner quote: present (${#OWNER_QUOTE} chars)" ;;
            rollback)
              if [ -z "${REASON//[[:space:]]/}" ]; then
                echo "::error::reason is empty — a rollback records why production is rolled back"
                exit 1
              fi
              echo "rollback reason: present (${#REASON} chars)" ;;
            *)
              echo "::error::mode must be release, rollback or redeploy"
              exit 1 ;;
          esac

      - name: Check the SHA
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full sha: $SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The SHA-in-main check, the release gate's range and the release notes
          # walk git history; a shallow clone fails them.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Runner pre-flight
        id: preflight
        if: inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node tools/deploy/release-runner.mjs preflight --sha "$SHA"

      - name: Rollback pre-flight
        id: rollback-preflight
        if: inputs.mode == 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REASON: ${{ inputs.reason }}
        run: node tools/deploy/release-runner.mjs rollback-preflight --sha "$SHA"

      - name: Redeploy pre-flight
        id: redeploy-preflight
        if: inputs.mode == 'redeploy'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER_QUOTE: ${{ inputs.owner_quote }}
        run: node tools/deploy/release-runner.mjs redeploy-preflight --sha "$SHA"

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    # The poll below gives up after 60 min; the job limit only backs it up.
    timeout-minutes: 75
    outputs:
      # `new` = this run wrote the Deployment record; `existing` = already recorded.
      recorded: ${{ steps.record.outputs.recorded }}
    permissions:
      actions: read
      checks: read
      # The release cut (`gh release create`).
      contents: write
      deployments: write
      issues: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release cut and the release notes walk tags and history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download images-<sha>.json from the recorded run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images-${{ inputs.sha }}
          run-id: ${{ needs.preflight.outputs.images-run-id }}
          github-token: ${{ github.token }}
          path: manifest

      - name: Write the ssh key
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/prod-ssh"
          mkdir -p "$dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$dir/key"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$dir/known_hosts"
          chmod 600 "$dir/key" "$dir/known_hosts"

      - name: Start the release driver
        id: release
        if: inputs.mode != 'rollback'
        env:
          MODE: ${{ inputs.mode }}
        run: |
          # A redeploy is the same driver run of the live SHA, as a fresh attempt.
          verb=release
          if [ "$MODE" = redeploy ]; then verb=redeploy; fi
          set +e
          line=$(ssh -i "$RUNNER_TEMP/prod-ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/prod-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "$PROD_SSH_USER@$PROD_SSH_HOST" "$verb prod $SHA" \
            < "manifest/images-$SHA.json" 2>&1)
          rc=$?
          set -e
          # The driver prints ONE status line (no secret, no journal, no compose
          # output); only its first line is ever shown.
          first=$(printf '%s\n' "$line" | head -n 1)
          echo "$verb: rc=$rc $first"
          # `started` / `attached` / `already-succeeded` (a release only) — the poll
          # needs to know.
          echo "outcome=$(printf '%s' "$first" | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) ;;
            3) echo "::error::$verb refused: $first"; exit 1 ;;
            *) echo "::error::$verb failed (rc=$rc)"; exit 1 ;;
          esac

      - name: Poll the driver until it is terminal
        id: poll
        if: inputs.mode != 'rollback'
        env:
          OUTCOME: ${{ steps.release.outputs.outcome }}
        run: |
          # 60 min = 240 polls x 15 s: today's operator release (backup, pull,
          # migrate, IdP converge, up, smoke) runs well under 30 min; the rest is
          # margin.
          deadline=$((SECONDS + 60 * 60))
          ssh_failures=0
          # The last readable status reply: lost contact still records its basis.
          last_json='{}'
          # The terminal verdict + the release-notes basis, for the record step.
          # `unknown` = the runner lost contact (ssh down, or the time-out): the
          # record step writes the `error` Deployment record before the job fails.
          terminal() {
            echo "terminal=$1" >> "$GITHUB_OUTPUT"
            prev=$(jq -r '.driver.previousSha // ""' <<<"$last_json")
            [[ "$prev" =~ ^[0-9a-f]{40}$ ]] || prev=""
            echo "previous-sha=$prev" >> "$GITHUB_OUTPUT"
          }
          while :; do
            set +e
            json=$(ssh -i "$RUNNER_TEMP/prod-ssh/key" \
              -o UserKnownHostsFile="$RUNNER_TEMP/prod-ssh/known_hosts" \
              -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
              "$PROD_SSH_USER@$PROD_SSH_HOST" "status prod $SHA" \
              2>"$RUNNER_TEMP/ssh.err" | head -n 1; exit "${PIPESTATUS[0]}")
            ssh_rc=$?
            set -e
            # rc 255 = ssh itself failed (host key, auth, network): four in a row
            # (~1 min) fail fast. The driver unit keeps running on the box; a
            # re-dispatch of the same SHA reattaches to it.
            if [ "$ssh_rc" -eq 255 ]; then
              ssh_failures=$((ssh_failures + 1))
              echo "status: ssh failed ($(head -n 1 "$RUNNER_TEMP/ssh.err"))"
              if [ "$ssh_failures" -ge 4 ]; then
                echo "::error::ssh to ds-api-prod failed $ssh_failures times in a row"
                terminal unknown
                exit 1
              fi
              sleep 15
              continue
            fi
            ssh_failures=0
            if ! line=$(jq -er '"driver=\(.driver.active // "?") rc=\(.driver.rc // "-") step=\(.release.step // "-") state=\(.release.state // "-")"' <<<"$json" 2>/dev/null); then
              echo "status: unreadable reply"
            else
              echo "status: $line"
              last_json=$json
              active=$(jq -r '.driver.active // ""' <<<"$json")
              rc=$(jq -r '.driver.rc // ""' <<<"$json")
              state=$(jq -r '.release.state // ""' <<<"$json")
              # Nothing was started: the record alone decides, on the first reply.
              if [ "$OUTCOME" = "already-succeeded" ]; then
                if [ "$state" = "succeeded" ]; then
                  terminal succeeded; echo "release: already succeeded"; exit 0
                fi
                echo "::error::driver said already-succeeded, record says state=${state:--}"
                exit 1
              fi
              case "$active" in
                inactive|failed|absent)
                  if [ "$rc" = "0" ] && [ "$state" = "succeeded" ]; then
                    terminal succeeded; echo "release: succeeded"; exit 0
                  fi
                  terminal failed
                  echo "::error::release failed (driver=$active rc=${rc:--} state=${state:--})"
                  exit 1 ;;
              esac
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the release did not finish within 60 min (the driver unit keeps running on the box)"
              terminal unknown
              exit 1
            fi
            sleep 15
          done

      - name: Start the rollback driver
        id: rollback
        if: inputs.mode == 'rollback'
        run: |
          set +e
          line=$(ssh -i "$RUNNER_TEMP/prod-ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/prod-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "$PROD_SSH_USER@$PROD_SSH_HOST" "rollback prod $SHA" \
            < "manifest/images-$SHA.json" 2>&1)
          rc=$?
          set -e
          # One status line, as the release driver's: `started` / `attached`.
          first=$(printf '%s\n' "$line" | head -n 1)
          echo "rollback: rc=$rc $first"
          case "$rc" in
            0) ;;
            3) echo "::error::rollback refused: $first"; exit 1 ;;
            *) echo "::error::rollback failed (rc=$rc)"; exit 1 ;;
          esac

      - name: Poll the rollback until it is terminal
        id: rollback-poll
        if: inputs.mode == 'rollback'
        run: |
          # 30 min = 120 polls x 15 s: an app-only `up -d` of recorded digests, the
          # running-SHA verify and the smoke; no build, no migrate.
          deadline=$((SECONDS + 30 * 60))
          ssh_failures=0
          from=-
          # `unknown` = lost contact (ssh down, or the time-out): the record step
          # writes the `error` Deployment record before the job fails.
          terminal() {
            echo "terminal=$1" >> "$GITHUB_OUTPUT"
            [[ "$from" =~ ^[0-9a-f]{40}$ ]] || from=""
            echo "from-sha=$from" >> "$GITHUB_OUTPUT"
          }
          while :; do
            set +e
            json=$(ssh -i "$RUNNER_TEMP/prod-ssh/key" \
              -o UserKnownHostsFile="$RUNNER_TEMP/prod-ssh/known_hosts" \
              -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
              "$PROD_SSH_USER@$PROD_SSH_HOST" "rollback-status prod $SHA" \
              2>"$RUNNER_TEMP/ssh.err" | head -n 1; exit "${PIPESTATUS[0]}")
            ssh_rc=$?
            set -e
            if [ "$ssh_rc" -eq 255 ]; then
              ssh_failures=$((ssh_failures + 1))
              echo "status: ssh failed ($(head -n 1 "$RUNNER_TEMP/ssh.err"))"
              if [ "$ssh_failures" -ge 4 ]; then
                echo "::error::ssh to ds-api-prod failed $ssh_failures times in a row"
                terminal unknown
                exit 1
              fi
              sleep 15
              continue
            fi
            ssh_failures=0
            # The verdict reads the unit state as well as the record: a dead unit
            # whose record still says `running` is a failure (release-runner.mjs).
            read -r verdict rb_from line < <(printf '%s' "$json" |
              node tools/deploy/release-runner.mjs rollback-verdict --sha "$SHA") ||
              verdict=unreadable
            echo "status: ${line:-unreadable reply}"
            [ "${rb_from:--}" = "-" ] || from=$rb_from
            case "$verdict" in
              succeeded)
                terminal succeeded; echo "rollback: succeeded"; exit 0 ;;
              failed)
                terminal failed
                echo "::error::rollback failed ($line)"
                exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the rollback did not finish within 30 min (the rollback unit keeps running on the box)"
              terminal unknown
              exit 1
            fi
            sleep 15
          done

      - name: Remove the ssh key
        if: always()
        run: rm -rf "$RUNNER_TEMP/prod-ssh"

      # Success, failure and lost contact alike, once the poll set a verdict. A
      # success already recorded for the SHA writes nothing (`recorded=existing`).
      - name: Release cut and the Deployment record
        id: record
        if: always() && inputs.mode == 'release' && steps.poll.outputs.terminal != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER_QUOTE: ${{ inputs.owner_quote }}
          TERMINAL: ${{ steps.poll.outputs.terminal }}
          PREVIOUS_SHA: ${{ steps.poll.outputs.previous-sha }}
        run: |
          node tools/deploy/release-runner.mjs record --sha "$SHA" \
            --state "$TERMINAL" --previous-sha "$PREVIOUS_SHA"

      # Redeploy: no release cut, a new Deployment record of every run, with the quote.
      - name: The redeploy Deployment record
        id: redeploy-record
        if: always() && inputs.mode == 'redeploy' && steps.poll.outputs.terminal != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER_QUOTE: ${{ inputs.owner_quote }}
          TERMINAL: ${{ steps.poll.outputs.terminal }}
        run: node tools/deploy/release-runner.mjs redeploy-record --sha "$SHA" --state "$TERMINAL"

      # Rollback: no release cut, the ONE Deployment record with the reason.
      - name: The rollback Deployment record
        id: rollback-record
        if: always() && inputs.mode == 'rollback' && steps.rollback-poll.outputs.terminal != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REASON: ${{ inputs.reason }}
          TERMINAL: ${{ steps.rollback-poll.outputs.terminal }}
          FROM_SHA: ${{ steps.rollback-poll.outputs.from-sha }}
        run: |
          node tools/deploy/release-runner.mjs rollback-record --sha "$SHA" \
            --state "$TERMINAL" --from-sha "$FROM_SHA"

      # Not a release digest (release-digest.yml owns that): the team's notice.
      - name: The rollback notice to Mattermost
        if: always() && inputs.mode == 'rollback' && steps.rollback-poll.outputs.terminal != ''
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          REASON: ${{ inputs.reason }}
          TERMINAL: ${{ steps.rollback-poll.outputs.terminal }}
        run: node tools/deploy/release-runner.mjs rollback-notice --sha "$SHA" --state "$TERMINAL"

  digest:
    needs: deploy
    # Only a release's newly written success record: a re-dispatch whose success is
    # already recorded posts no second digest; a rollback or redeploy ships no new code.
    if: inputs.mode == 'release' && needs.deploy.result == 'success' && needs.deploy.outputs.recorded == 'new'
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    uses: ./.github/workflows/release-digest.yml
    with:
      sha: ${{ inputs.sha }}
    # A called workflow gets only the secrets its caller passes.
    secrets:
      MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
