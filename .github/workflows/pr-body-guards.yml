# PR-body-parsing guard family (Issue #651) — spec-link, registry-research,
# spec-status-fresh, prior-decisions, spec-deletion, catalog-deletion,
# epic-autoclose (ADR-0007 §2.6). These guards evaluate the PR body/metadata, so they live in a DEDICATED
# workflow that also triggers on the `edited` activity type: a post-create body
# edit re-runs exactly these checks and never the full test/build matrix in
# ci.yml (whose `pull_request` trigger keeps the default
# opened/synchronize/reopened set). The in-place alternative (adding `edited` to
# ci.yml and fencing every heavy job) was rejected: the `ci` aggregate treats
# skipped needs as red (#449), so an edited-event run would poison the meta-job.
#
# ONE BATCH JOB (#1235). The six guards were six jobs, each paying its own
# checkout + `pnpm install` — six installs to run six sub-second body parsers.
# They are now sequential steps of a single job. Posture is preserved exactly,
# re-encoded from per-JOB to per-STEP:
#   • `spec-link` is BLOCK → a plain step (fails the job → red check-run the
#     merge gate reads). It runs LAST so a spec-link failure never skips the
#     WARN guards' findings.
#   • every other member is WARN → `continue-on-error: true` on the STEP so one
#     flagged guard never stops the others, PLUS a final `if: always()`
#     WARN-REPORT step that lists every flagged guard in the job summary and
#     exits 0. WARN is visible and NEVER merge-blocking (ADR-0007 §2.6, #1253):
#     this check-run's red is reserved for the BLOCK member. The JOB is never
#     `continue-on-error` — that would mask the BLOCK member and hide infra
#     failures.
# The job's `permissions` block is the UNION of the six old blocks
# (`contents: read` + `pull-requests: read` + `issues: read`), and every step
# keeps its own `GH_TOKEN`/`PR_NUMBER`/`PR_BODY` wiring — the Issue-#10 pattern
# the `workflow-auth` guard enforces.
#
# Reliable body on the ORIGINAL event (#651 recurrence, PR #685): each guard
# step passes the event payload's body via `PR_BODY` — the payload is always
# current for its triggering event, while a fresh `gh pr view` REST read right
# after PR creation has returned a stale/absent body with no edit at all. The
# override seam lives in tools/lint/lib/gh.ts (narrow: PR-kind + PR_NUMBER
# match + `body` requested); `pnpm pr:preflight` never sets PR_BODY, so local
# preflight behavior is unchanged.
#
# No-op fence: a title-only edit does not change guard inputs — the job skips
# `edited` runs whose payload lacks `changes.body`. A `skipped` conclusion is
# tolerated as green by the merge gate (tools/gh/merge-gate.mjs).
name: PR body guards

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  pr-body-guards:
    if: github.event.action != 'edited' || github.event.changes.body != null
    runs-on: ubuntu-latest
    # Union of the six former per-job blocks:
    #   contents/pull-requests: read — the Issue-#10 pattern every guard needs;
    #   issues: read — `gh issue view` on linked Issues (spec-link, #1232), the
    #     #608 fail-closed `Closes #N` fetch (spec-status-fresh, #1232), and the
    #     sub_issues API (epic-autoclose). 403s without it on a private repo.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      # FULL history: `spec-deletion` is diff-based and needs
      # `origin/main...HEAD` with `--name-status --find-renames`.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # registry-research: a PR touching a user-facing UI surface must carry the
      # `build-ui-from-design-system` adoption artifact in its body (ADR-0013 /
      # AGENTS.md §6). WARN per the ADR-0007 §2.6 new-guard posture — promote to
      # BLOCK once stable.
      - name: WARN · registry-research
        id: warn_registry_research
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm lint:registry-research

      # spec-status-fresh: a feature:NNN-<slug> PR whose bound spec is still
      # `status: Draft` (design §5.2, `In dev` minimum). Implemented as a REAL
      # WARN v1 in #438 — PR-event-gated, exempts the authoring PR that edits the
      # requirements file, EXITS NON-ZERO on a Draft-below-floor finding.
      # Promotion clock (ADR-0007 §2.6, 4 clean weeks) starts at merge —
      # 2026-07-02. Kept WARN until the sweep flips it; do not remove the
      # `continue-on-error` here.
      - name: WARN · spec-status-fresh
        id: warn_spec_status_fresh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm exec tsx tools/lint/spec-status-lint.ts

      # prior-decisions: a PR that adds/edits a feature-spec requirements file must
      # cite ≥1 ADR in a `## Prior decisions` section (design §5.2). Implemented as
      # a REAL WARN v1 in #438 — PR-event-gated, diff-scoped to touched
      # requirements files, EXITS NON-ZERO on findings. Promotion clock (ADR-0007
      # §2.6, 4 clean weeks) starts at merge — 2026-07-02. Kept WARN until the
      # sweep flips it.
      - name: WARN · prior-decisions
        id: warn_prior_decisions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm exec tsx tools/lint/prior-decisions-lint.ts

      # spec-deletion: a PR must not `git rm` a feature-spec / ADR file — specs and
      # ADRs are retired by a `status: Superseded`/`Retired` frontmatter transition,
      # never file removal (AGENTS.md §6 / ADR-0006 §7; the #971 incident: a complete
      # two-tier spec layer deleted inside an unrelated feature PR). DIFF-based, so it
      # needs the full history checked out above and diffs `origin/main...HEAD` for
      # `--name-status --find-renames` — a rename is not a deletion and passes. It
      # also runs on a body `edited` event so a newly-added `spec-deletion:` escape
      # marker re-clears the check. WARN v1 (ADR-0007 §2.6 new-guard posture); TO
      # PROMOTE TO BLOCK drop the `continue-on-error` line below AND its row from the
      # WARN-report step.
      - name: WARN · spec-deletion
        id: warn_spec_deletion
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          LINT_DIFF_BASE: origin/main
        run: pnpm exec tsx tools/lint/spec-deletion-lint.ts

      # catalog-deletion: a PR must not delete files under
      # `apps/docs/content/skills/**` — the AGENTS.md §3.3 dispatch contract —
      # without a `catalog-deletion: <reason>` body marker (Issue #1261: a Windows
      # `.agents/skills` junction let `git add -A` + `git reset --hard` wipe the whole
      # catalog, twice in one day, in two unrelated agents). DIFF-based like
      # `spec-deletion`, so it uses the full history checked out above and the
      # `origin/main...HEAD` three-dot diff; a rename passes. The hard-failing half of
      # this guard is its `--staged` pre-commit invocation (package.json
      # `simple-git-hooks.pre-commit`) — this step is the push-side visibility layer,
      # WARN v1 per the ADR-0007 §2.6 new-guard posture. TO PROMOTE TO BLOCK drop the
      # `continue-on-error` line below AND its row from the WARN-report step.
      - name: WARN · catalog-deletion
        id: warn_catalog_deletion
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          LINT_DIFF_BASE: origin/main
        run: pnpm exec tsx tools/lint/catalog-deletion-lint.ts

      # epic-autoclose: a child PR whose body writes `Closes #<epic>` would
      # auto-close a parent/epic issue on merge even while it still has OPEN
      # sub-issues (real incident: #927 auto-closed with open children — Issue #964).
      # This guard reads the native sub-issue graph at PR time and WARNs, telling the
      # author to link the specific child sub-issue instead of the epic. WARN v1 per
      # the ADR-0007 §2.6 new-guard posture — promote to BLOCK by removing
      # `continue-on-error` here (and its WARN-report row) AND flipping SEVERITY
      # in the guard source. Needs `issues: read` for the sub_issues API (granted on
      # the job above).
      - name: WARN · epic-autoclose
        id: warn_epic_autoclose
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm exec tsx tools/lint/epic-autoclose-lint.ts

      # spec-link: BLOCK. Not in the ci.yml `ci` aggregate needs-list
      # (cross-workflow `needs` is impossible) — the merge gate reads
      # head-SHA-pinned check-runs directly (tools/gh/merge-gate.mjs), so this
      # check still gates the merge: a failure here fails this job and turns the
      # `pr-body-guards` check-run red. Runs LAST so its hard failure never skips
      # the WARN guards above.
      - name: spec-link (BLOCK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm exec tsx tools/lint/spec-link-lint.ts

      # WARN report — the second half of the WARN encoding, and this batch's
      # VISIBILITY surface. It lists every WARN step whose `outcome` is `failure`
      # in the job summary and exits 0 by design.
      #
      # It replaces an aggregate that exited 1 to re-red this check-run, back
      # when `tools/gh/merge-gate.mjs` reded ANY non-success check-run — which
      # made a WARN finding block `pnpm pr:land` on every open PR, contradicting
      # ADR-0007 §2.6 (WARN is visible, never merge-blocking). Fixed in #1253.
      #
      # No classifier exempts this check-run by name — none exempts any name
      # (#1253). The batch is MIXED: it hosts the BLOCK `spec-link`, whose red IS
      # this check-run's red (cross-workflow `needs` is impossible, so
      # `spec-link` gates only through the head-SHA check-run the gate reads). A
      # check-run carries one bit, so the WARN/BLOCK decision is resolved HERE,
      # in the exit codes: only a BLOCK member — or an infra failure that means
      # the guards never ran — may turn it red.
      #
      # WARN findings stay fully VISIBLE: each flagged step is annotated red in
      # the Checks UI, its log carries the findings, and the summary below names
      # every flagged guard in one place.
      #
      # `if: always()` so the report runs after the BLOCK `spec-link` step failed
      # too. A `skipped` WARN step is NOT a finding.
      - name: WARN report (job summary — non-blocking by contract)
        if: always()
        env:
          WARN_OUTCOMES: |
            registry-research=${{ steps.warn_registry_research.outcome }}
            spec-status-fresh=${{ steps.warn_spec_status_fresh.outcome }}
            prior-decisions=${{ steps.warn_prior_decisions.outcome }}
            spec-deletion=${{ steps.warn_spec_deletion.outcome }}
            catalog-deletion=${{ steps.warn_catalog_deletion.outcome }}
            epic-autoclose=${{ steps.warn_epic_autoclose.outcome }}
        run: |
          failed="$(printf '%s\n' "$WARN_OUTCOMES" | grep -E '=failure$' | cut -d= -f1 || true)"
          echo "### WARN guards (ADR-0007 §2.6 posture)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$failed" ]; then
            echo "All WARN guards clean."
            echo "All WARN guards clean." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "WARN guard(s) with findings (see each step's log):"
          printf '%s\n' "$failed"
          printf -- '- `%s`\n' $failed >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "WARN is visible, never merge-blocking (ADR-0007 §2.6): these guards exit 0 here, so they do not fail this check-run and do not block \`merge:gate\`. Only the BLOCK member (\`spec-link\`) reds this check-run. Fix the findings or promote the guard — do not silence it." >> "$GITHUB_STEP_SUMMARY"
          exit 0
