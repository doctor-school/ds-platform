# Preview slots — the dispatch entry point for the STAGE stand (tech spec
# 2026-09-08-staging-previews-and-regression-contour-en.md §5 step 2 / §8 step 4;
# Issues #2064, #2194).
#
# THIS WORKFLOW BUILDS NOTHING. Staging adopted production's delivery shape (#2194):
# an operator ships a committed tree over SSH with `pnpm stage:slot up <slot> <sha>`
# and the BOX builds the images out of that tree. There is no registry anywhere in
# the path — no GHCR, no image push, no pull — so the five image-publishing steps this
# file used to carry have no product left to make.
#
# WHAT IS LEFT is the dispatch route itself plus its input validation: the two shapes
# `tools/staging/slot.mjs` enforces (`assertSlotName`, the full 40-character SHA),
# rejected here so a malformed dispatch never reaches the box. The run summary then
# states the exact operator command.
#
# INTERIM STATE, said plainly: until §8 step 6 wires the regression suite (Issue #2066)
# and §8 step 7 writes the suite itself, this workflow only validates and
# echoes. It is kept rather than deleted because step 6 attaches to this same
# `workflow_dispatch` route and its `slot`/`sha` inputs.
name: Preview slots

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to act on: main or pr-<N>"
        required: true
        type: string
      sha:
        description: "Full 40-character commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One dispatch per slot: a second supersedes the first.
  group: preview-slots-${{ inputs.slot }}
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate inputs
        id: meta
        env:
          SHA: ${{ inputs.sha }}
          SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          # The same two shapes tools/staging/slot.mjs enforces (`assertSlotName`,
          # `shortSha`).
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "sha must be a full 40-character lowercase commit SHA: $SHA" >&2; exit 1; }
          echo "$SLOT" | grep -Eq '^(main|pr-[1-9][0-9]{0,9})$' \
            || { echo "slot must be 'main' or 'pr-<N>': $SLOT" >&2; exit 1; }
          echo "sha7=$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Summarise the operator command
        env:
          SHA: ${{ inputs.sha }}
          SHA7: ${{ steps.meta.outputs.sha7 }}
          SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          {
            echo "### Preview slot \`$SLOT\` @ \`$SHA7\`"
            echo
            echo "Staging builds on the box from a shipped tree; nothing is built here."
            echo "Run from a checkout of this repository:"
            echo
            echo '```'
            echo "pnpm stage:slot up $SLOT $SHA"
            echo '```'
            echo
            echo "Hosts: \`<app>-$SLOT.stage.doctor.school\` for app in academy, doctor, admin, api."
          } >> "$GITHUB_STEP_SUMMARY"
