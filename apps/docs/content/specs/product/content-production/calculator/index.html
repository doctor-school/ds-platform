<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Калькулятор себестоимости и цены — производство контента DS</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%272%27 y=%271%27 width=%2712%27 height=%2714%27 rx=%271.5%27 fill=%27none%27 stroke=%27%231d1d1f%27 stroke-width=%271.5%27/%3E%3Cpath d=%27M5 5h6M5 9h2M9 9h2M5 12h2M9 12h2%27 stroke=%27%231d1d1f%27 stroke-width=%271.5%27/%3E%3C/svg%3E"
    />
    <!--
      Static unit-cost calculator, no build. Serve the content-production folder over HTTP
      (file:// blocks fetch) and open /calculator/ — see ../README-ru.md «Калькулятор».
      Same pinned stack as ../viewer/ (React, htm, yaml from jsDelivr); formulas live in compute.mjs.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://cdn.jsdelivr.net/npm/react@19.3.0/+esm",
          "react-dom/client": "https://cdn.jsdelivr.net/npm/react-dom@19.3.0/client/+esm",
          "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/+esm",
          "yaml": "https://cdn.jsdelivr.net/npm/yaml@2.9.1/+esm",
          "https://cdn.jsdelivr.net/npm/react@%5E19.3.0/+esm": "https://cdn.jsdelivr.net/npm/react@19.3.0/+esm",
          "https://cdn.jsdelivr.net/npm/react@19.1.0/+esm": "https://cdn.jsdelivr.net/npm/react@19.3.0/+esm"
        }
      }
    </script>
    <style>
      /*
        Layout rules that keep the page still while values change:
        numbers are tabular and sit in fixed-width slots, grid columns are minmax(0, …),
        anything that appears with a value (reset buttons, edit marks) has its space reserved,
        and highlights change colour only, never size.
      */
      :root {
        color-scheme: light;
        --bg: #f4f5f7;
        --panel: #ffffff;
        --sunken: #f7f8fa;
        --ink: #1d1d1f;
        --muted: #5f6368;
        --frame: #b8bdc4;
        --rule: #e6e8eb;
        --accent: #0b57d0;
        --accent-soft: #e8f0fe;
        --hl: #c5221f;
        --warn: #a35200;
        --ok: #137333;
        --chip: #eef1f5;
        --edited: #fff4d6;
        --edited-border: #d39e00;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
        /* spacing scale */
        --s1: 4px;
        --s2: 8px;
        --s3: 12px;
        --s4: 16px;
        --s5: 24px;
        --s6: 32px;
        /* type scale */
        --fs-xs: 12px;
        --fs-sm: 13px;
        --fs-base: 14px;
        --fs-md: 16px;
        --fs-lg: 18px;
        --fs-xl: 22px;
        /* control metrics */
        --ctl-h: 30px;
        --num-w: 84px;
        --num-wide-w: 116px;
        --label-w: 12rem;
        --top-h: 0px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scrollbar-gutter: stable;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          var(--fs-base) / 1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      /* ── top: header + key-metrics bar, sticky together ── */
      .top {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--panel);
        box-shadow: 0 1px 0 var(--rule);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s2) var(--s5);
        padding: var(--s2) var(--s5);
        border-bottom: 1px solid var(--rule);
      }
      header h1 {
        font-size: var(--fs-md);
        margin: 0;
        white-space: nowrap;
      }
      .group {
        display: inline-flex;
        align-items: center;
        gap: var(--s2);
      }
      .group > .glabel {
        color: var(--muted);
        font-size: var(--fs-sm);
      }
      .wrap {
        max-width: 1440px;
        margin: 0 auto;
        padding: var(--s5);
        display: grid;
        gap: var(--s5);
      }
      .editsbar {
        display: grid;
        gap: var(--s2);
      }
      .intro {
        margin: 0;
        max-width: 80ch;
      }
      header select[data-testid="product"] {
        max-width: 240px;
      }
      /* ── cards ── */
      .card {
        background: var(--panel);
        border-radius: 10px;
        box-shadow: var(--shadow);
        border: 1px solid var(--rule);
        padding: var(--s5);
        min-width: 0;
      }
      .card > h2 {
        font-size: var(--fs-lg);
        font-weight: 650;
        margin: 0 0 var(--s4);
        display: flex;
        align-items: center;
        gap: var(--s2);
      }
      .card h3 {
        font-size: var(--fs-sm);
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--muted);
        margin: var(--s5) 0 var(--s3);
        padding-top: var(--s4);
        border-top: 1px solid var(--rule);
      }
      .card p {
        max-width: 78ch;
        margin: var(--s3) 0;
      }
      .card > p:first-of-type {
        margin-top: 0;
      }
      .section-note {
        font-size: var(--fs-sm);
        color: var(--muted);
      }
      /* ── headline facts ── */
      .facts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: var(--s4) var(--s5);
      }
      .fact {
        min-width: 0;
      }
      .fact-label {
        font-size: var(--fs-xs);
        color: var(--muted);
      }
      .fact-value {
        font-size: var(--fs-md);
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .fact-sub {
        font-size: var(--fs-xs);
        color: var(--muted);
      }
      .headline-foot {
        display: grid;
        gap: var(--s3);
        margin-top: var(--s4);
        padding-top: var(--s4);
        border-top: 1px solid var(--rule);
      }
      /* ── form rows: label column, control with unit, help line ── */
      .card {
        container-type: inline-size;
      }
      .form {
        display: grid;
        grid-template-columns: minmax(0, var(--label-w)) minmax(0, 1fr);
        gap: var(--s3) var(--s4);
        align-items: start;
      }
      /* a narrow card stacks the label above its control instead of squeezing the control */
      @container (max-width: 620px) {
        .form {
          grid-template-columns: minmax(0, 1fr);
          row-gap: var(--s1);
        }
        .form .flabel {
          padding-top: var(--s2);
          font-weight: 600;
        }
        .form .frow:first-child .flabel {
          padding-top: 0;
        }
      }
      .frow {
        display: contents;
      }
      .flabel {
        padding-top: 5px;
        font-size: var(--fs-sm);
        color: var(--ink);
      }
      .fctl {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s2) var(--s3);
        min-width: 0;
      }
      .fhelp {
        flex-basis: 100%;
        font-size: var(--fs-xs);
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .unit {
        color: var(--muted);
        font-size: var(--fs-sm);
        white-space: nowrap;
      }
      .value-out {
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        padding-top: 5px;
      }
      /* switch row: checkbox with its own label and the consequence under it */
      .switch {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 2px var(--s2);
        align-items: start;
        cursor: pointer;
        padding: var(--s2) var(--s3);
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--sunken);
        max-width: 60ch;
      }
      .switch input {
        width: 16px;
        height: 16px;
        margin: 3px 0 0;
        accent-color: var(--accent);
      }
      .switch .switch-title {
        font-weight: 600;
      }
      .switch .fhelp {
        grid-column: 2;
      }
      .switch:has(input:checked) {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: var(--fs-xs);
      }
      .err {
        color: var(--hl);
      }
      .errbox {
        border: 1px solid var(--hl);
        background: #fdecea;
        color: var(--hl);
        border-radius: 8px;
        padding: var(--s3) var(--s4);
      }
      .flags {
        margin: var(--s2) 0 0;
        padding-left: 18px;
        color: var(--warn);
      }
      .flags li {
        overflow-wrap: anywhere;
      }
      /* ── tables ── */
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 6px var(--s2);
        border-bottom: 1px solid var(--rule);
        vertical-align: top;
      }
      th {
        font-weight: 600;
        color: var(--muted);
        font-size: var(--fs-xs);
      }
      tbody tr:last-child > td {
        border-bottom: 0;
      }
      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      tr.sum td {
        font-weight: 600;
        border-top: 1px solid var(--frame);
      }
      .scroll {
        overflow-x: auto;
        max-width: 100%;
      }
      /* a role column that never re-wraps when the numbers beside it change width */
      table.nowrap-first td:first-child {
        white-space: nowrap;
      }
      .flagslot {
        margin-top: var(--s2);
        min-height: 21px;
      }
      .card .flagslot > .flagbox,
      .card .flagslot > .flagline {
        margin: 0;
      }
      /* ── disclosures ── */
      details {
        border-top: 1px solid var(--rule);
        padding: var(--s2) 0;
      }
      details > summary {
        cursor: pointer;
        display: flex;
        gap: var(--s2);
        align-items: baseline;
        list-style: none;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }
      details > summary::before {
        content: "▸";
        color: var(--accent);
        width: 10px;
        flex: none;
      }
      details[open] > summary::before {
        content: "▾";
      }
      summary .name {
        flex: 1;
        min-width: 0;
      }
      summary .amount {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        white-space: nowrap;
      }
      details .body {
        padding: var(--s2) 0 var(--s1) 18px;
      }
      .id {
        font:
          var(--fs-xs) ui-monospace,
          Consolas,
          monospace;
        background: var(--chip);
        border-radius: 4px;
        padding: 1px 5px;
        white-space: nowrap;
      }
      a {
        color: var(--accent);
      }
      /* ── controls ── */
      button,
      select,
      input {
        font: inherit;
      }
      button {
        color: var(--accent);
        background: var(--panel);
        border: 1px solid var(--frame);
        border-radius: 6px;
        min-height: var(--ctl-h);
        padding: 3px var(--s3);
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      button:disabled {
        color: var(--muted);
        cursor: not-allowed;
        opacity: 0.6;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button.link {
        border: 0;
        min-height: 0;
        padding: 0 var(--s1);
        background: none;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--frame);
        border-radius: 6px;
        overflow: hidden;
        background: var(--panel);
      }
      .seg button {
        border: 0;
        border-radius: 0;
        color: var(--ink);
        min-height: calc(var(--ctl-h) - 2px);
      }
      .seg button + button {
        border-left: 1px solid var(--rule);
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent);
        color: #fff;
      }
      select {
        height: var(--ctl-h);
        padding: 0 var(--s2);
        border: 1px solid var(--frame);
        border-radius: 6px;
        background: var(--panel);
        max-width: 100%;
      }
      .edit {
        display: inline-flex;
        align-items: center;
        gap: var(--s2);
        white-space: nowrap;
      }
      .edit input {
        width: var(--num-w);
        height: var(--ctl-h);
        padding: 0 var(--s2);
        border: 1px solid var(--frame);
        border-radius: 6px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        background: var(--panel);
      }
      .edit input.wide {
        width: var(--num-wide-w);
      }
      .edit input.bad {
        border-color: var(--hl);
      }
      .edit input:disabled {
        background: var(--sunken);
        color: var(--muted);
      }
      .edit.edited input,
      .edit.edited select {
        background: var(--edited);
        border-color: var(--edited-border);
      }
      /* reset slot: always present, so editing a value never moves its neighbours */
      .edit .tail {
        display: inline-flex;
        justify-content: center;
        width: 22px;
        flex: none;
      }
      .edit .tail button {
        color: var(--edited-border);
        font-weight: 700;
      }
      /* one scrollable row: a tab gaining an «изменено N» badge never re-wraps the bar */
      .tabs {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: var(--s2);
        margin-bottom: var(--s4);
        padding-bottom: var(--s3);
        border-bottom: 1px solid var(--rule);
      }
      .tabs button {
        border-color: transparent;
        color: var(--ink);
      }
      .tabs button[aria-selected="true"] {
        background: var(--accent-soft);
        color: var(--accent);
        border-color: var(--accent);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2) var(--s3);
        align-items: center;
      }
      .spacer {
        flex: 1;
      }
      .badge {
        background: var(--edited);
        border: 1px solid var(--edited-border);
        border-radius: 10px;
        padding: 0 var(--s2);
        font-size: var(--fs-xs);
        font-weight: 500;
        white-space: nowrap;
      }
      .caption {
        font-size: var(--fs-xs);
        color: var(--muted);
        max-width: 60ch;
      }
      .ok {
        color: var(--ok);
      }
      .warn {
        color: var(--warn);
      }
      .ctl {
        display: inline-flex;
        align-items: center;
        gap: var(--s2);
        font-size: var(--fs-sm);
      }
      input.note {
        width: 170px;
        height: var(--ctl-h);
        padding: 0 var(--s2);
        border: 1px solid var(--frame);
        border-radius: 6px;
      }
      /* terms: dotted underline, the explanation comes from the one floating tooltip */
      .term {
        border-bottom: 1px dotted var(--muted);
        cursor: help;
      }
      .term:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-radius: 2px;
      }
      .tiplayer {
        position: fixed;
        z-index: 50;
        max-width: 320px;
        background: var(--ink);
        color: #fff;
        font-size: var(--fs-xs);
        line-height: 1.4;
        padding: 7px 9px;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        pointer-events: none;
      }
      .tiplayer[hidden] {
        display: none;
      }
      /* ── key-metrics bar ── */
      .kpibar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(124px, 1fr));
        gap: var(--s2);
        padding: var(--s2) var(--s5) var(--s3);
      }
      .kpi {
        border-radius: 8px;
        padding: 6px var(--s3);
        min-width: 0;
        background: var(--sunken);
        border: 1px solid transparent;
      }
      .kpi.lead {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .kpi .label,
      .kpi .delta,
      .kpi .small {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kpi .label {
        font-size: var(--fs-xs);
        color: var(--muted);
      }
      .kpi .label .hint {
        font-size: 11px;
      }
      .kpi .value {
        font-size: var(--fs-md);
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-radius: 4px;
      }
      .kpi.primary .value {
        font-size: var(--fs-lg);
      }
      .kpi .delta {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .kpi.baseline .toolbar {
        margin-top: 2px;
        flex-wrap: nowrap;
        gap: var(--s1);
        min-width: 0;
      }
      .kpi.baseline button {
        font-size: var(--fs-xs);
        min-height: 0;
        padding: 1px var(--s2);
      }
      @keyframes spotlight {
        from {
          background: var(--edited);
        }
        to {
          background: transparent;
        }
      }
      .flash {
        animation: spotlight 1s ease-out;
      }
      .flagbox {
        border-top: 0;
        padding: 0;
      }
      /* a flag line keeps one line's height whether flags exist or not; the list opens on demand */
      .card .flagbox,
      .card .flagline {
        margin: var(--s2) 0 0;
      }
      .flagbox > summary,
      .card .flagline {
        height: 21px;
        line-height: 21px;
        overflow: hidden;
        white-space: nowrap;
      }
      .flagbox > summary {
        color: var(--warn);
      }
      .card .flagline {
        color: var(--muted);
      }
      /* ── two columns: inputs left, charts right ── */
      .cols2 {
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
        gap: var(--s5);
        align-items: start;
      }
      .col {
        display: grid;
        gap: var(--s5);
        min-width: 0;
      }
      .col.sticky {
        position: sticky;
        top: calc(var(--top-h) + var(--s4));
      }
      table.derived {
        table-layout: fixed;
      }
      table.derived td:first-child {
        width: 34%;
      }
      table.derived td.num {
        width: 9.5rem;
      }
      table.derived .line {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      table.derived tr.lead td {
        background: var(--accent-soft);
      }
      .gap-flag {
        white-space: nowrap;
        color: var(--hl);
        font-weight: 700;
        background: #fdecea;
        padding: 0 4px;
        border-radius: 4px;
      }
      /* budget articles: fixed columns, so a changing value never re-flows the table */
      table.budget {
        table-layout: fixed;
      }
      table.budget td {
        vertical-align: middle;
        padding-top: var(--s2);
        padding-bottom: var(--s2);
      }
      table.budget col.c-name {
        width: 32%;
      }
      table.budget col.c-pct {
        width: 4.5em;
      }
      table.budget col.c-sum {
        width: calc(var(--num-wide-w) + 52px);
      }
      table.budget input[type="range"] {
        width: 100%;
        margin: 0;
        vertical-align: middle;
        accent-color: var(--accent);
      }
      table.budget td.pct {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        color: var(--muted);
      }
      .card .fit {
        border-top: 0;
        padding: 0;
        margin: 0;
        max-width: none;
      }
      .fit > summary {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fit ul {
        margin: var(--s2) 0 0;
        padding-left: 18px;
        max-height: 240px;
        overflow-y: auto;
      }
      /* charts: the SVG keeps its viewBox ratio, so its height follows the column width only */
      figure.chart {
        margin: 0;
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
        font-family: inherit;
      }
      svg .axis {
        stroke: var(--frame);
      }
      svg .grid {
        stroke: var(--rule);
      }
      svg .tick {
        font-size: 11px;
        fill: var(--muted);
      }
      svg .lbl {
        font-size: var(--fs-xs);
        fill: var(--ink);
      }
      svg .baseline {
        stroke: var(--ink);
        stroke-dasharray: 3 3;
      }
      .c-market {
        fill: #d5d9de;
        background: #d5d9de;
      }
      .c-band {
        fill: #b7e1c1;
        background: #b7e1c1;
      }
      .c-profit {
        fill: var(--ok);
        background: var(--ok);
      }
      .c-loss {
        fill: var(--hl);
        background: var(--hl);
      }
      .c-low {
        fill: #8ab4f8;
        background: #8ab4f8;
      }
      .c-high {
        fill: #f6ae6b;
        background: #f6ae6b;
      }
      svg .mark {
        stroke-width: 1.5;
      }
      svg .m-cost {
        stroke: var(--ink);
        fill: var(--ink);
      }
      svg .m-price {
        stroke: var(--accent);
        fill: var(--accent);
        stroke-width: 2.5;
      }
      svg .m-market {
        stroke: var(--frame);
        fill: var(--muted);
        stroke-dasharray: 2 3;
      }
      svg .m-cap {
        stroke: var(--hl);
        fill: var(--hl);
        stroke-dasharray: 5 3;
      }
      svg text.m-cost,
      svg text.m-price,
      svg text.m-market,
      svg text.m-cap {
        stroke: none;
      }
      svg .line-cost {
        stroke: var(--muted);
        stroke-width: 2;
      }
      svg .line-revenue {
        stroke: var(--accent);
        stroke-width: 2.5;
        fill: none;
      }
      svg .dot {
        fill: var(--hl);
      }
      .seg0 {
        fill: #5f6b7a;
        background: #5f6b7a;
      }
      .seg1 {
        fill: #8793a3;
        background: #8793a3;
      }
      .seg2 {
        fill: #a9b2be;
        background: #a9b2be;
      }
      .seg3 {
        fill: #c4a77d;
        background: #c4a77d;
      }
      .seg4 {
        fill: #9fb8d6;
        background: #9fb8d6;
      }
      .seg5 {
        fill: #d9d4cb;
        background: #d9d4cb;
      }
      /* legend on a fixed grid: its line count depends on the item count, never on the amounts */
      ul.legend {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: var(--s1) var(--s4);
        list-style: none;
        padding: 0;
        margin: var(--s2) 0 0;
        font-size: var(--fs-xs);
      }
      ul.legend li {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      ul.legend i,
      .key {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: var(--s1);
        vertical-align: -1px;
      }
      ul.legend i.m-cap-key {
        border: 2px dashed var(--hl);
        width: 8px;
      }
      ul.legend .delta {
        color: var(--warn);
        font-weight: 600;
      }
      table.matrix {
        table-layout: fixed;
      }
      table.matrix th:first-child {
        width: 6.5rem;
      }
      table.matrix td,
      table.matrix th {
        padding: 2px;
        border-bottom: 0;
      }
      table.matrix td.current button.cell {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      button.cell {
        display: grid;
        width: 100%;
        text-align: left;
        color: var(--ink);
        padding: var(--s1) var(--s2);
        font-variant-numeric: tabular-nums;
      }
      button.cell > span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @media (max-width: 1100px) {
        .cols2 {
          grid-template-columns: minmax(0, 1fr);
        }
        .col.sticky {
          position: static;
        }
        .top {
          position: static;
        }
        .wrap {
          padding: var(--s4);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><p style="padding: 16px">Загрузка модели…</p></div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
