<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Калькулятор себестоимости и цены — производство контента DS</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%272%27 y=%271%27 width=%2712%27 height=%2714%27 rx=%271.5%27 fill=%27none%27 stroke=%27%231d1d1f%27 stroke-width=%271.5%27/%3E%3Cpath d=%27M5 5h6M5 9h2M9 9h2M5 12h2M9 12h2%27 stroke=%27%231d1d1f%27 stroke-width=%271.5%27/%3E%3C/svg%3E"
    />
    <!--
      Static unit-cost calculator, no build. Serve the content-production folder over HTTP
      (file:// blocks fetch) and open /calculator/ — see ../README-ru.md «Калькулятор».
      Same pinned stack as ../viewer/ (React, htm, yaml from jsDelivr); formulas live in compute.mjs.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://cdn.jsdelivr.net/npm/react@19.3.0/+esm",
          "react-dom/client": "https://cdn.jsdelivr.net/npm/react-dom@19.3.0/client/+esm",
          "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/+esm",
          "yaml": "https://cdn.jsdelivr.net/npm/yaml@2.9.1/+esm",
          "https://cdn.jsdelivr.net/npm/react@%5E19.3.0/+esm": "https://cdn.jsdelivr.net/npm/react@19.3.0/+esm",
          "https://cdn.jsdelivr.net/npm/react@19.1.0/+esm": "https://cdn.jsdelivr.net/npm/react@19.3.0/+esm"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f5;
        --panel: #ffffff;
        --ink: #1d1d1f;
        --muted: #5f6368;
        --frame: #9aa0a6;
        --rule: #e3e3e0;
        --accent: #0b57d0;
        --hl: #d93025;
        --warn: #b06000;
        --ok: #188038;
        --chip: #eef1f5;
        --edited: #fff4d6;
        --edited-border: #e0a800;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow-x: hidden;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 16px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--frame);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      header h1 {
        font-size: 16px;
        margin: 0 8px 0 0;
      }
      .wrap {
        max-width: 1360px;
        margin: 0 auto;
        padding: 16px;
        display: grid;
        gap: 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 8px;
        padding: 14px 16px;
        min-width: 0;
      }
      .card > h2 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      .cols {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
      }
      .totals {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .total {
        border: 1px solid var(--rule);
        border-radius: 8px;
        padding: 10px 14px;
      }
      .total .label {
        color: var(--muted);
        font-size: 13px;
      }
      .total .value {
        font-size: 28px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .total .hint {
        font-size: 12px;
        color: var(--muted);
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 24px;
        margin-top: 10px;
      }
      .facts b {
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .err {
        color: var(--hl);
      }
      .errbox {
        border: 1px solid var(--hl);
        background: #fdecea;
        color: var(--hl);
        border-radius: 8px;
        padding: 10px 14px;
      }
      .flags {
        margin: 6px 0 0;
        padding-left: 18px;
        color: var(--warn);
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 4px 6px;
        border-bottom: 1px solid var(--rule);
        vertical-align: top;
      }
      th {
        font-weight: 600;
        color: var(--muted);
        font-size: 12px;
      }
      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      tr.sum td {
        font-weight: 600;
        border-top: 2px solid var(--rule);
      }
      .scroll {
        overflow-x: auto;
        max-width: 100%;
      }
      details {
        border-top: 1px solid var(--rule);
        padding: 6px 0;
      }
      details > summary {
        cursor: pointer;
        display: flex;
        gap: 8px;
        align-items: baseline;
        list-style: none;
      }
      details > summary::before {
        content: "▸";
        color: var(--accent);
        width: 10px;
        flex: none;
      }
      details[open] > summary::before {
        content: "▾";
      }
      summary .name {
        flex: 1;
        min-width: 0;
      }
      summary .amount {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        white-space: nowrap;
      }
      details .body {
        padding: 6px 0 4px 18px;
      }
      .id {
        font:
          12px ui-monospace,
          Consolas,
          monospace;
        background: var(--chip);
        border-radius: 4px;
        padding: 1px 5px;
        white-space: nowrap;
      }
      a {
        color: var(--accent);
      }
      button,
      select,
      input {
        font: inherit;
      }
      button {
        color: var(--accent);
        background: var(--panel);
        border: 1px solid var(--frame);
        border-radius: 6px;
        padding: 3px 10px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.link {
        border: 0;
        padding: 0 4px;
        background: none;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--frame);
        border-radius: 6px;
        overflow: hidden;
      }
      .seg button {
        border: 0;
        border-radius: 0;
        color: var(--ink);
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent);
        color: #fff;
      }
      select {
        padding: 3px 6px;
        border: 1px solid var(--frame);
        border-radius: 6px;
        background: var(--panel);
        max-width: 100%;
      }
      .edit {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        white-space: nowrap;
      }
      .edit input {
        width: 68px;
        padding: 1px 4px;
        border: 1px solid var(--frame);
        border-radius: 4px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        background: var(--panel);
      }
      .edit input.wide {
        width: 96px;
      }
      .edit input.bad {
        border-color: var(--hl);
      }
      .edit.edited input {
        background: var(--edited);
        border-color: var(--edited-border);
      }
      .edit .mark {
        color: var(--edited-border);
        font-weight: 700;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 10px;
      }
      .tabs button[aria-selected="true"] {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .spacer {
        flex: 1;
      }
      .badge {
        background: var(--edited);
        border: 1px solid var(--edited-border);
        border-radius: 10px;
        padding: 0 8px;
        font-size: 12px;
      }
      .caption {
        font-size: 12px;
        color: var(--muted);
        max-width: 520px;
      }
      .ok {
        color: var(--ok);
      }
      .warn {
        color: var(--warn);
      }
      .card h3 {
        font-size: 13px;
        margin: 14px 0 6px;
      }
      .ctl {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }
      input.note {
        width: 150px;
        padding: 3px 6px;
        border: 1px solid var(--frame);
        border-radius: 6px;
      }
      /* terms: dotted underline, the explanation comes from the one floating tooltip */
      .term {
        border-bottom: 1px dotted var(--muted);
        cursor: help;
      }
      .term:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-radius: 2px;
      }
      .tiplayer {
        position: fixed;
        z-index: 50;
        max-width: 320px;
        background: var(--ink);
        color: #fff;
        font-size: 12px;
        line-height: 1.4;
        padding: 7px 9px;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        pointer-events: none;
      }
      .tiplayer[hidden] {
        display: none;
      }
      /* sticky key-metrics bar under the header */
      .kpibar {
        position: sticky;
        top: 50px;
        z-index: 4;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
        gap: 6px;
        padding: 8px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--rule);
      }
      .kpi {
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 4px 8px;
        min-width: 0;
      }
      .kpi.lead {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .kpi .label {
        font-size: 12px;
        color: var(--muted);
      }
      .kpi .label .hint {
        font-size: 11px;
      }
      .kpi .value {
        font-size: 17px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-radius: 4px;
      }
      .kpi .delta {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .kpi.baseline .toolbar {
        margin-top: 2px;
      }
      .kpi.baseline button {
        font-size: 12px;
        padding: 1px 6px;
      }
      @keyframes spotlight {
        from {
          background: var(--edited);
        }
        to {
          background: transparent;
        }
      }
      .flash {
        animation: spotlight 1s ease-out;
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 24px;
        align-items: baseline;
      }
      .flagbox summary {
        color: var(--warn);
        cursor: pointer;
      }
      .cols2 {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
        gap: 16px;
        align-items: start;
      }
      .col {
        display: grid;
        gap: 16px;
        min-width: 0;
      }
      .col.sticky {
        position: sticky;
        top: 150px;
      }
      table.derived td {
        border-bottom: 1px solid var(--rule);
      }
      table.derived tr.lead td {
        background: #eaf1fb;
      }
      .gap-flag {
        color: var(--hl);
        font-weight: 700;
        background: #fdecea;
        padding: 0 4px;
        border-radius: 4px;
      }
      table.budget td.slider {
        white-space: nowrap;
      }
      table.budget input[type="range"] {
        width: 140px;
        vertical-align: middle;
        accent-color: var(--accent);
      }
      .badge {
        white-space: nowrap;
      }
      /* charts */
      figure.chart {
        margin: 0;
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
        font-family: inherit;
      }
      svg .axis {
        stroke: var(--frame);
      }
      svg .grid {
        stroke: var(--rule);
      }
      svg .tick {
        font-size: 11px;
        fill: var(--muted);
      }
      svg .lbl {
        font-size: 12px;
        fill: var(--ink);
      }
      svg .baseline {
        stroke: var(--ink);
        stroke-dasharray: 3 3;
      }
      .c-market {
        fill: #d5d9de;
        background: #d5d9de;
      }
      .c-band {
        fill: #b7e1c1;
        background: #b7e1c1;
      }
      .c-profit {
        fill: var(--ok);
        background: var(--ok);
      }
      .c-loss {
        fill: var(--hl);
        background: var(--hl);
      }
      .c-low {
        fill: #8ab4f8;
        background: #8ab4f8;
      }
      .c-high {
        fill: #f6ae6b;
        background: #f6ae6b;
      }
      svg .mark {
        stroke-width: 1.5;
      }
      svg .m-cost {
        stroke: var(--ink);
        fill: var(--ink);
      }
      svg .m-price {
        stroke: var(--accent);
        fill: var(--accent);
        stroke-width: 2.5;
      }
      svg .m-market {
        stroke: var(--frame);
        fill: var(--muted);
        stroke-dasharray: 2 3;
      }
      svg .m-cap {
        stroke: var(--hl);
        fill: var(--hl);
        stroke-dasharray: 5 3;
      }
      svg text.m-cost,
      svg text.m-price,
      svg text.m-market,
      svg text.m-cap {
        stroke: none;
      }
      svg .line-cost {
        stroke: var(--muted);
        stroke-width: 2;
      }
      svg .line-revenue {
        stroke: var(--accent);
        stroke-width: 2.5;
        fill: none;
      }
      svg .dot {
        fill: var(--hl);
      }
      .seg0 {
        fill: #5f6b7a;
        background: #5f6b7a;
      }
      .seg1 {
        fill: #8793a3;
        background: #8793a3;
      }
      .seg2 {
        fill: #a9b2be;
        background: #a9b2be;
      }
      .seg3 {
        fill: #c4a77d;
        background: #c4a77d;
      }
      .seg4 {
        fill: #9fb8d6;
        background: #9fb8d6;
      }
      .seg5 {
        fill: #d9d4cb;
        background: #d9d4cb;
      }
      ul.legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        list-style: none;
        padding: 0;
        margin: 4px 0 0;
        font-size: 12px;
      }
      ul.legend i,
      .key {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 4px;
        vertical-align: -1px;
      }
      ul.legend i.m-cap-key {
        border: 2px dashed var(--hl);
        width: 8px;
      }
      ul.legend .delta {
        color: var(--warn);
        font-weight: 600;
      }
      table.matrix td {
        padding: 2px;
      }
      table.matrix td.current button.cell {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      button.cell {
        display: grid;
        width: 100%;
        text-align: left;
        color: var(--ink);
        padding: 4px 6px;
        font-variant-numeric: tabular-nums;
      }
      @media (max-width: 1100px) {
        .cols2 {
          grid-template-columns: minmax(0, 1fr);
        }
        .col.sticky {
          position: static;
        }
        .kpibar {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><p style="padding: 16px">Загрузка модели…</p></div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
