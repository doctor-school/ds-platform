# Состав стандартных продуктов и переменные калькулятора себестоимости (формулы: cost-model-ru.md).
# Часы, круги и роли — в ../model/*.yaml; ставки — в ../rates/rates.yaml; FTE и оплачиваемые часы —
# в ../model/teams.yaml. Здесь — только состав продукта (единица × количество), параметры драйверов,
# период плана, резерв актуализации, названия внешних затрат и переменные цены. Рубли — только в
# ../rates/rates.yaml; переменная с draft null берёт значение оттуда. Своя композиция — та же схема.

# Какой лист — накладные (решение В8, effort-draft-ru.md «Как это попадает в себестоимость единицы»):
# сначала роль, затем единица. Всё прочее — прямые часы единицы.
classification:
  overhead_role_prefixes: [Ядро, Сервисный круг]
  overhead_units:
    [
      команда·месяц,
      новая команда,
      деление,
      найм,
      ревизия стандартов,
      СОП,
      отчётный период,
      направление,
    ]
  reserve_units: [сигнал, затронутая единица]
  basis: effort-draft-ru.md, «Как это попадает в себестоимость единицы»; решение В8

# Переменные калькулятора: одно плоское пространство имён, правка — override `var:<имя>`; `label` — название на странице калькулятора.
variables:
  region:
    label: Регион ставок
    draft: moscow
    unit: ключ региона ставок (moscow | russia_remote) в ../rates/rates.yaml
    basis: "оценка аналитика: значения по умолчанию rates-ru.md посчитаны по Москве; роль без медианы региона берёт Москву с флагом"
  media_external_share:
    label: Доля часов медиа-круга у внешних подрядчиков
    draft: 0
    unit: доля часов подролей медиа-круга во внешнем пуле подрядчиков
    basis: "решение В3 — пики сверх обязательства уходят во внешний пул; долю задаёт владелец (rates-ru.md, «Форма привлечения»), по умолчанию — весь объём в штате"
  # Стоимость часа штата. null — значение по умолчанию из ../rates/rates.yaml (деньги живут там).
  contributions_mode:
    label: Режим страховых взносов
    draft: null
    unit: "general | msp_priority; null — rates.yaml variables.contributions_modes.default"
    basis: "../rates/rates.yaml variables.contributions_modes — режим подтверждает бухгалтерия DS"
  bonus_share:
    label: Премия, доля к gross
    draft: null
    unit: "доля к gross, облагается взносами; null — rates.yaml variables.bonus_share.default"
    basis: "../rates/rates.yaml variables.bonus_share"
  staff_other_costs_rub_month:
    label: Прочие расходы на штатного сотрудника, ₽ в месяц
    draft: null
    unit: "₽ на одного штатного сотрудника в месяц; null — rates.yaml staff_other_costs_rub_month.total_rub (типичное)"
    basis: "../rates/rates.yaml variables.staff_other_costs_rub_month — отпуск и болезнь уже в делителе paid_hours_per_month"
  grade_mix:
    label: Смесь грейдов команды
    draft: null
    unit: "доли { junior, middle, senior }, сумма 1; null — rates.yaml variables.default_team_grade_mix"
    basis: "../rates/rates.yaml variables.default_team_grade_mix — грейд «смесь» берёт эти доли"
  # Грейды экспертов: ключ ../rates/rates.yaml experts.grades (врач | к.м.н. | д.м.н. | лидер мнений).
  expert_grade_author:
    label: Грейд автора курса
    draft: д.м.н.
    unit: грейд эксперта для роли «Пул экспертов — амбассадор» (автор курса, A28)
    basis: "оценка аналитика: автор курса НМО — обычно доктор наук; правит владелец"
  expert_grade_lesson:
    label: Грейд приглашённого спикера урока
    draft: к.м.н.
    unit: грейд эксперта для роли «Пул экспертов — эксперт» (материал урока, A3112)
    basis: "оценка аналитика"
  expert_grade_speaker:
    label: Грейд спикера подкаста и мероприятия
    draft: к.м.н.
    unit: грейд эксперта для роли «Пул экспертов — спикер» (A3241, A339)
    basis: "оценка аналитика"
  # Инструменты и инфраструктура: месячный пул, распределяется как накладные (на прямой час).
  tool_seats:
    label: Мест в подписках инструментов
    draft: null
    unit: "мест (пользователей) подписок per: seat; null — команд × Σ FTE ролей команды"
    basis: "оценка аналитика: место у каждого участника команды направления"
  payment_markup:
    label: Комиссия посредника за зарубежные подписки
    draft: null
    unit: "доля к цене подписки в валюте; null — rates.yaml tools.payment_markup.default"
    basis: "../rates/rates.yaml tools.payment_markup"
  # Цена и выручка.
  price_mode:
    label: Ведущий способ цены
    draft: markup
    unit: "multiplier (× себестоимость) | markup (наценка к себестоимости) | margin (маржа в цене) | fixed (₽); остальные выводятся"
    basis: "оценка аналитика"
  price_value:
    label: Значение ведущего способа цены
    draft: 0.3
    unit: "множитель, доля наценки, доля маржи или ₽ — по price_mode"
    basis: "оценка аналитика: наценка 30 % к полной себестоимости"
  contacts:
    label: Контакты с врачами — мало / план / много
    draft: [300, 1000, 3000]
    unit: контактов за продукт [мало, план, много]
    basis: "оценка аналитика; живой вебинар обычно ≤ 100 участников, урок ≈ 1 000 просмотров (rates.yaml doctor_contacts.contact_types)"
  audience_doctors:
    label: Размер аудитории специальности, врачей
    draft: 10000
    unit: "врачей специальности в РФ — выбирает полосу rates.yaml doctor_contacts.price_per_contact_by_audience_size"
    basis: "оценка аналитика: полоса 5–20 тыс. (эндокринологи, кардиологи)"
  price_per_contact:
    label: Цена контакта, ₽
    draft: null
    unit: "₽ за контакт; null — середина полосы аудитории × вес типа контакта продукта (rates.yaml doctor_contacts)"
    basis: "../rates/rates.yaml doctor_contacts"
  budget_cap:
    label: Потолок бюджета спонсора, ₽
    draft: null
    unit: "₽ за продукт; null — без потолка"
    basis: "задаёт владелец по запросу спонсора"
  budget_cap_mode:
    label: Потолок бюджета — жёсткий или со скидкой
    draft: hard
    unit: "hard — выручка не выше потолка | tiered — сверх потолка контакты со скидкой"
    basis: "оценка аналитика: по умолчанию жёсткий"
  budget_tier_discount:
    label: Скидка на контакты сверх потолка
    draft: 0.5
    unit: доля скидки к выручке сверх потолка (budget_cap_mode tiered)
    basis: "оценка аналитика"
  billing_period:
    label: Период выставления счетов
    draft: month
    unit: "month | quarter"
    basis: "оценка аналитика"
  author_share:
    label: Авторская доля
    draft: 0.1
    unit: доля маржи продукта автору курса (распределение прибыли, не себестоимость — A27)
    basis: "оценка аналитика; model/A2.yaml, A27: авторская доля — распределение прибыли"
  market_gap_threshold:
    label: Порог расхождения с рынком
    draft: 0.5
    unit: доля отклонения себестоимости или цены от середины рыночного ориентира, выше которой — флаг
    basis: "оценка аналитика"
  sensitivity_step:
    label: Шаг чувствительности статей затрат
    draft: 0.2
    unit: доля ± к масштабу статьи затрат в анализе чувствительности
    basis: "оценка аналитика"
  extended_campaign:
    label: Расширенная кампания продвижения
    draft: false
    unit: "true — к продукту добавляется кампания: цена привлечения контакта × контакты плана (A47)"
    basis: "model/A4.yaml, A47 — опция пакета сверх базового анонса A43"
  campaign_cost_per_contact:
    label: Стоимость привлечения контакта, ₽
    draft: null
    unit: "₽ за регистрацию; null — середина rates.yaml doctor_contacts.paid_acquisition_cost_per_lead_rub.registration"
    basis: "../rates/rates.yaml doctor_contacts"
  teams:
    label: Команд в плане месяца
    draft: 1
    unit: число команд направления в плане периода
    basis: "оценка аналитика: одна команда направления (teams.yaml)"
  plan_mix:
    label: Продукт плана месяца
    draft: курс
    unit: продукт, которым команда загружена на полную мощность в плане по умолчанию
    basis: "process-to-be-ru.md, «Сквозной поток»: команда направления выпускает курсы (уроки, подкасты, клубы); направление = сумма единиц плана (capacity-ru.md)"
  market_entries_per_team_month:
    label: Выходов на рынок на команду в месяц
    draft: [0.0833, 0.1667]
    unit: проходов A11 «выйти на рынок» на команду в месяц
    basis: "оценка аналитика: один–два выхода направления к фарме в год по окнам бюджетного цикла (O-133)"
  reporting_periods_per_month:
    label: Отчётных периодов в месяц
    draft: 0.3333
    unit: отчётных периодов в месяц (A54 выплаты, A654 калибровка)
    basis: "оценка аналитика: отчётный период — квартал"
  new_teams_per_month:
    label: Открытий направления в месяц
    draft: 0
    unit: открытий направления (A61) в месяц
    basis: "capacity-ru.md: в месяце примера нет открытия и деления"
  divisions_per_month:
    label: Делений команды в месяц
    draft: 0
    unit: делений команды (A62) в месяц
    basis: capacity-ru.md, пример
  hires_per_month:
    label: Наймов в месяц
    draft: 0
    unit: наймов (A63) в месяц
    basis: capacity-ru.md, пример
  standards_revisions_per_month:
    label: Ревизий стандартов в месяц
    draft: 0
    unit: ревизий стандартов (A651) в месяц
    basis: capacity-ru.md, пример
  sops_per_month:
    label: Новых СОП в месяц
    draft: 0
    unit: новых СОП (A652) в месяц
    basis: capacity-ru.md, пример
  signals_per_unit:
    label: Сигналов неактуальности на единицу
    draft: [0.05, 0.2]
    unit: сигналов неактуальности на единицу за срок договора (В6)
    basis: "оценка аналитика без опоры в реестре — калибровать по потоку сигналов A44"
  affected_share:
    label: Доля затронутых единиц
    draft: [0.1, 0.3]
    unit: доля единиц, затронутых за срок договора (В6)
    basis: "оценка аналитика без опоры в реестре"
  rebuild_share:
    label: Доля часов линии на пересборку
    draft: [0.1, 0.3]
    unit: доля часов линии единицы, которая повторяется при актуализации (В6)
    basis: "оценка аналитика без опоры в реестре"

# Ставка роли, которой в rates.yaml нет как часа штата, берётся у прокси — по proxy_role записи.
rate_proxy:
  "Медиа-круг — голос": "Медиа-круг — монтажёр"
rate_proxy_basis: "rates.yaml, «Медиа-круг — голос», proxy_role: работа оператора синтеза — часовая стоимость монтажёра"

# Роли экспертов: час = rates.yaml experts.grades[грейд].per_hour_rub (середина) × часы листа; грейд —
# переменная. Гонорар за единицу поверх часов не начисляется — иначе двойной учёт.
expert_roles:
  "Пул экспертов — амбассадор": expert_grade_author
  "Пул экспертов — эксперт": expert_grade_lesson
  "Пул экспертов — спикер": expert_grade_speaker

# Пул «Инструменты и инфраструктура» из rates.yaml tools: подписки, разовые лицензии, Платформа DS,
# оборудование (capex ÷ useful_life_months). ai_items — подписки статьи «ИИ», прочее — статья «прочие
# инструменты». platform_items — строки platform_ds_monthly без двойного учёта: «весь prod-контур»
# уже включает prod-VPS и S3, поэтому они не суммируются отдельно.
tools_pool:
  ai_items:
    - "ChatGPT Business, место (годовая оплата)"
    - "Claude Team Standard, место (годовая оплата)"
    - "Midjourney Standard"
    - "Runway Pro"
    - "Kling Pro"
    - "ElevenLabs Pro (~600 мин синтеза)"
  platform_items:
    - "весь prod-контур (2 VPS + NAT + S3)"
    - "Timeweb Cloud, 8 vCPU / 12 ГБ / 100 ГБ (stage, preset 4805) + IPv4"
    - "Kinescope Super — видеохостинг и CDN (от 10 € в месяц + 0,03 € за ГБ)"
    - "домены платформы (.ru, продление 999 ₽ в год за домен, ×3)"
  one_off_life_months: 36
  one_off_basis: "разовая лицензия ПО распределяется на срок компьютера — 36 мес. (rates.yaml tools.useful_life_basis)"

# Расширенная кампания (переменная extended_campaign): затрата = campaign_cost_per_contact × контакты
# плана; работа A47 — чёрный ящик модели, строка «не задано: подпроцесс не раскрыт».
extended_campaign:
  pending: A47
  name: Расширенная кампания продвижения

# Листья периода и системы: сколько проходов в месяц даёт план. `per` — произведение переменных
# (`teams` — число команд плана). Листья с единицей продукта сюда не входят — их объём задаёт план единиц.
period_leaves:
  - { leaf: A11, per: [teams, market_entries_per_team_month] }
  - { leaf: A54, per: [reporting_periods_per_month] }
  - { leaf: A61, per: [new_teams_per_month] }
  - { leaf: A62, per: [divisions_per_month] }
  - { leaf: A63, per: [hires_per_month] }
  - { leaf: A641, per: [teams] }
  - { leaf: A642, per: [teams] }
  - { leaf: A643, per: [teams] }
  - { leaf: A651, per: [standards_revisions_per_month] }
  - { leaf: A652, per: [sops_per_month] }
  - { leaf: A653, per: [teams] }
  - { leaf: A654, per: [reporting_periods_per_month] }

# Резерв актуализации единицы (В6): лист сигнала, листья затронутой единицы, линия пересборки.
update_reserve:
  signal_leaf: A44
  affected_leaves: [A45, A46]
  basis: effort-draft-ru.md, «Выпуск и сопровождение» — резерв единицы на срок договора

# Внешние затраты: названия здесь, рубли — ../rates/rates.yaml external_costs (тот же ключ), правка —
# override `external:<id>`. Нет значения — «не задано»: калькулятор не считает его нулём. В продукте
# `{ id, hours_of: [лист] }` — затрата на час: × часы этих листов единицы. Гонорары спикеров здесь не
# появляются: часы A3241 и A339 — операции продуктов, цена — грейд эксперта × часы.
externals:
  ai_generation:
    name: ИИ-генерация медкадров и анимации
    basis: "model/A314.yaml, A3143: генерация — внешняя затрата"
  voices_licences:
    name: Голоса и лицензии синтеза речи
    basis: "model/A314.yaml, A3145: голоса и лицензии (O-118, O-119) — внешняя затрата"
  podcast_studio:
    name: Студия записи подкаста
    basis: "model/A32.yaml, A324: студия — внешняя затрата, цена за час записи (операторы и режиссёрское переключение студии включены)"
  video_podcast_crew:
    name: "Видеоподкаст: операторы нескольких камер"
    component: video_podcast.multi_camera_crew
    basis: "rates.yaml external_costs.video_podcast.components.multi_camera_crew — смена, середина диапазона"
  video_podcast_director:
    name: "Видеоподкаст: режиссёр съёмки"
    component: video_podcast.director
    basis: "rates.yaml external_costs.video_podcast.components.director — смена, середина диапазона"
  video_podcast_grading:
    name: "Видеоподкаст: цветокоррекция и графика"
    component: video_podcast.grading_graphics
    basis: "rates.yaml external_costs.video_podcast.components.grading_graphics — эпизод, середина диапазона"
  video_podcast_cover:
    name: "Видеоподкаст: обложка"
    component: video_podcast.cover
    basis: "rates.yaml external_costs.video_podcast.components.cover — эпизод, середина диапазона"
  video_podcast_clips:
    name: "Видеоподкаст: клипы"
    component: video_podcast.clips
    basis: "rates.yaml external_costs.video_podcast.components.clips — цена клипа × клипов на эпизод, середины диапазонов"
  event_venue_broadcast:
    name: Площадка и трансляция мероприятия
    basis: "model/A33.yaml, A334: площадка и трансляция — внешние затраты; онлайн — собственная платформа (0), для очного задаёт владелец"

# Продукты. reserve_line — номер линии модели (префикс листьев), чьи прямые часы × доля пересборки
# входят в резерв актуализации единицы (В6). items: { leaf, qty?, per? } — лист модели; { product, qty } — другой продукт;
# { pending, qty?, per? } — чёрный ящик модели (decomposition: pending), строка «не задано: подпроцесс не раскрыт». qty — число
# или имя параметра продукта; per — список параметров-множителей (драйверы). Параметр: draft
# (число, [min, max] или null), unit, basis. lead — срок: chain (цепочка листов: seq — сумма,
# par — максимум) или pipeline (первые единицы подряд + такт узкого места на остальные).
# contact_type — тип контакта с врачом (rates.yaml doctor_contacts.contact_types) для цены контакта;
# без него у продукта нет оплаты за результат.
products:
  урок:
    name: Урок (≈ 45 мин)
    contact_type: single_lesson_view
    basis: "process-to-be-ru.md, «Сквозной поток»: урок — сериал, микролернинги, материал для скачивания, запись подкаста, тесты; линия A31 и выпуск A41–A43"
    reserve_line: A31
    parameters:
      доля_спонсорских:
        draft: [0.5, 1]
        unit: доля спонсорских и брендированных уроков — только у них есть рекламная часть (A3132)
        basis: "оценка аналитика: тип контента по финансированию (O-154) — независимый, спонсорский или коммерческий; урок по договору DS обычно спонсирует фарма (process-to-be-ru.md :104, :151), независимый урок по гранту рекламной части не имеет (effort-draft-ru.md :29); калибровка по портфелю договоров"
    items:
      - { leaf: A3111 }
      - { leaf: A3112 }
      - { leaf: A3113 }
      - { leaf: A312 }
      - { leaf: A3131 }
      - { leaf: A3132, per: [доля_спонсорских] }
      - { leaf: A3133 }
      - { leaf: A3134 }
      - { leaf: A3141 }
      - { leaf: A3142 }
      - { leaf: A3143 }
      - { leaf: A3144 }
      - { leaf: A3145 }
      - { leaf: A3146 }
      - { leaf: A315 }
      - { leaf: A3161 }
      - { leaf: A3162 }
      - { leaf: A3163 }
      - { leaf: A41 }
      - { leaf: A42 }
      - { leaf: A43 }
    externals: [ai_generation, voices_licences]
    lead:
      chain:
        seq:
