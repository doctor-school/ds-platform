boxes:
  - id: A11
    name: Выйти на рынок и сформировать спрос
    functions: [F-112, F-105, F-001, F-002, F-003]
    mechanisms: [Аккаунт]
    note: >-
      Шаги 1–3: сегменты по данным ядра (консультант рынка — советующая роль), «посев» первыми курсами,
      презентация в окна бюджетирования, партнёрство с техоргом.
    leaf: true
    effort:
      role: Аккаунт
      unit: направление
      hours_draft: [16, 40]
      lead_days_draft: [20, 60]
      lead_days_basis: "оценка аналитика; опора: окно бюджетирования фармы сентябрь–ноябрь (L679), 3 окна выхода (L1281)"
      driver: число окон выхода к фарме × число целевых партнёров; канал (прямой / техорг)
      basis: "оценка аналитика; опора: 3 окна выхода к фарме (L1281), окно сентябрь–ноябрь (L679)"
  - id: A12
    name: Принять и квалифицировать запрос
    functions: [F-013, F-114, F-014, F-012]
    mechanisms: [Аккаунт]
    note: Шаги 4–6 — запрос или инициатива лидера, потребности сторон, барьерные условия.
    leaf: true
    effort:
      role: Аккаунт
      unit: запрос
      hours_draft: [1, 3]
      lead_days_draft: [1, 3]
      lead_days_basis: "оценка аналитика"
      driver: число входящих запросов; доля отсечённых барьерными условиями
      basis: оценка аналитика
  - id: A13
    name: Сформировать КП и получить решение партнёра
    functions: [F-005, F-075, F-076, F-080, F-108, F-004, F-116, F-006]
    mechanisms: [Аккаунт]
    note: >-
      Шаги 7–11: 2–3 стандартных варианта финансирования, слот или серия подкастов, расчёт по
      калькулятору, КП; решение фармы (F-116, F-006) — внешний шаг, часы DS — только сопровождение.
    leaf: true
    effort:
      role: Аккаунт
      unit: КП
      hours_draft: [4, 10]
      lead_days_draft: [3, 10]
      lead_days_basis: "оценка аналитика; ожидание решения партнёра внутри прохода"
      driver: канал продажи; длина цикла продажи против окна бюджета фармы
      iterations: итерации КП
      basis: "оценка аналитика; опора: 2–3 варианта финансирования устраивают 99 % клиентов (L3315)"
  - id: A14
    name: Зафиксировать маршрут одобрения и отступления
    functions: [F-010, F-049, F-061]
    mechanisms: [Аккаунт]
    note: >-
      Шаги 12–13: маршрут одобрения фармы (стандарт — один раз на компанию), точки гибкости — только
      при финансировании направления; при гранте маршрут пуст.
    leaf: true
    effort:
      role: Аккаунт
      unit: договор
      hours_draft: [1, 6]
      lead_days_draft: [2, 5]
      lead_days_basis: "оценка аналитика"
      driver: >-
        новая компания или повторная (F-061 — один раз); доля нестандартных договоров (advice process
        расширенного круга)
      basis: оценка аналитика
  - id: A15
    name: Проверить мощность до подписи
    functions: []
    mechanisms: [Продюсер]
    note: >-
      Шаг 15 (новое, в реестре нет): резерв медиа-круга, рецензентов и экспертов под сроки договора.
    leaf: true
    effort:
      role: Продюсер
      unit: договор
      hours_draft: [1, 3]
      lead_days_draft: [1, 2]
      lead_days_basis: "оценка аналитика"
      driver: число единиц в предмете договора × число общих пулов под резерв
      basis: оценка аналитика
  - id: A16
    name: Заключить договор
    functions: [F-007, F-008, F-011]
    mechanisms: [Сервисный круг — юрист]
    note: Шаг 14 — шаблон DS, рамочный и допсоглашения, агент-прослойка.
    leaf: true
    effort:
      role: Сервисный круг — юрист
      unit: договор
      hours_draft: [1, 4]
      lead_days_draft: [5, 15]
      lead_days_basis: "оценка аналитика; ожидание юрслужбы партнёра внутри прохода"
      driver: доля нестандартных договоров; канал через агента-прослойку
      iterations: итерации нестандартного договора
      basis: оценка аналитика
