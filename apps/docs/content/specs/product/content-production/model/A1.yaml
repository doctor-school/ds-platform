boxes:
  - id: A11
    name: Сформировать спрос через Академию смыслов
    functions: [F-112, F-105, F-102, F-001, F-002, F-003]
    mechanisms: [Аккаунт]
    note: >-
      Шаги 1–3. Главный канал привлечения — Академия смыслов: аккаунт планирует N выпусков и M рилсов
      в месяц, приглашает гостей фармы (F-102); выпуски производит линия подкастов A32 по этому
      плану, их стоимость идёт в пул «привлечение» на сделки. Активный путь — сегменты по данным
      ядра, «посев» первыми курсами, окна бюджетирования, техорг — резерв, особенно на старте.
    leaf: true
    effort:
      role: Аккаунт
      unit: направление
      hours_draft: [16, 40]
      lead_days_draft: [20, 60]
      lead_days_basis: "оценка аналитика; опора: окно бюджетирования фармы сентябрь–ноябрь (L679), 3 окна выхода (L1281)"
      driver: >-
        число выпусков Академии смыслов в месяц и приглашённых гостей фармы; для резервного пути —
        число окон выхода к фарме × число целевых партнёров, канал (прямой / техорг)
      basis: "оценка аналитика; опора: 3 окна выхода к фарме (L1281), окно сентябрь–ноябрь (L679)"
  - id: A12
    name: Принять и квалифицировать запрос
    functions: [F-013, F-114, F-014, F-012]
    mechanisms: [Аккаунт, Продюсер, Продуктовая команда]
    note: >-
      Шаги 4–6: пара аккаунт + продюсер, закреплённая за партнёром; на стартовый звонок с партнёром
      подключается продуктовая команда.
  - id: A13
    name: Сформировать КП и получить решение партнёра
    functions: [F-005, F-075, F-076, F-080, F-108, F-004, F-116, F-006]
    mechanisms: [Аккаунт, Продюсер]
    note: >-
      Шаги 7–11: 2–3 стандартных варианта финансирования, слот или серия подкастов, расчёт по
      калькулятору, КП; решение фармы (F-116, F-006) — внешний шаг, часы DS — только сопровождение.
  - id: A14
    name: Согласовать с фармой порядок проверки контента
    functions: [F-049, F-061]
    mechanisms: [Аккаунт, Продюсер]
    note: >-
      Шаг 13: состав и этапы проверки контента фармой; стандарт согласуется один раз на компанию;
      при гранте проверки нет. Отступления от шаблона договора — в A16.
  - id: A15
    name: Проверить мощность до подписи
    functions: []
    mechanisms: [Продюсер]
    note: >-
      Шаг 15 (новое, в реестре нет): резерв медиа-круга, рецензентов и экспертов под сроки договора
      по загрузке и мощности команд (A6, раз в месяц); не хватает мощности — потребность в новой
      команде уходит в A61.
    leaf: true
    effort:
      role: Продюсер
      unit: договор
      hours_draft: [1, 3]
      lead_days_draft: [1, 2]
      lead_days_basis: "оценка аналитика"
      driver: число единиц в предмете договора × число общих пулов под резерв
      basis: оценка аналитика
  - id: A16
    name: Заключить договор
    functions: [F-010, F-007, F-008, F-011]
    mechanisms: [Сервисный круг — юрист]
    note: >-
      Шаги 12 и 14: шаблон DS, рамочный и допсоглашения, агент-прослойка; отступления от шаблона —
      только при финансировании направления (F-010). Число кругов у каждого клиента своё —
      диапазон петли «итерации нестандартного договора».
    leaf: true
    effort:
      role: Сервисный круг — юрист
      unit: договор
      hours_draft: [1, 4]
      lead_days_draft: [5, 15]
      lead_days_basis: "оценка аналитика; ожидание юрслужбы партнёра внутри прохода"
      driver: доля нестандартных договоров; канал через агента-прослойку
      iterations: итерации нестандартного договора
      basis: оценка аналитика
