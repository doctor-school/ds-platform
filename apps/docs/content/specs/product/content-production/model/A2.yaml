boxes:
  - id: A21
    name: Сформировать программу курса
    functions: [F-016, F-017, F-018, F-062]
    mechanisms: [Методолог]
    note: >-
      Шаги 3–5: знания и цели от автора курса, программа 60/40, пожелания компаний; спонсорский
      контент — фарма согласует программу у себя (F-062). Решающий голос по медицине — автор курса;
      его часы — в A28.
    leaf: true
    effort:
      role: Методолог
      unit: курс
      hours_draft: [24, 40]
      lead_days_draft: [10, 20]
      lead_days_basis: "оценка аналитика"
      driver: число модулей и уроков в курсе; один курс или скелет направления
      iterations: итерации программы с фармой (F-062)
      basis: "оценка аналитика; опора: курс 36 ч = 3 модуля × 6 уроков + клубы (L2051, M:2026-08-28-0958)"
  - id: A22
    name: Нарезать программу и определить тип контента
    functions: [F-019, F-065, F-063]
    mechanisms: [Методолог]
    note: Шаги 6–7 — уроки и модули, тип контента, место рекламы вне микролернинга, маркировка вебинара.
    leaf: true
    effort:
      role: Методолог
      unit: курс
      hours_draft: [6, 12]
      lead_days_draft: [3, 5]
      lead_days_basis: "оценка аналитика"
      driver: число уроков и модулей; доля спонсорских и брендированных единиц
      basis: "оценка аналитика; опора: 18 уроков + 18 подкастов + 3 клуба — пример курса (L2051)"
  - id: A23
    name: Закрепить экспертов, авторов и клинические случаи
    functions: [F-020, F-021, F-022, F-024, F-025]
    mechanisms: [Менеджер эксперта]
    note: >-
      Шаги 2, 8–9: автор курса и приглашённые спикеры уроков через их менеджеров, клинические случаи
      сначала из библиотеки, поиск недостающих экспертов. Договоры с ними — A27.
    leaf: true
    effort:
      role: Менеджер эксперта
      unit: курс
      hours_draft: [16, 32]
      lead_days_draft: [10, 20]
      lead_days_basis: "оценка аналитика; опора: SLA ответа эксперта 24 ч (L1777), ответ ассистентов раз в неделю (L1829)"
      driver: >-
        число амбассадоров и экспертов на курс; доля повторно используемых клинических случаев;
        время поиска эксперта
      basis: оценка аналитика
  - id: A24
    name: Назначить независимых медрецензентов
    functions: []
    mechanisms: [Пул медрецензентов — координатор]
    note: >-
      Шаг 14 (новое): рецензент ≠ автор, ≠ соавтор, ≠ команда; уроки, модули и тип контента (A22)
      задают, сколько рецензентов и какой профиль нужен.
    leaf: true
    effort:
      role: Пул медрецензентов — координатор
      unit: курс
      hours_draft: [1, 3]
      lead_days_draft: [2, 5]
      lead_days_basis: "оценка аналитика"
      driver: число уроков курса; загрузка пула
      basis: оценка аналитика
  - id: A25
    name: Спланировать подкасты и график мероприятий
    functions: [F-073, F-074, F-115]
    mechanisms: [Продюсер]
    note: >-
      Шаги 11–12: годовой план подкастов, серия и спонсоры с лидером, график мероприятий с партнёром
      (вместе с менеджером мероприятий).
    leaf: true
    effort:
      role: Продюсер
      unit: курс
      hours_draft: [4, 8]
      lead_days_draft: [2, 5]
      lead_days_basis: "оценка аналитика"
      driver: число подкастов и мероприятий в курсе
      basis: "оценка аналитика; опора: 12 выпусков на тему подкаста (L2019)"
  - id: A26
    name: Назначить дедлайны и зарезервировать мощность
    functions: [F-066]
    mechanisms: [Продюсер]
    note: "Шаг 13: дедлайны этапов и бронь слотов медиа-круга, часов рецензентов и экспертов (новое)."
    leaf: true
    effort:
      role: Продюсер
      unit: курс
      hours_draft: [4, 8]
      lead_days_draft: [1, 3]
      lead_days_basis: "оценка аналитика"
      driver: число единиц в плане × число общих пулов
      basis: оценка аналитика
  - id: A27
    name: Заключить договоры с экспертами и лидерами
    functions: [F-026]
    mechanisms: [Менеджер эксперта, Сервисный круг — юрист]
    note: >-
      Шаг 10: рамочный договор — один раз на эксперта, приложение — на каждый курс (SLA, автоодобрение,
      гонорар, авторская доля). Гонорар — себестоимость, авторская доля — распределение прибыли.
  - id: A28
    name: Вести курс как автор
    functions: [F-015]
    mechanisms: [Пул экспертов — амбассадор]
    note: >-
      Шаг 1: автор курса (амбассадор) задаёт видение и программу и проверяет все материалы курса — на
      курс; приглашённые спикеры уроков готовят свой материал в линии урока (A3112), сценарист
      собирает урок (A312).
    leaf: true
    effort:
      role: Пул экспертов — амбассадор
      unit: курс
      hours_draft: [20, 40]
      lead_days_draft: [10, 20]
      lead_days_basis: "оценка аналитика; опора: SLA ответа эксперта 24 ч (L1777)"
      driver: число уроков курса (проверка каждого); доля уроков с приглашёнными спикерами
      basis: "оценка аналитика; опора: курс 36 ч = 18 уроков (L2051)"
