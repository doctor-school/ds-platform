      монтаж идут потоком в медиа-круге; пики — внешний пул по стандарту DS. Нарезка записей
      мероприятий — тот же монтаж.
  - id: A315
    name: Составить тесты и материалы
    functions: [F-045, F-046]
    mechanisms: [Медредактор-сценарист]
