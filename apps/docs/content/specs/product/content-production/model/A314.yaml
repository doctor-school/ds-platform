    leaf: true
    effort:
      role: Медиа-круг — голос
      unit: урок
      hours_draft: [2, 4]
      driver: число реплик; длительность ролика
      basis: оценка аналитика
  - id: A3146
    name: Смонтировать ролик и микролернинги
    functions: [F-047, F-048]
    mechanisms: [Медиа-круг — монтажёр]
    note: >-
