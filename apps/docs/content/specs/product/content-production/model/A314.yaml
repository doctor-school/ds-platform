    effort:
      role: Медиа-круг — аниматор
      unit: урок
      hours_draft: [10, 20]
      driver: доля схем под анимацию; длительность ролика
      basis: "оценка аналитика; опора: 5 из 20 схем под анимацию (L2825)"
