      микролернинги (F-048) — тот же монтаж, единица — запись.
    leaf: true
    effort:
      role: Медиа-круг — монтажёр
      unit: урок
      hours_draft: [10, 18]
      driver: длительность ролика; число микролернингов; число записей мероприятий на нарезку
      iterations: круги правок монтажа и рекламных кадров
      basis: "оценка аналитика; опора: микролернинг ≈ 5 мин (L675), урок ≈ 45 мин (M:2026-08-28-0958)"
