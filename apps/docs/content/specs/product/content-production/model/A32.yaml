    functions: [F-087, F-088]
    mechanisms: [Медиа-круг — монтажёр, Медиа-круг — анонсы]
    note: >-
      Шаг 23: нарезки и выкладка, архив или встраивание в урок как компонент; видеоподкаст добавляет
      цветокоррекцию и графику, обложки и 5–10 клипов; рилсы Академии смыслов — по плану A11.
