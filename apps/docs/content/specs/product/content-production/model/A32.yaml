      Шаг 20: слайд-кит лидеру, согласование коммерческой части; при отказе — второй лектор. Тот же шаг
      для мероприятий (блок 4, шаг 3) — его часы на мероприятие в листе A332.
    leaf: true
    effort:
      role: Менеджер эксперта
      unit: эпизод
      hours_draft: [1, 3]
      lead_days_draft: [3, 7]
      lead_days_basis: "оценка аналитика; ожидание лидера и фармы внутри прохода"
      driver: доля эпизодов с коммерческой частью; доля отказов лидера
      iterations: замена спикера вторым лектором
      basis: "оценка аналитика; опора: коммерческая часть 10–15 мин / 10–15 слайдов из 45–60 (L1911, L2003)"
  - id: A323
    name: Оформить сценарий подкаста и маркировку
    functions: [F-083, F-078]
    mechanisms: [Медредактор-сценарист]
