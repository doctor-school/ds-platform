      lead_days_basis: "оценка аналитика"
      driver: длительность эпизода; наличие коммерческой части
      basis: оценка аналитика
  - id: A324
    name: Записать подкаст
    functions: [F-084, F-085]
    mechanisms:
      - Пул экспертов — спикер
      - Медиа-круг — запись подкаста
      - Сервисный круг — режиссёр трансляции
    note: >-
      Шаг 22: запись в общей студии (В3); чисто коммерческий подкаст — вариант той же линии. Эпизод
      подкаста — гость и запись звука и одной камеры; видеоподкаст добавляет съёмку на несколько камер
      с режиссёром. Студия — внешняя затрата.
