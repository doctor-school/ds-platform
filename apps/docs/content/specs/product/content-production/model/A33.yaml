      unit: мероприятие
      hours_draft: [2, 4]
      lead_days_draft: [7, 13]
      lead_days_basis: "оценка аналитика; приглашение врачей до даты мероприятия"
      driver: число каналов приглашения; онлайн / офлайн
      basis: оценка аналитика
  - id: A338
    name: Подготовить офлайн мероприятие
    functions: []
    mechanisms: [Менеджер мероприятий]
    note: >-
      Новое, только офлайн мероприятие (практическая школа): площадка, очная логистика, подряд
