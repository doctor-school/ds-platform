      правилу; архив, запись — на нарезку микролернингов (A31).
    leaf: true
    effort:
      role: Сервисный круг — оператор платформы
      unit: мероприятие
      hours_draft: [1, 2]
      lead_days_draft: [2, 5]
      lead_days_basis: "оценка аналитика"
      driver: доля ручных начислений НМО; число участников
      basis: оценка аналитика
  - id: A337
    name: Пригласить врачей
    functions: [F-119]
    mechanisms: [Менеджер мероприятий]
    note: >-
      Шаг 4: приглашение врачей через каналы партнёра и платформы до даты мероприятия; регистрации
      врачей — на вход поддержке и контролю присутствия.
