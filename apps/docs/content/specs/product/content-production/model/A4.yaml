boxes:
  - id: A41
    name: Промаркировать и присвоить теги
    functions: [F-064]
    mechanisms: [Медредактор-сценарист]
    note: >-
      Шаги 1–2: маркировка по типу контента и НМО; теги (препарат, МНН, рекомендация) при выпуске —
      новое: без них поиск затронутых единиц (F-096) становится ручным.
    leaf: true
    effort:
      role: Медредактор-сценарист
      unit: урок
      hours_draft: [0.5, 1]
      lead_days_draft: [0.5, 1]
      lead_days_basis: "оценка аналитика"
      driver: число тегов на урок; тип контента (спонсорский, брендированный, НМО)
      basis: оценка аналитика
  - id: A42
    name: Опубликовать по очереди выпуска
    functions: [F-069]
    mechanisms: [Сервисный круг — оператор платформы]
    note: >-
      Шаг 3: загрузка и публикация на платформе DS по дате релиза; реклама — только в слое приложения.
      Очередь и дату релиза держит продюсер — его часы в A3162 (приёмка и очередь). Здесь же
      исполняется решение «промаркировать или снять» из A46.
    leaf: true
    effort:
      role: Сервисный круг — оператор платформы
      unit: публикация
      hours_draft: [0.25, 0.5]
      lead_days_draft: [0.5, 1]
      lead_days_basis: "оценка аналитика"
      driver: число публикаций за период (ритм — 1 урок в неделю на направление); снятия по A46
      basis: оценка аналитика
  - id: A43
    name: Анонсировать урок
    functions: [F-070, F-071]
    mechanisms: [Медиа-круг — анонсы]
    note: Шаг 4 — тизер и анонс в соцсетях за неделю до релиза, рилсы, анонс в календаре.
    leaf: true
    effort:
      role: Медиа-круг — анонсы
      unit: урок
      hours_draft: [2, 4]
      lead_days_draft: 5
      lead_days_basis: "оценка аналитика; опора: тизер за неделю до релиза (L1843)"
      driver: число анонсов на урок (тизер, рилсы, календарь); каналы партнёра
      basis: оценка аналитика
  - id: A44
    name: Принять сигнал и найти затронутые единицы
    functions: [F-095, F-096]
    mechanisms: [Продюсер]
    note: >-
      Шаги 5–6: заявка peer review или внешнее событие (отзыв препарата, новая рекомендация); поиск
      по тегам выпуска.
    leaf: true
    effort:
      role: Продюсер
      unit: сигнал
      hours_draft: [0.5, 2]
      lead_days_draft: [1, 3]
      lead_days_basis: "оценка аналитика"
      driver: поток сигналов неактуальности на 100 уроков; полнота тегов
      basis: оценка аналитика
  - id: A45
    name: Дать заключение по затронутой единице
    functions: []
    mechanisms: [Пул медрецензентов]
    note: >-
      Шаг 7, часть рецензента (в реестре отдельным шагом нет): пул рецензентов — по сигналу; решение
      «обновить / снять» команда принимает после заключения.
    leaf: true
    effort:
      role: Пул медрецензентов
      unit: затронутая единица
      hours_draft: [0.5, 1.5]
      lead_days_draft: [2, 5]
      lead_days_basis: "оценка аналитика"
      driver: число затронутых единиц на сигнал; глубина расхождения с рекомендацией
      basis: оценка аналитика
  - id: A46
    name: Решить и запустить актуализацию
    functions: [F-097, F-098, F-099]
    mechanisms: [Продюсер]
    note: >-
      Шаг 7: команда-владелец решает обновить урок или сделать подкаст обновления (задание уходит в
      линии A31 / A32 — там часы пересборки) либо промаркировать или снять урок (исполняет A42);
      срочное снятие при отзыве препарата — директивно по закону. Резерв актуализации — параметр на
      срок договора (решение В6).
    leaf: true
    effort:
      role: Продюсер
      unit: затронутая единица
      hours_draft: [0.5, 1]
      lead_days_draft: [1, 2]
      lead_days_basis: "оценка аналитика"
      driver: доля уроков, требующих обновления; глубина (подкаст обновления или пересборка)
      basis: оценка аналитика
