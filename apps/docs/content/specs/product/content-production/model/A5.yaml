boxes:
  - id: A51
    name: Измерить осведомлённость и собрать данные
    functions: [F-110]
    mechanisms: [Продюсер]
    note: >-
      Шаг 1: входной и выходной тест урока (реко Р6.1 — во всех продуктах), посещаемость и досмотры
      — из данных платформы, не вручную.
    leaf: true
    effort:
      role: Продюсер
      unit: отчётный этап
      hours_draft: [1, 3]
      driver: число отчётных этапов на договор; доля ручной сборки данных
      basis: оценка аналитика
  - id: A52
    name: Сформировать и отправить отчёт партнёру
    functions: [F-089, F-090, F-104]
    mechanisms: [Аккаунт]
    note: >-
      Шаги 2–3: отчёт по предмету соглашения; при сервисном пакете «под ключ» — отчёт и презентация;
      при агенте-прослойке — напрямую фарме. Юрист — по advice process при рекламных метриках.
    leaf: true
    effort:
      role: Аккаунт
      unit: отчётный этап
      hours_draft: [2, 6]
      driver: число отчётов на договор (этапы); сервисный пакет; доля ручной сборки данных
      basis: оценка аналитика
  - id: A53
    name: Закрыть документы и принять оплату
    functions: [F-091, F-092, F-093, F-094]
    mechanisms: [Сервисный круг — бухгалтер]
    note: >-
      Шаги 4–5: закрывающий акт по реестру документов через ЭДО; подпись уполномоченного лица и
      проводка как маркетингового расхода (F-092, F-093) — внешние шаги заказчика, часы DS — только
      сопровождение.
    leaf: true
    effort:
      role: Сервисный круг — бухгалтер
      unit: отчётный этап
      hours_draft: [1, 3]
      driver: часы бухгалтера на договор; требования бухгалтерии заказчика
      iterations: итерации подписания
      basis: оценка аналитика
  - id: A54
    name: Выплатить гонорары и распределить авторскую долю
    functions: [F-129]
    mechanisms: [Сервисный круг — бухгалтер]
    note: >-
      Шаг 6: гонорары по открытой сетке (ставка × часы) — себестоимость; авторская доля —
      распределение прибыли, вне себестоимости. Часы бухгалтера на расчёт — накладные (решение В8).
    leaf: true
    effort:
      role: Сервисный круг — бухгалтер
      unit: отчётный период
      hours_draft: [2, 6]
      driver: число получателей гонораров и авторской доли за период
      basis: оценка аналитика
  - id: A55
    name: Собрать обратную связь и договориться о следующем цикле
    functions: [F-100, F-101, F-103]
    mechanisms: [Аккаунт]
    note: >-
      Шаги 7–8: обратная связь заказчика; при инциденте — признать и предложить бонус (влияет на цену,
      не на себестоимость); договор о намерениях или предзаказ на следующий год → вход A1.
    leaf: true
    effort:
      role: Аккаунт
      unit: договор
      hours_draft: [2, 5]
      driver: доля договоров с инцидентом; длина цикла предзаказа против окна бюджета фармы
      basis: оценка аналитика
  - id: A56
    name: Провести ретро команды по проекту
    functions: []
    mechanisms: [Продуктовая команда]
    note: >-
      Шаг 9 (новое, в реестре нет): факт часов и итераций против калькулятора, открыто для всех
      команд; без ретро калькулятор не калибруется. Часы — суммарно по участникам команды;
      фасилитация коуча — в A6.
    leaf: true
    effort:
      role: Продуктовая команда
      unit: договор
      hours_draft: [4, 12]
      driver: число участников команды в проекте; число единиц в предмете договора
      basis: оценка аналитика
