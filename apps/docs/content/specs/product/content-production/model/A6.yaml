boxes:
  - id: A61
    name: Открыть направление и запустить команду
    functions: [F-113]
    mechanisms: [Ядро]
    note: >-
      Шаги 1–2: ниша по кастомным запросам и сигналам команд; финансирование — якорный партнёр или
      2–3 спонсора по предзаказу; запуск — advice process ядра с затронутыми командами и пулами
      (мощность медиа, рецензентов, экспертов). Число стартов ограничено ожидаемым притоком денег (В7).
    leaf: true
    effort:
      role: Ядро
      unit: новая команда
      hours_draft: [40, 80]
      driver: число стартов за период; время выхода новой команды на полную мощность
      basis: оценка аналитика
  - id: A62
    name: Разделить команду
    functions: []
    mechanisms: [Продуктовая команда]
    note: >-
      Шаг 3 (новое, в реестре нет): при превышении 12 участников или второй оси нагрузки; решает сама
      команда. Часы — суммарно по участникам.
    leaf: true
    effort:
      role: Продуктовая команда
      unit: деление
      hours_draft: [8, 24]
      driver: число делений за период (рост числа направлений и договоров)
      basis: оценка аналитика
  - id: A63
    name: Нанять и ввести участника
    functions: []
    mechanisms: [Продуктовая команда]
    note: >-
      Шаг 4 (новое, в реестре нет): собеседование будущими коллегами, пробный срок, вводный модуль
      (самоуправление, стандарты DS, медицинская этика). Часы — время коллег, не нанимаемого.
    leaf: true
    effort:
      role: Продуктовая команда
      unit: найм
      hours_draft: [12, 30]
      driver: число наймов за период; время коллег на найм и адаптацию
      basis: оценка аналитика
  - id: A64
    name: Вести роли, коучинг и базу экспертов
    functions: [F-023]
    mechanisms: [Продуктовая команда, Коуч, Менеджер эксперта]
    note: Шаги 5–7 — три роли, раскрыто диаграммой A64.
  - id: A65
    name: Вести стандарты, СОП и метрики, калибровать себестоимость
    functions: [F-106, F-009, F-107, F-111, F-109]
    mechanisms: [Ядро, Продуктовая команда]
    note: Шаги 8–11 — раскрыто диаграммой A65.
