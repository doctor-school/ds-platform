# Team capacity model (format: FORMAT-ru.md, section «Команды и мощность»; formulas: capacity-ru.md).
# Standard direction-team composition and the shared circles/pools it draws on. FTE and hours are
# DRAFTS for owner calibration in the calculator (#2527); roles only, never people; no money here.
capacity_variables:
  productive_hours_per_month:
    draft: [110, 130]
    unit: часы на 1 FTE в месяц
    basis: >-
      оценка аналитика: ≈ 168 рабочих часов месяца × 0,65–0,75 на прямую работу (остальное —
      встречи команды, governance A641, коучинг A642, ретро A56, отпуска)
  working_days_per_month:
    draft: 21
    unit: рабочие дни в месяце
    basis: оценка аналитика; перевод lead time из рабочих дней в месяцы
  team_size_max:
    draft: 12
    unit: участников команды
    basis: решение владельца В7 — деление команды при > 12
  target_lessons_per_week:
    draft: 1
    unit: урок в неделю на направление
    basis: "цель ритма выпуска (L1661; M:2026-09-08-0952) — точка сверки мощности, не ограничение модели"

teams:
  - id: direction
    name: Команда направления
    basis: >-
      решения владельца В1 (ось «направление», гибрид), В2 (менеджер эксперта закреплён в команде),
      В3 (медиа-круг: обязательство мощности на период и ротация медиа-ведущего); роли — сводка
      «Роли и круги TO-BE» process-to-be-ru.md
    members:
      - role: Аккаунт
        fte_draft: 1
        basis: оценка аналитика; продажа A1, этапы фармы A3134/A3163, отчёт A5 одного направления
      - role: Продюсер
        fte_draft: 1
        basis: оценка аналитика; держатель потока — планирование A2, приёмка A3162, сигналы A44
      - role: Методолог
        fte_draft: [0.5, 1]
        basis: оценка аналитика; программа и нарезка курса A21–A22 — пик на старте курса
      - role: Медредактор-сценарист
        fte_draft: [2, 3]
        basis: >-
          оценка аналитика; сценарий × круги — самая длинная прямая работа урока (≈ 82 ч на урок в
          середине диапазона, capacity-ru.md); ритм 1 урок в неделю (L1661) требует ≈ 3 FTE, при 2,5 FTE — 3,7 урока в месяц
      - role: Менеджер мероприятий
        fte_draft: [0.5, 1]
        basis: оценка аналитика; клуб на модуль (3 на курс) и вебинары направления
      - role: Менеджер эксперта
        fte_draft: 1
        basis: оценка аналитика; закреплённый менеджер (В2) — эксперты направления, подкасты, база A643
    draws_on:
      - role: Медиа-круг — медиа-ведущий
        kind: ротация
        fte_draft: 1
        basis: решение В3 — один участник медиа-круга входит в команду на срок курса (раскадровка A3141)
      - role: Медиа-круг
        kind: обязательство мощности
        commitment: >-
          на период команда и медиа-круг фиксируют часы по подролям = план единиц периода × часы
          листа подроли × круги; пики сверх обязательства — внешний пул по стандарту DS (В3)
        basis: решение В3
      - role: Пул экспертов
        kind: пул
        commitment: часы экспертов и спикеров резервируются на курс при планировании (A26, шаг 13 блока 3)
        basis: process-to-be-ru.md, блок 3, шаг 13 — резервирование мощности
      - role: Пул медрецензентов
        kind: пул
        commitment: часы рецензентов резервируются на курс (A24 назначает, A26 резервирует); независим от команды
        basis: process-to-be-ru.md, блок 3, шаг 13; решение В4
      - role: Сервисный круг
        kind: по запросу
        commitment: накладные (В8) — мощность круга считается на все команды, а не на одну
        basis: решение В8
      - role: Ядро
        kind: по запросу
        commitment: накладные (В8); открытие направления A61, стандарты A651, калибровка A654
        basis: решение В8
      - role: Коуч
        kind: по запросу
        commitment: A642 — часы на команду·месяц
        basis: сводка «Роли и круги TO-BE»
