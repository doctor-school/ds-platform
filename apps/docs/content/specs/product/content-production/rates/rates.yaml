# Рыночные ставки ролей TO-BE — значения переменных калькулятора себестоимости (#2527).
# Метод, соответствие ролей рынку, достоверность и обновление — rates-ru.md (рядом).
# Деньги — только здесь; в model/*.yaml денежных сумм нет. Все суммы в рублях.
# monthly_gross_rub — месячная зарплата до вычета НДФЛ: [min, median, max]; median — суждение
#   по точкам данных, а не статистическая медиана, если в источнике не сказано иное.
# hourly_rub — [min, max] часовая ставка подрядчика (самозанятый / ИП / ГПХ / фирма); null — рынок
#   не продаёт роль по часам или данных нет (причина — в notes).
# hourly_by_grade_rub — { junior, middle, senior }, каждый [min, max]: внештатный час роли по грейду.
#   Полосы грейдов покрывают hourly_rub без зазоров: граница между соседними грейдами — середина
#   между их опорными точками (опорные точки — в hourly_basis). По умолчанию калькулятор берёт middle.
# hourly_basis — текст: что включает цена часа и как она получена (рынок, пересчёт поштучной цены,
#   производная gross × 1,5 ÷ 120 по методу Клерка; см. rates-ru.md, «Внештатный час по грейдам»).
# monthly_gross_by_grade_rub — { junior, middle, senior }, каждый [min, median, max], Москва: зарплата
#   по грейду, производная от monthly_gross_rub.moscow по правилу variables.grade_split (источники —
#   sources роли + grade_split.sources; достоверность — не выше grade_split.confidence).
# hourly_sources / hourly_confidence — источники и достоверность внештатного часа (hourly_rub,
#   hourly_by_grade_rub) там, где они собраны отдельно от зарплатных sources / confidence роли.
# per_piece — цена за единицу там, где рынок считает поштучно.
# sources[].accessed — дата обращения; period — период данных источника.
# sources[].kind — agency, если точка — средняя агентств/студий, а не частных исполнителей
#   (по умолчанию — частный исполнитель или вакансия).
meta:
  issue: https://github.com/doctor-school/ds-platform/issues/2526
  extended_by: https://github.com/doctor-school/ds-platform/issues/2841
  as_of: 2026-10-12
  currency: RUB
  net_to_gross: "вакансии «на руки» пересчитаны в gross как net ÷ 0,87 (НДФЛ 13 %; для верхних точек выше 2,4 млн ₽ в год ставка 15 % — пересчёт слегка занижает gross)"
  regions:
    moscow: Москва
    russia_remote: регионы РФ и удалённая работа

variables:
  # Часы на штатную единицу здесь не определяются: делитель стоимости часа штата —
  # paid_hours_per_month из ../model/teams.yaml (capacity_variables) — один источник для
  # себестоимости и мощности. Его разбивка (календарь, отпуск, болезнь) — в basis той переменной.
  # Коэффициента загрузки нет: непроизводственное время команд — накладные листья модели,
  # которые сами оцениваются часами × ставка роли (см. rates-ru.md, «Пересчёт в стоимость часа»).
  employer_contributions_rate:
    default: 0.302
    unit: доля к gross
    basis: >-
      Единый тариф страховых взносов 2026: 30 % в пределах единой предельной базы 2 979 000 ₽ за год
      (≈ 248 250 ₽ в месяц), 15,1 % сверх неё; плюс взносы на травматизм (НС и ПЗ) от 0,2 % (I класс
      профриска). Для штатной зарплаты в пределах базы — 30,2 %. Пониженный тариф МСП (30 % до 1,5 МРОТ
      = 40 639,50 ₽ в месяц, 15 % сверх) с 2026 действует только при основном ОКВЭД из перечня
      Правительства и доле дохода от него ≥ 70 % (425-ФЗ); применимость к DS проверяет бухгалтерия —
      до проверки калькулятор считает по общему тарифу.
    base_2026_rub: 2979000
    above_base_rate: 0.151
    nsipz_min: 0.002
    msp_priority_alternative:
      up_to_1_5_mrot_rate: 0.30
      above_1_5_mrot_rate: 0.15
      mrot_2026_rub: 27093
      threshold_month_rub: 40639.5
      condition: "реестр МСП + основной ОКВЭД в перечне (распоряжение Правительства № 4125-р от 27.12.2025) + доля дохода ≥ 70 %; ОКВЭД 85 «Образование» в перечне — по пересказу 1С:ИТС, не по тексту распоряжения"
    sources:
      - url: https://kontur.ru/articles/4261
        publisher: "Контур — тарифы взносов 2026, предельная база по ПП РФ № 1705 от 31.10.2025, условия МСП по 425-ФЗ"
        period: 2026
        accessed: 2026-10-05
      - url: https://kontur.ru/articles/4103
        publisher: "Контур — тарифы НС и ПЗ 0,2–8,5 %"
        period: 2026
        accessed: 2026-10-05
      - url: https://its.1c.ru/db/content/newscomm/src/497968.htm
        publisher: "1С:ИТС — перечень ОКВЭД для пониженного тарифа МСП (виден в выдаче поиска)"
        period: 2026
        accessed: 2026-10-05
  # Режим взносов — параметр калькулятора: какой применяется к юрлицу DS, подтверждает бухгалтерия
  # (код тарифа в расчёте по страховым взносам: «01» — общий, «32» — МСП-приоритетный).
  contributions_modes:
    default: general
    note: "бухгалтерия DS подтверждает режим; до подтверждения — general"
    general:
      label: "общий тариф"
      rate: 0.302
      formula: "gross × 0,302 в пределах базы 2 979 000 ₽ в год; сверх базы 15,1 %"
    msp_priority:
      label: "МСП-приоритетный (ОКВЭД 85 «Образование» / 59 «Производство кинофильмов, видеофильмов…»)"
      formula: "min(gross, 40 639,5) × 0,30 + max(gross − 40 639,5, 0) × 0,15 + gross × 0,002"
      effective_rate_by_gross:
        "80000": 0.228
        "120000": 0.203
        "150000": 0.193
        "200000": 0.182
      condition: "реестр МСП + основной ОКВЭД в перечне распоряжения Правительства № 4125-р от 27.12.2025 (классы 58, 59, 62, 63, 72, 85 есть; 73 «Реклама» и 86 «Здравоохранение» нет) + ≥ 70 % дохода от этого вида деятельности"
    sources:
      - url: https://www.nalog.gov.ru/rn28/news/activities_fts/16614940/
        publisher: "ФНС — с 2026 года: база 2 979 000; 30 / 15,1 %; МСП 15 % свыше 1,5 МРОТ = 40 639,5 ₽; условие 70 %; код тарифа 32"
        period: 2026-04-13
        accessed: 2026-10-12
      - url: https://pravo.ppt.ru/rasporyazheniye/323194
        publisher: "Распоряжение Правительства РФ № 4125-р от 27.12.2025, текст перечня ОКВЭД (85, 59 — в перечне; 73, 86 — нет)"
        period: 2025-12-27
        accessed: 2026-10-12
      - url: https://kontur.ru/articles/4261
        publisher: "Контур — предельная база 2026, перечень 4125-р, условия МСП, МРОТ 27 093"
        period: 2026-04-20
        accessed: 2026-10-12
    confidence:
      {
        level: high,
        why: "ставки — закон и ФНС; эффективная ставка МСП — собственный расчёт по формуле; применимость к DS — за бухгалтерией",
      }
  # Прочие расходы работодателя на штатного сотрудника в ₽ в месяц, не процентом: почти не зависят
  # от оклада. Отпуск и больничный сюда НЕ входят — они уже в делителе paid_hours_per_month
  # (../model/teams.yaml); добавить их ещё и здесь — двойной учёт.
  staff_other_costs_rub_month:
    unit: ₽ на одного штатного сотрудника в месяц, [min, typical, max]
    items:
      dms: { label: "ДМС", rub: [0, 3500, 7500] }
      workplace:
        {
          label: "рабочее место (компенсация удалёнки / доля коворкинга / фиксированное место)",
          rub: [2000, 12000, 49000],
        }
      equipment:
        { label: "техника, амортизация 36 мес.", rub: [3000, 5000, 10000] }
      software: { label: "ПО и подписки на место", rub: [1500, 4000, 10000] }
      training: { label: "обучение", rub: [0, 2000, 5000] }
      hiring_turnover:
        {
          label: "найм и онбординг с учётом текучести 20 %",
          rub: [1000, 3000, 8000],
        }
      hr_accounting:
        {
          label: "кадры, расчёт зарплаты, бухгалтерия на сотрудника (исключить, если уже в накладных листьях модели)",
          rub: [1500, 3000, 6000],
        }
      other: { label: "связь, мероприятия, мерч", rub: [0, 1000, 3000] }
    total_rub: [9000, 33500, 98500]
    share_of_gross_120k: [0.075, 0.279, 0.821]
    formula: "стоимость часа штата = (gross × (1 + взносы) + staff_other_costs_rub_month.total) ÷ paid_hours_per_month"
    sources:
      - url: https://www.kommersant.ru/doc/8295855
        publisher: "Коммерсантъ — ДМС Москва и МО ≈ 40–45 тыс. ₽ на сотрудника в год, средний сегмент 80–100 тыс."
        period: 2025
        accessed: 2026-10-12
      - url: https://www.kommersant.ru/doc/8438841
        publisher: "Коммерсантъ / Bright Rich | CORFAC — место в гибком офисе Москвы 49 тыс. ₽ в месяц"
        period: 2025
        accessed: 2026-10-12
      - url: https://officenavigator.ru/analytics/gibkie-ofisnye-prostranstva-moskvy-aprel-2025/
        publisher: "Officenavigator — место в коворкинге Москвы 48 тыс. ₽ (I кв. 2025)"
        period: 2025-04
        accessed: 2026-10-12
      - url: https://mperspektiva.ru/topics/core-xp-arenda-gibkikh-ofisov-v-moskve-podorozhala-v-poltora-raza-za-2025-god/
        publisher: "Московская перспектива / CORE.XP — гибкий офис 54 377 ₽ с НДС за место"
        period: 2025
        accessed: 2026-10-12
      - url: https://ppt.ru/news/144183
        publisher: "ppt.ru — компенсация удалёнки ≈ 3 000 ₽/мес (оценка периода законопроекта)"
        accessed: 2026-10-12
      - url: https://www.sostav.ru/blogs/282708/97438
        publisher: "Аспро.Финансы (Sostav) — полная стоимость ×1,4 к окладу, с ДМС и наймом ×1,45–1,55; найм 40–80 тыс. офисного специалиста, 120–250 тыс. редкого профиля"
        period: 2026-07-23
        accessed: 2026-10-12
      - url: https://accessfinancial.com/ru/glossarii/autsorsing-rascheta-zarabotnoi-platy/
        publisher: "accessfinancial.com — аутсорсинг расчёта зарплаты 15–50 € на сотрудника в месяц (европейский ориентир)"
        accessed: 2026-10-12
    confidence:
      {
        level: low,
        why: "ДМС и коворкинг — средняя (отраслевые обзоры); техника, ПО, обучение, кадры — собственные оценки по прайсам без российской статистики «на голову»; сверка: типичный денежный множитель 1 + 0,302 + 0,279 = 1,58 — у верха коридора Аспро ×1,45–1,55",
      }
  bonus_share:
    default: 0
    range: [0, 0.083]
    unit: "доля к годовому gross (0,083 = 13-я зарплата); облагается взносами"
    formula: "gross_для_часа = gross × (1 + bonus_share)"
    basis: "премия — политика компании, а не рыночная норма; по умолчанию 0. Верх — 13-я зарплата: + 8,3 % gross, со взносами ≈ + 10,8 %. Отпускные растут вместе с премией — учтено тем, что bonus_share умножает gross до взносов"
    sources:
      - url: https://www.sostav.ru/blogs/282708/97438
        publisher: "Аспро.Финансы (Sostav) — премии как часть полной стоимости сотрудника"
        period: 2026-07-23
        accessed: 2026-10-12
    confidence:
      {
        level: low,
        why: "ставка премии — политика DS, не рынок; верх — арифметика 13-й зарплаты",
      }
  # Грейды штатных зарплат: вилка вакансий роли по Москве уже охватывает грейды, поэтому грейды
  # нарезаются из неё, а не умножением медианы на межгрейдовые коэффициенты IT.
  grade_split:
    method: >-
      Из monthly_gross_rub.moscow = [min, median, max]: lo = (min + median) ÷ 2, hi = (median + max) ÷ 2,
      округление до 500 ₽. junior = [min, lo, median], middle = [lo, median, hi], senior = [median, hi, max].
      Полосы грейдов перекрываются, как на рынке; median роли = median middle.
    plausibility: >-
      Хабр Карьера (IT) даёт шаг грейда ×1,9–2,3 (middle ÷ junior) и ×1,67–1,72 (senior ÷ middle) — по
      всему стажу от стажёра до ведущего; вакансии ролей DS — специалисты с опытом, поэтому шаг уже
      (у ролей файла senior ÷ middle по медианам ×1,06–1,5). Коэффициенты IT — только верхняя граница
      правдоподобия, в значения не входят.
    sources:
      - url: https://career.habr.com/salaries
        publisher: "Хабр Карьера, калькулятор зарплат (все IT) — junior 88 тыс., middle 167 тыс., senior 285 тыс. ₽"
        n: "41 201 анкета"
        period: 2026
        accessed: 2026-10-12
      - url: https://habr.com/ru/articles/839252
        publisher: "Хабр Карьера, разработчики 1П 2024 — джуны 75 000, мидлы 174 233, сеньоры 300 000 ₽"
        period: 2024-H1
        accessed: 2026-10-12
      - url: https://habr.com/ru/companies/habr_career/articles/719730/
        publisher: "Хабр Карьера, разработчики 2П 2022 — 70 / 150 / 250 тыс. ₽"
        n: "5 792 зарплаты"
        period: 2022-H2
        accessed: 2026-10-12
    confidence:
      {
        level: low,
        why: "грейды выведены правилом из вилки вакансий роли, а не из вакансий с указанным грейдом; межгрейдовые отношения проверены только по IT",
      }
  default_team_grade_mix:
    junior: 0.2
    middle: 0.6
    senior: 0.2
    unit: доля штатных часов роли по грейдам; сумма = 1
    basis: >-
      Студия 10–20 человек с медицинским контентом держит костяк из опытных специалистов: middle
      ведут производство, senior — по одному на круг (ревью, стандарты, сложные единицы), junior —
      вспомогательная работа под контролем. В опросах и вакансиях IT middle + senior — 65–80 %,
      junior — 10–20 %. При 0,2 / 0,6 / 0,2 средняя по грейдам зарплата ≈ медиане роли
      (monthly_gross_rub.median), поэтому смесь по умолчанию не сдвигает текущую себестоимость.
    sources:
      - url: https://ruitunion.org/posts/2024-10-23-grades-and-salaries/
        publisher: "Профсоюз IT — middle и senior суммарно 79 % участников опроса (состав опроса, не штата)"
        period: 2024-H2
        accessed: 2026-10-12
      - url: https://apptractor.ru/info/analytics/zarplaty-mobilnyh-razrabotchikov-po-dannym-habr-karera.html
        publisher: "AppTractor по данным Хабр Карьеры — вакансии: junior 2,5 %, middle 45,2 %, senior 45,2 %, lead 7,1 % (структура спроса, не штата)"
        n: "6 870 вакансий"
        period: 2023-весна
        accessed: 2026-10-12
    confidence:
      {
        level: low,
        why: "распределения штата по грейдам в малых командах в открытых источниках нет; доли — суждение, сверенное с составом опросов и вакансий IT",
      }
  contractor_on_top_rate:
    unit: доля к цене подрядчика, которую компания платит сверх неё
    npd_self_employed: 0
    ip: 0
    gph_individual: 0.30
    gph_individual_with_nsipz: 0.302
    default_by_engagement:
      "подряд/самозанятый": 0
      "гонорар за единицу": 0
    basis: >-
      Самозанятый (НПД): компания не платит взносов, налог 6 % (4 % с физлиц) платит исполнитель из
      согласованной суммы; лимит дохода 2,4 млн ₽ в год; нельзя платить как самозанятому своему
      работнику или бывшему в течение 2 лет после увольнения. ИП: сверху 0. Договор ГПХ с физлицом:
      взносы 30 % / 15,1 % как по зарплате, НС и ПЗ — только если указаны в договоре; НДФЛ удерживается
      из суммы, а не начисляется сверху. Форма по умолчанию для пулов и пикового медиа — самозанятый
      (0); если исполнитель — физлицо по ГПХ, калькулятор берёт gph_individual.
    caveat: "С 01.10.2026 постановление Правительства РФ № 760 ограничивает самозанятого 60 ч в месяц на одного заказчика (шесть месяцев подряд) — только при работе через онлайн-платформы в перечне отраслей, включая образование; к прямым договорам DS не относится, при найме исполнителей через платформу — проверить текст постановления в КонсультантПлюс"
    sources:
      - url: https://www.consultant.ru/law/podborki/predelnyj_dohod_samozanyatogo/
        publisher: "КонсультантПлюс — лимит НПД 2,4 млн ₽ (422-ФЗ, ч. 2 ст. 4)"
        period: 2026
        accessed: 2026-10-05
      - url: https://npd.nalog.ru/
        publisher: "ФНС, «Налог на профессиональный доход» — ставки 4 % с доходов от физлиц, 6 % от юрлиц и ИП (422-ФЗ, ст. 10)"
        period: 2026
        accessed: 2026-10-05
      - url: https://pnz.ru/tax/novye-ogranicheniya-po-rabote-i-uvelichennyj-limit-chto-menyayut-dlya-samozanyatyh-v-2026-godu/
        publisher: "pnz.ru — запрет на бывшего работодателя 2 года, правило 60 ч (постановление Правительства РФ № 760, с 01.10.2026, платформенная занятость)"
        period: 2026-08
        accessed: 2026-10-05
      - url: https://kontur.ru/articles/4261
        publisher: "Контур — взносы начисляются на выплаты по договорам ГПХ"
        period: 2026
        accessed: 2026-10-05
  formulas:
    in_house_hourly_cost: "monthly_gross_rub.median × (1 + employer_contributions_rate) ÷ ../model/teams.yaml#capacity_variables.paid_hours_per_month"
    in_house_hourly_cost_full: "(monthly_gross × (1 + bonus_share) × (1 + взносы[contributions_modes]) + staff_other_costs_rub_month.total_rub[typical]) ÷ ../model/teams.yaml#capacity_variables.paid_hours_per_month; monthly_gross — monthly_gross_rub или monthly_gross_by_grade_rub[грейд]"
    contractor_hourly_cost: "hourly_rub × (1 + contractor_on_top_rate[форма договора])"
    contractor_hourly_cost_by_grade: "hourly_by_grade_rub[грейд] × (1 + contractor_on_top_rate[форма договора])"
    per_piece_cost: "per_piece.rub × (1 + contractor_on_top_rate[форма договора])"
    composite_rate: "средневзвешенная часовая стоимость ролей composite_of по долям их часов (из листьев модели или из состава команды в калькуляторе)"

roles:
  # ── Продуктовая команда: роли в команде, штат ──────────────────────────────────────────
  - role: Продуктовая команда
    composite_of:
      [
        Аккаунт,
        Продюсер,
        Методолог,
        Медредактор-сценарист,
        Менеджер мероприятий,
        Менеджер эксперта,
        Медиа-круг — медиа-ведущий,
