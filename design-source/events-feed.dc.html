<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/doctor-school-design-system-1366789c-9a05-4137-952e-61147c7a9550/_ds_bundle.css">
<link rel="stylesheet" href="_ds/doctor-school-design-system-1366789c-9a05-4137-952e-61147c7a9550/styles.css">
<script src="_ds/doctor-school-design-system-1366789c-9a05-4137-952e-61147c7a9550/_ds_bundle.js"></script>
<script src="events-feed-kit.js"></script>
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--color-background)}a:not([class]){color:var(--color-primary-action)}a:not([class]):hover{color:var(--color-primary-hover)}a[class],a[class]:hover{color:revert-layer}nav[aria-label="Лента событий"] li:has(>span[aria-current="page"]){display:none}</style>
</helmet>

<sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
<div style="background:var(--color-background);color:var(--color-foreground);min-height:100vh">
<dc-import name="ds-shell" host="{{ shellHost }}" logged-in="{{ signedIn }}" dark="{{ dark }}" mobile="{{ isNarrow }}" embedded="{{ true }}" on-theme="{{ toggleTheme }}" hint-size="100%,900px">

  <div data-screen-label="events-feed · шапка" style="background:var(--color-primary-surface);color:var(--color-primary-surface-foreground);padding:clamp(28px,4.4vw,56px) clamp(16px,3.4vw,48px) clamp(24px,3.4vw,40px)">
    <div style="max-width:var(--container-calendar);margin:0 auto;display:flex;flex-direction:column;gap:clamp(20px,2.4vw,28px)">
      <div style="display:flex;flex-direction:column;gap:12px">
        <h1 style="margin:0;font-size:clamp(34px,4.6vw,56px);line-height:1;font-weight:800;letter-spacing:-.035em">{{ pageTitle }}</h1>
        <p style="margin:0;font-size:var(--font-size-base);font-weight:600;color:var(--color-primary-surface-soft)">{{ pageSub }}</p>
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px">
        <x-import component-from-global-scope="DsDesignSystem.Tabs" value="{{ tense }}" on-value-change="{{ setTense }}" class-name="w-full layout:w-auto" hint-size="280px,48px">
          <x-import component-from-global-scope="DsDesignSystem.TabsList" class-name="w-full shadow-lg layout:w-auto" hint-size="280px,48px">
            <x-import component-from-global-scope="DsDesignSystem.TabsTrigger" value="past" hint-size="140px,44px">Прошедшие</x-import>
            <x-import component-from-global-scope="DsDesignSystem.TabsTrigger" value="upcoming" hint-size="140px,44px">Будущие</x-import>
          </x-import>
        </x-import>
        <sc-if value="{{ isWide }}" hint-placeholder-val="{{ true }}">
          <x-import component-from-global-scope="DsDesignSystem.Link" href="#" on-click="{{ switchView }}" tone="on-primary" variant="inline" class-name="font-bold" hint-size="180px,24px">{{ switchLabel }}</x-import>
        </sc-if>
      </div>
    </div>
  </div>

  <div style="max-width:var(--container-calendar);margin:0 auto;padding:clamp(24px,3.4vw,48px) clamp(16px,3.4vw,48px) clamp(56px,7vw,104px);display:flex;gap:40px;align-items:flex-start">

    <sc-if value="{{ isWide }}" hint-placeholder-val="{{ true }}">
      <aside data-screen-label="events-feed · боковая колонка" style="flex:none;width:300px;position:sticky;top:16px;display:flex;flex-direction:column;gap:28px">
        <sc-if value="{{ isFeed }}" hint-placeholder-val="{{ true }}">
          <div data-screen-label="events-feed · компактный месяц">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
              <span style="font-size:var(--font-size-sm);font-weight:800;letter-spacing:.12em;text-transform:uppercase">{{ monthLabel }}</span>
              <div style="display:flex;gap:8px">
                <x-import component-from-global-scope="DsDesignSystem.Button" variant="outline" size="sm" aria-label="Предыдущий месяц" on-click="{{ prevMonth }}" hint-size="36px,32px">‹</x-import>
                <x-import component-from-global-scope="DsDesignSystem.Button" variant="outline" size="sm" aria-label="Следующий месяц" on-click="{{ nextMonth }}" hint-size="36px,32px">›</x-import>
              </div>
            </div>
            <x-import component-from-global-scope="DsDesignSystem.MonthDotGrid" dc-props="{{ dot }}" hint-size="300px,340px"></x-import>
          </div>
        </sc-if>
        <x-import component-from-global-scope="DsDesignSystem.EventsFilter" dc-props="{{ filterSide }}" hint-size="300px,720px"></x-import>
      </aside>
    </sc-if>

    <main style="flex:1;min-width:0;display:flex;flex-direction:column">

      <sc-if value="{{ isNarrow }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px">
          <x-import component-from-global-scope="DsDesignSystem.Button" variant="outline" on-click="{{ openSheet }}" hint-size="140px,44px">{{ filterBtn }}</x-import>
          <x-import component-from-global-scope="DsDesignSystem.Link" href="#" on-click="{{ switchView }}" class-name="font-bold" hint-size="170px,24px">{{ switchLabel }}</x-import>
        </div>
        <x-import component-from-global-scope="DsDesignSystem.Sheet" open="{{ sheetOpen }}" on-open-change="{{ setSheet }}" hint-size="0px,0px">
          <x-import component-from-global-scope="DsDesignSystem.SheetContent" side="right" hint-size="0px,0px">
            <x-import component-from-global-scope="DsDesignSystem.SheetHeader" hint-size="100%,72px">
              <x-import component-from-global-scope="DsDesignSystem.SheetTitle" hint-size="120px,28px">Фильтры</x-import>
              <x-import component-from-global-scope="DsDesignSystem.SheetDescription" class-name="sr-only" hint-size="0px,0px">Фасеты ленты событий</x-import>
            </x-import>
            <x-import component-from-global-scope="DsDesignSystem.SheetBody" hint-size="100%,420px">
              <x-import component-from-global-scope="DsDesignSystem.EventsFilter" dc-props="{{ filterSheet }}" hint-size="100%,720px"></x-import>
            </x-import>
            <x-import component-from-global-scope="DsDesignSystem.SheetFooter" hint-size="100%,120px">
              <x-import component-from-global-scope="DsDesignSystem.Button" variant="outline" on-click="{{ resetFilters }}" hint-size="100%,44px">Сбросить</x-import>
              <x-import component-from-global-scope="DsDesignSystem.Button" on-click="{{ closeSheet }}" hint-size="100%,44px">{{ showN }}</x-import>
            </x-import>
          </x-import>
        </x-import>
      </sc-if>

      <sc-if value="{{ isFeed }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column">
          <sc-if value="{{ liveLoading }}" hint-placeholder-val="{{ false }}">
            <div style="margin-bottom:40px"><x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skLive }}" hint-size="100%,96px"></x-import></div>
          </sc-if>
          <sc-if value="{{ liveErrOn }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="events-feed · идёт сейчас · ошибка" style="margin-bottom:40px"><x-import component-from-global-scope="DsDesignSystem.EmptyState" dc-props="{{ liveErr }}" hint-size="100%,96px"></x-import></div>
          </sc-if>
          <sc-if value="{{ liveOn }}" hint-placeholder-val="{{ false }}">
            <section data-screen-label="events-feed · идёт сейчас" style="display:flex;flex-direction:column">
              <sc-for list="{{ liveStrips }}" as="ls" hint-placeholder-count="0">
                <x-import component-from-global-scope="DsDesignSystem.LiveEventStrip" dc-props="{{ ls.props }}" hint-size="100%,110px"></x-import>
              </sc-for>
              <sc-if value="{{ liveMoreOn }}" hint-placeholder-val="{{ false }}">
                <div style="margin:-12px 0 40px"><x-import component-from-global-scope="DsDesignSystem.Link" href="{{ liveMoreHref }}" class-name="font-bold" hint-size="160px,24px">{{ liveMore }}</x-import></div>
              </sc-if>
            </section>
          </sc-if>

          <sc-if value="{{ myLoading }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:48px">
              <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skTitle }}" hint-size="160px,16px"></x-import>
              <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skRow }}" hint-size="100%,72px"></x-import>
              <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skRow }}" hint-size="100%,72px"></x-import>
            </div>
          </sc-if>
          <sc-if value="{{ myErrOn }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="events-feed · мои события · ошибка" style="margin-bottom:48px"><x-import component-from-global-scope="DsDesignSystem.EmptyState" dc-props="{{ myErr }}" hint-size="100%,96px"></x-import></div>
          </sc-if>
          <sc-if value="{{ myOn }}" hint-placeholder-val="{{ false }}">
            <section data-screen-label="events-feed · мои события" style="margin:-26px 0 48px">
              <x-import component-from-global-scope="DsDesignSystem.DayAgenda" dc-props="{{ my }}" hint-size="100%,280px"></x-import>
              <div style="margin-top:16px"><x-import component-from-global-scope="DsDesignSystem.Link" href="account-my-events.dc.html" class-name="font-bold" hint-size="160px,24px">Все мои события →</x-import></div>
            </section>
          </sc-if>

          <sc-if value="{{ feedLoading }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="events-feed · загрузка" style="display:flex;flex-direction:column;gap:40px">
              <sc-for list="{{ skDays }}" as="sd" hint-placeholder-count="0">
                <div style="display:flex;flex-direction:column;gap:24px">
                  <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skPlate }}" hint-size="100%,20px"></x-import>
                  <sc-for list="{{ sd.cards }}" as="sc" hint-placeholder-count="0">
                    <div style="display:flex;flex-wrap:wrap;border:2px solid var(--color-hairline);background:var(--color-card)">
                      <div style="flex:1 0 196px;box-sizing:border-box;padding:28px 24px;display:flex;flex-direction:column;gap:12px;background:var(--color-section)">
                        <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skTime }}" hint-size="104px,36px"></x-import>
                        <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skSmall }}" hint-size="88px,12px"></x-import>
                      </div>
                      <div style="flex:999 1 300px;box-sizing:border-box;padding:28px;display:flex;flex-direction:column;gap:14px">
                        <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skL1 }}" hint-size="40%,12px"></x-import>
                        <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skL2 }}" hint-size="85%,22px"></x-import>
                        <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skL3 }}" hint-size="55%,22px"></x-import>
                        <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skL1 }}" hint-size="40%,12px"></x-import>
                      </div>
                    </div>
                  </sc-for>
                </div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ feedErrOn }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="events-feed · лента · ошибка"><x-import component-from-global-scope="DsDesignSystem.EmptyState" dc-props="{{ feedErr }}" hint-size="100%,96px"></x-import></div>
          </sc-if>
          <sc-if value="{{ feedEmptyOn }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="events-feed · пусто по фильтрам" style="border:2px dashed var(--color-border)"><x-import component-from-global-scope="DsDesignSystem.EmptyState" dc-props="{{ feedEmpty }}" hint-size="100%,220px"></x-import></div>
          </sc-if>
          <sc-if value="{{ feedOn }}" hint-placeholder-val="{{ false }}">
            <section data-screen-label="events-feed · лента" style="margin-top:-28px">
              <x-import component-from-global-scope="DsDesignSystem.EventList" dc-props="{{ feed }}" hint-size="100%,1200px"></x-import>
            </section>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{ isMonth }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column">
          <div data-screen-label="events-feed · месяц · навигация" data-month-nav="1" style="display:flex;align-items:stretch;gap:12px">
            <div style="flex:1;min-width:0;max-width:280px;display:flex">
              <x-import component-from-global-scope="DsDesignSystem.MonthPicker" key="{{ pickerKey }}" dc-props="{{ picker }}" class-name="w-full" hint-size="100%,44px"></x-import>
            </div>
            <x-import component-from-global-scope="DsDesignSystem.Button" variant="outline" aria-label="Предыдущий месяц" on-click="{{ prevMonth }}" hint-size="44px,44px">‹</x-import>
            <x-import component-from-global-scope="DsDesignSystem.Button" variant="outline" aria-label="Следующий месяц" on-click="{{ nextMonth }}" hint-size="44px,44px">›</x-import>
            <sc-if value="{{ isWide }}" hint-placeholder-val="{{ true }}">
              <x-import component-from-global-scope="DsDesignSystem.Button" variant="outline" on-click="{{ goToday }}" hint-size="110px,44px">Сегодня</x-import>
            </sc-if>
          </div>

          <sc-if value="{{ mLoading }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="events-feed · месяц · загрузка" style="margin-top:28px;border:2px solid var(--color-hairline);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:2px">
              <sc-for list="{{ skCells }}" as="c" hint-placeholder-count="0">
                <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skCell }}" hint-size="100%,60px"></x-import>
              </sc-for>
            </div>
            <sc-if value="{{ isNarrow }}" hint-placeholder-val="{{ false }}">
              <div style="margin-top:28px;display:flex;flex-direction:column;gap:12px">
                <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skTitleM }}" hint-size="200px,14px"></x-import>
                <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skRow }}" hint-size="100%,72px"></x-import>
                <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ skRow }}" hint-size="100%,72px"></x-import>
              </div>
            </sc-if>
          </sc-if>
          <sc-if value="{{ mErrOn }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="events-feed · месяц · ошибка" style="margin-top:28px"><x-import component-from-global-scope="DsDesignSystem.EmptyState" dc-props="{{ mErr }}" hint-size="100%,96px"></x-import></div>
          </sc-if>
          <sc-if value="{{ mEmptyOn }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="events-feed · месяц · пусто по фильтрам" style="margin-top:28px;border:2px dashed var(--color-border)"><x-import component-from-global-scope="DsDesignSystem.EmptyState" dc-props="{{ mEmpty }}" hint-size="100%,220px"></x-import></div>
          </sc-if>
          <sc-if value="{{ gridWide }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="events-feed · сетка месяца">
              <x-import component-from-global-scope="DsDesignSystem.MonthCalendarGrid" dc-props="{{ grid }}" hint-size="100%,760px"></x-import>
            </div>
          </sc-if>
          <sc-if value="{{ gridNarrow }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="events-feed · месяц точками">
              <x-import component-from-global-scope="DsDesignSystem.MonthDotGrid" dc-props="{{ mDot }}" hint-size="100%,340px"></x-import>
              <x-import component-from-global-scope="DsDesignSystem.DayAgenda" dc-props="{{ agenda }}" hint-size="100%,240px"></x-import>
            </div>
          </sc-if>
        </div>
      </sc-if>
    </main>
  </div>
</dc-import>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;лента&quot;,&quot;месяц&quot;],&quot;default&quot;:&quot;лента&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;host&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;витрина врача&quot;,&quot;Академия&quot;],&quot;default&quot;:&quot;витрина врача&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;signedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;tense&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Будущие&quot;,&quot;Прошедшие&quot;],&quot;default&quot;:&quot;Будущие&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;live&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;есть&quot;,&quot;нет&quot;],&quot;default&quot;:&quot;есть&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;обычное&quot;,&quot;загрузка&quot;,&quot;пусто&quot;,&quot;ошибка&quot;],&quot;default&quot;:&quot;обычное&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;viewerTz&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;МСК&quot;,&quot;GMT+5&quot;],&quot;default&quot;:&quot;МСК&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { ready: false };
  componentDidMount() {
    this.onResize = () => { this.setState({ wide: window.innerWidth >= 1024 }); this.measure(); };
    window.addEventListener('resize', this.onResize);
    this.onHash = () => {
      const m = location.hash.match(/^#month-(\d{4})-(\d{2})$/), fd = location.hash.match(/^#feed-day-(\d{4})-(\d{2})-(\d{2})$/);
      if (!m && !fd) return;
      history.replaceState(null, '', location.pathname + location.search);
      if (m) return this.setState({ ym: { y: +m[1], m: +m[2] - 1 }, mSel: null, selDay: null });
      this.jumpTo(+fd[1], +fd[2] - 1, +fd[3], true);
    };
    window.addEventListener('hashchange', this.onHash);
    this.boot();
  }
  P() {
    const p = this.props;
    const SM = { 'обычное': 'default', 'загрузка': 'loading', 'пусто': 'empty', 'ошибка': 'err' };
    return { view: p.view === 'месяц' ? 'month' : 'feed', host: p.host === 'Академия' ? 'academy' : 'doctor', signedIn: p.signedIn !== false,
      tense: p.tense === 'Прошедшие' ? 'past' : 'upcoming', live: p.live !== 'нет', state: SM[p.state] || 'default', tz: p.viewerTz === 'GMT+5' ? 5 : 3, dark: !!p.dark };
  }
  boot() {
    const K = window.EFK;
    if (!K || !window.DsDesignSystem) { this.t = setTimeout(() => this.boot(), 60); return; }
    const P = this.P(), init = K.initState({ state: P.state, host: P.host });
    this.setState(Object.assign(init, { ready: true, wide: window.innerWidth >= 1024, view: P.view, tense: P.tense, ym: K.monthOf(P.tense), dark: P.dark, sheetOpen: false, selDay: null, mSel: null }));
  }
  componentDidUpdate(pp) {
    if (['view', 'host', 'signedIn', 'tense', 'live', 'state', 'viewerTz', 'dark'].some(k => pp[k] !== this.props[k])) this.boot();
    document.documentElement.classList.toggle('dark', !!(this.state.ready && this.state.dark));
    this.measure();
  }
  measure() {
    const hd = document.querySelector('header[data-screen-label="ds-shell · шапка"]');
    const pos = hd ? getComputedStyle(hd).position : '';
    const v = hd && (pos === 'sticky' || pos === 'fixed') ? hd.offsetHeight : 0;
    if (v !== (this.state.stickyTop || 0)) this.setState({ stickyTop: v });
  }
  filterProps(host, applied, showHeader) {
    const K = window.EFK, O = K.options(host), a = applied, set = x => this.setState(x);
    const D = { query: '', specialtyScope: 'mine-and-adjacent', format: [], kind: [], city: [], nmoOnly: false, direction: [], project: [], expert: [], topic: [] };
    const combobox = { emptyLabel: 'Ничего не найдено', searchLabel: 'Найти', countLabel: (s, t) => 'Найдено ' + s + ' из ' + t, loadMoreLabel: 'Показать ещё', loadingMoreLabel: 'Загружаем…', loadMoreErrorLabel: 'Повторить' };
    const base = { host, showHeader, combobox, onReset: () => set({ applied: K.defaultApplied(), cityQ: '', cityPage: 1 }) };
    const head = { panel: 'Фильтры', title: 'Фильтры', appliedCount: n => 'Применено: ' + n, reset: 'Сбросить', removeFacet: 'Убрать', combobox };
    if (host === 'academy') return Object.assign(base, {
      applied: Object.assign(D, { project: a.format, expert: a.kind, topic: a.city }),
      options: { project: O.format, expert: O.kind, topic: O.city },
      labels: Object.assign(head, {
        project: { label: 'Проект', placeholder: 'Все проекты', addPlaceholder: 'Добавить проект', searchPlaceholder: 'Например, школа продюсеров' },
        expert: { label: 'Эксперт', placeholder: 'Все эксперты', addPlaceholder: 'Добавить эксперта', searchPlaceholder: 'Фамилия или имя' },
        topic: { label: 'Тема', placeholder: 'Все темы', addPlaceholder: 'Добавить тему', searchPlaceholder: 'Например, метрики' } }),
      onChange: n => set({ applied: Object.assign({}, a, { format: n.project, kind: n.expert, city: n.topic }) })
    });
    const per = 20, q = (this.state.cityQ || '').trim().toLowerCase(), cp = this.state.cityPage || 1;
    const pool = O.city.filter(o => a.city.indexOf(o.id) < 0 && (!q || o.label.toLowerCase().indexOf(q) >= 0));
    const cityOpts = O.city.filter(o => a.city.indexOf(o.id) >= 0).concat(pool.slice(0, per * cp));
    return Object.assign(base, {
      applied: Object.assign(D, { query: a.query, specialtyScope: a.specialtyScope, format: a.format, kind: a.kind, city: a.city, nmoOnly: a.nmoOnly }),
      options: { specialty: O.specialty, format: O.format, kind: O.kind, city: cityOpts },
      labels: Object.assign(head, {
        query: { label: 'Поиск по названию', placeholder: 'Например, PRP' },
        specialty: { label: 'Специальность', mine: 'Моя и смежные', all: 'Все специальности', placeholder: 'Выбрать специальность', addPlaceholder: 'Добавить специальность', searchPlaceholder: 'Например, кардиология' },
        format: 'Формат', kind: 'Вид события',
