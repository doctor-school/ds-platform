<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/doctor-school-design-system-1366789c-9a05-4137-952e-61147c7a9550/_ds_bundle.css">
<link rel="stylesheet" href="_ds/doctor-school-design-system-1366789c-9a05-4137-952e-61147c7a9550/styles.css">
<script src="_ds/doctor-school-design-system-1366789c-9a05-4137-952e-61147c7a9550/_ds_bundle.js"></script>
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--color-background)}a{color:var(--color-primary)}a:hover{color:var(--color-foreground)}/* ds-states:begin *//* generated by pnpm design:vendor from packages/design-system/src/styles/tokens.css; edits here are overwritten */[data-btn]{transition:all 150ms}[data-btn="primary"]:hover{background:var(--btn-hover,#0d3a77)!important;border-color:var(--btn-hover,#0d3a77)!important;box-shadow:2px 2px 0 var(--border,oklch(0.21 0.02 250))!important;transform:translate(2px,2px)}[data-btn="primary"]:active{box-shadow:none!important;transform:translate(4px,4px)}[data-btn="primary"]:focus-visible{box-shadow:4px 4px 0 var(--border,oklch(0.21 0.02 250)), 0 0 0 3px rgba(107, 177, 247, 0.5)!important}[data-btn="secondary"]:hover{background:var(--tint,#d3e8fd)!important;border-color:var(--primary,#2d84f2)!important;box-shadow:2px 2px 0 var(--elev,#aed4fb)!important;transform:translate(2px,2px)}[data-btn="secondary"]:active{box-shadow:none!important;transform:translate(4px,4px)}[data-btn="secondary"]:focus-visible{box-shadow:4px 4px 0 var(--elev,#aed4fb), 0 0 0 3px rgba(107, 177, 247, 0.5)!important}[data-btn]:disabled{opacity:.4;transform:none;box-shadow:none!important;pointer-events:none}[data-tab="false"]:hover{background:var(--tint,#d3e8fd)!important;color:var(--tint-fg,#114d9e)!important}[data-check]:hover{border-color:var(--primary,#2d84f2)!important}[data-link]:hover{text-decoration:underline!important}[data-link]:active{opacity:0.8!important}[data-ghost]:hover{background:var(--tint,#d3e8fd)!important;color:var(--tint-fg,#114d9e)!important}[data-ghost]:focus-visible{box-shadow:inset 0 0 0 3px rgba(107, 177, 247, 0.5)!important}/* ds-states:end */</style>
</helmet>

<sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
<div style="background:var(--color-background);color:var(--color-foreground);min-height:100vh;display:flex;flex-direction:column">

  <sc-if value="{{ isStorefront }}" hint-placeholder-val="{{ true }}">
  <dc-import name="ds-shell" host="{{ shellHost }}" logged-in="{{ false }}" dark="{{ dark }}" mobile="{{ isNarrow }}" embedded="{{ true }}" on-theme="{{ toggleTheme }}" hint-size="100%,720px">
    <main data-screen-label="{{ screenLabel }}" style="flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(56px,12vh,140px) var(--space-gutter, 16px)">
      <div style="width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-6)">
        <div style="display:flex;flex-direction:column;gap:var(--space-3)">
          <h1 style="margin:0;font-size:var(--font-size-3xl);font-weight:var(--font-weight-extrabold);line-height:1.15;letter-spacing:-0.01em;text-wrap:balance">{{ title }}</h1>
          <p style="margin:0;font-size:var(--font-size-lg);line-height:1.5;color:var(--color-muted-foreground);text-wrap:pretty">{{ description }}</p>
        </div>
        <div style="{{ actionsStyle }}">
          <x-import component-from-global-scope="DsDesignSystem.Button" size="lg" loading="{{ retrying }}" disabled="{{ btnDisabled }}" on-click="{{ retry }}" style="{{ btnStyle }}" hint-size="260px,48px">{{ btnLabel }}</x-import>
          <x-import component-from-global-scope="DsDesignSystem.Link" href="#" on-click="{{ noop }}" hint-size="160px,24px">{{ wayOut }}</x-import>
        </div>
      </div>
    </main>
  </dc-import>
  </sc-if>

  <sc-if value="{{ isSignInSite }}" hint-placeholder-val="{{ false }}">
    <header data-screen-label="sign-in-refusal · сайт входа · шапка" style="border-bottom:2px solid var(--color-border);padding:16px clamp(16px,4vw,48px)">
      <img src="{{ logoSrc }}" alt="Doctor.School" style="height:24px;display:block">
    </header>
    <main data-screen-label="{{ screenLabel }}" style="flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(56px,12vh,140px) 16px">
      <div style="width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-6)">
        <div style="display:flex;flex-direction:column;gap:var(--space-3)">
          <h1 style="margin:0;font-size:var(--font-size-3xl);font-weight:var(--font-weight-extrabold);line-height:1.15;letter-spacing:-0.01em;text-wrap:balance">{{ title }}</h1>
          <p style="margin:0;font-size:var(--font-size-lg);line-height:1.5;color:var(--color-muted-foreground);text-wrap:pretty">{{ description }}</p>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:var(--space-4);width:100%">
          <x-import component-from-global-scope="DsDesignSystem.Button" size="lg" loading="{{ retrying }}" disabled="{{ btnDisabled }}" on-click="{{ retry }}" style="{{ btnStyle }}" hint-size="260px,48px">{{ btnLabel }}</x-import>
          <p style="margin:0;font-size:var(--font-size-base);line-height:1.5;color:var(--color-foreground)">Или перейдите на <x-import component-from-global-scope="DsDesignSystem.Link" variant="inline" href="#" on-click="{{ noop }}" hint-size="110px,20px">сайт Академии</x-import> или на <x-import component-from-global-scope="DsDesignSystem.Link" variant="inline" href="#" on-click="{{ noop }}" hint-size="110px,20px">витрину врача</x-import></p>
        </div>
      </div>
    </main>
  </sc-if>

</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;host&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Академия&quot;,&quot;витрина врача&quot;,&quot;сайт входа&quot;],&quot;default&quot;:&quot;Академия&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;лимит&quot;,&quot;сбой&quot;],&quot;default&quot;:&quot;лимит&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;countdown&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;идёт&quot;,&quot;закончился&quot;],&quot;default&quot;:&quot;идёт&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;под «лимит»&quot;},&quot;origin&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;эфир&quot;,&quot;другое&quot;],&quot;default&quot;:&quot;эфир&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;на витрине&quot;},&quot;texts&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;1&quot;,&quot;2&quot;,&quot;3&quot;],&quot;default&quot;:&quot;1&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;тексты (чередуются случайно, решение владельца 2026-10-29)&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { ready: false, retrying: false, left: 105 };
  componentDidMount() {
    this.onResize = () => this.setState({ wide: window.innerWidth >= 1024 });
    window.addEventListener('resize', this.onResize);
    this.boot();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    clearTimeout(this.t); clearTimeout(this.r); clearInterval(this.tick);
  }
  boot() {
    if (!window.DsDesignSystem) { this.t = setTimeout(() => this.boot(), 60); return; }
    this.setState({ ready: true, wide: window.innerWidth >= 1024, dark: !!this.props.dark });
    this.resetCountdown();
  }
  resetCountdown() {
    clearInterval(this.tick);
    const running = this.props.state !== 'сбой' && this.props.countdown !== 'закончился';
    this.setState({ left: running ? 105 : 0 });
    if (running) this.tick = setInterval(() => {
      this.setState(s => {
        const left = Math.max(0, s.left - 1);
        if (!left) clearInterval(this.tick);
        return { left };
      });
    }, 1000);
  }
  componentDidUpdate(pp) {
    if (pp.dark !== this.props.dark) this.setState({ dark: !!this.props.dark });
    if (pp.state !== this.props.state || pp.countdown !== this.props.countdown) this.resetCountdown();
    document.documentElement.classList.toggle('dark', !!(this.state.ready && this.state.dark));
  }
  renderVals() {
    const s = this.state, p = this.props;
    if (!s.ready) return { ready: false };
    const set = x => this.setState(x);
    // Тексты владельца 2026-10-29: заголовок и текст одного варианта всегда вместе.
    const TEXTS = {
      'лимит': [
        ['Пульс зашкаливает', 'Слишком много попыток входа подряд. Дайте системе пару минут отдышаться — и попробуйте снова.'],
        ['Даже самым настойчивым нужен перерыв', 'Попыток входа было многовато. Пара минут отдыха — и дверь снова откроется.'],
        ['Стоп, давайте без тахикардии', 'Слишком много попыток за короткое время. Подождите несколько минут — потом вход заработает.']
      ],
      'сбой': [
        ['Сервер на консилиуме', 'Вход ненадолго недоступен: мы уже собрали консилиум и лечим. Попробуйте ещё раз чуть позже.'],
        ['Сервер ушёл на обход', 'Скоро вернётся и всех примет. Попробуйте войти ещё раз через несколько минут.'],
        ['У сервера плановая процедура', 'Мы уже рядом и следим за показателями. Попробуйте ещё раз чуть позже.']
      ]
    };
    const st = p.state === 'сбой' ? 'сбой' : 'лимит';
    const idx = Math.max(0, ['1', '2', '3'].indexOf(String(p.texts || '1')));
    const [title, description] = TEXTS[st][idx];
    const host = p.host === 'витрина врача' ? 'doctor' : p.host === 'сайт входа' ? 'signin' : 'academy';
    const waiting = st === 'лимит' && s.left > 0;
    const mm = Math.floor(s.left / 60), ss = String(s.left % 60).padStart(2, '0');
    const narrow = !s.wide;
    const retry = () => {
      if (waiting || s.retrying) return;
      set({ retrying: true });
      this.r = setTimeout(() => set({ retrying: false }), 1400);
    };
    return {
      ready: true,
      isNarrow: narrow,
      isStorefront: host !== 'signin',
      isSignInSite: host === 'signin',
      shellHost: host === 'doctor' ? 'doctor' : 'academy',
      screenLabel: 'sign-in-refusal · ' + (p.host || 'Академия') + ' · ' + st + (st === 'лимит' ? ' · ' + (waiting ? 'отсчёт' : 'можно') : '') + ' · тексты ' + (idx + 1),
      dark: !!s.dark,
      toggleTheme: () => set({ dark: !s.dark }),
      logoSrc: s.dark ? 'assets/ds-logo-white.svg' : 'assets/ds-logo-color.svg',
      title, description,
      retrying: s.retrying,
      btnDisabled: waiting,
      btnLabel: waiting ? 'Можно повторить через ' + mm + ':' + ss : 'Попробовать ещё раз',
      btnStyle: narrow ? { width: '100%', fontVariantNumeric: 'tabular-nums' } : { minWidth: 280, fontVariantNumeric: 'tabular-nums' },
      actionsStyle: narrow
        ? { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 'var(--space-4)', width: '100%' }
        : { display: 'flex', flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: 'var(--space-6)', flexWrap: 'wrap' },
      wayOut: p.origin === 'другое' ? 'На главную' : 'Вернуться к эфиру',
      retry,
      noop: e => e && e.preventDefault && e.preventDefault()
    };
  }
}
</script>
</body>
</html>
