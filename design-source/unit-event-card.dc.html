<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/doctor-school-design-system-1366789c-9a05-4137-952e-61147c7a9550/_ds_bundle.css">
<link rel="stylesheet" href="_ds/doctor-school-design-system-1366789c-9a05-4137-952e-61147c7a9550/styles.css">
<script src="_ds/doctor-school-design-system-1366789c-9a05-4137-952e-61147c7a9550/_ds_bundle.js"></script>
</helmet>
<div class="{{ themeClass }}" data-screen-label="unit-event-card" style="display:block;width:100%;min-width:0">
  <x-import component-from-global-scope="DsDesignSystem.WebinarCard" dc-props="{{ card }}" hint-size="100%,220px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:300},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;scheduled&quot;,&quot;live&quot;,&quot;registered&quot;,&quot;past&quot;],&quot;default&quot;:&quot;scheduled&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Эфир № 042&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;19:00&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tz&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;МСК&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;timeSub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;16 июля · ср&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;school&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Школа травматологии и ортопедии&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Пластика ахиллова сухожилия: разбор клинических случаев&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Участвовать ↗&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;recording&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Запись · 90 мин&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const variant = p.variant || 'scheduled';
    const live = variant === 'live', past = variant === 'past', registered = variant === 'registered';
    const navigable = p.showCta !== false;
    const href = p.href || (past ? 'event-page-recording.dc.html' : 'event-page.dc.html');
    const speakers = (Array.isArray(p.speakers) ? p.speakers : p.speakers ? [p.speakers] : [
      { name: 'Андрей Королёв', org: 'травматолог-ортопед, к.м.н.' },
      { name: 'Мария Белова', org: 'врач ЛФК и спортивной медицины' }
    ]).map(s => ({ name: s.name, org: s.org }));

    const ctaByVariant = {
      live: [p.cta || 'Войти в эфир ↗', p.ctaHref || 'room.dc.html'],
      scheduled: [p.cta || 'Участвовать ↗', p.ctaHref || href],
      registered: ['Отменить', p.ctaHref || '#'],
      past: ['Смотреть запись ↗', p.ctaHref || 'event-page-recording.dc.html']
    };
    const [ctaLabel, ctaHref] = ctaByVariant[variant] || ctaByVariant.scheduled;

    const card = {
      variant: past ? 'past' : 'upcoming',
      href, navigable,
      time: p.time || '19:00',
      tzLabel: p.tz || 'МСК',
      dateLabel: p.timeSub || '16 июля · ср',
      kindLabel: p.num || 'Эфир № 042',
      school: p.school || 'Школа травматологии и ортопедии',
      title: p.title || 'Пластика ахиллова сухожилия: разбор клинических случаев',
      specialties: Array.isArray(p.chips) ? p.chips : [],
      speakers,
      ctaLabel, ctaHref
    };
    if (live) { card.live = true; card.liveLabel = 'В эфире'; }
    if (registered) { card.registered = true; card.registeredLabel = 'В календаре'; }
    if (past) card.recordingLabel = p.recording || 'Запись · 90 мин';

    return { card, themeClass: p.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
