<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/doctor-school-design-system-1366789c-9a05-4137-952e-61147c7a9550/_ds_bundle.css">
<link rel="stylesheet" href="_ds/doctor-school-design-system-1366789c-9a05-4137-952e-61147c7a9550/styles.css">
<script src="_ds/doctor-school-design-system-1366789c-9a05-4137-952e-61147c7a9550/_ds_bundle.js"></script>
<style>a{color:var(--color-primary)}a:hover{color:var(--color-foreground)}/* ds-states:begin *//* generated by pnpm design:vendor from packages/design-system/src/styles/tokens.css; edits here are overwritten */[data-btn]{transition:all 150ms}[data-btn="primary"]:hover{background:var(--btn-hover,#0d3a77)!important;border-color:var(--btn-hover,#0d3a77)!important;box-shadow:2px 2px 0 var(--border,oklch(0.21 0.02 250))!important;transform:translate(2px,2px)}[data-btn="primary"]:active{box-shadow:none!important;transform:translate(4px,4px)}[data-btn="primary"]:focus-visible{box-shadow:4px 4px 0 var(--border,oklch(0.21 0.02 250)), 0 0 0 3px rgba(107, 177, 247, 0.5)!important}[data-btn="secondary"]:hover{background:var(--tint,#d3e8fd)!important;border-color:var(--primary,#2d84f2)!important;box-shadow:2px 2px 0 var(--elev,#aed4fb)!important;transform:translate(2px,2px)}[data-btn="secondary"]:active{box-shadow:none!important;transform:translate(4px,4px)}[data-btn="secondary"]:focus-visible{box-shadow:4px 4px 0 var(--elev,#aed4fb), 0 0 0 3px rgba(107, 177, 247, 0.5)!important}[data-btn]:disabled{opacity:.4;transform:none;box-shadow:none!important;pointer-events:none}[data-tab="false"]:hover{background:var(--tint,#d3e8fd)!important;color:var(--tint-fg,#114d9e)!important}[data-check]:hover{border-color:var(--primary,#2d84f2)!important}[data-link]:hover{text-decoration:underline!important}[data-link]:active{opacity:0.8!important}[data-ghost]:hover{background:var(--tint,#d3e8fd)!important;color:var(--tint-fg,#114d9e)!important}[data-ghost]:focus-visible{box-shadow:inset 0 0 0 3px rgba(107, 177, 247, 0.5)!important}/* ds-states:end */</style>
</helmet>
<div class="{{ themeClass }}" data-screen-label="unit-feed-card" style="display:block;width:100%;min-width:0;font-family:var(--font-sans)">

  <sc-if value="{{ isSkeleton }}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true">
      <x-import component-from-global-scope="DsDesignSystem.Card" dc-props="{{ cardProps }}" hint-size="100%,430px">
        <div style="aspect-ratio:16/9;border-bottom:var(--border-width-2) solid var(--color-border)">
          <x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ fill }}" hint-size="100%,100%"></x-import>
        </div>
        <div style="height:264px;box-sizing:border-box;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)">
          <div style="display:flex;align-items:center;gap:var(--space-2)">
            <div style="width:40px;height:40px;flex:none"><x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ fill }}" hint-size="100%,100%"></x-import></div>
            <div style="width:55%;height:14px"><x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ fill }}" hint-size="100%,100%"></x-import></div>
          </div>
          <div style="width:38%;height:22px"><x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ fill }}" hint-size="100%,100%"></x-import></div>
          <div style="height:18px"><x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ fill }}" hint-size="100%,100%"></x-import></div>
          <div style="height:18px;width:82%"><x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ fill }}" hint-size="100%,100%"></x-import></div>
          <div style="height:18px;width:58%"><x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ fill }}" hint-size="100%,100%"></x-import></div>
          <div style="margin-top:auto;height:14px;width:30%"><x-import component-from-global-scope="DsDesignSystem.Skeleton" dc-props="{{ fill }}" hint-size="100%,100%"></x-import></div>
        </div>
      </x-import>
    </div>
  </sc-if>

  <sc-if value="{{ isCard }}" hint-placeholder-val="{{ true }}">
    <a href="{{ href }}" target="{{ target }}" rel="{{ rel }}" style="position:relative;display:block;color:inherit;text-decoration:none;transition:transform 120ms ease-out" style-hover="transform:translate(-2px,-2px);color:inherit" style-focus="outline:3px solid var(--color-primary);outline-offset:3px">
      <x-import component-from-global-scope="DsDesignSystem.Card" dc-props="{{ cardProps }}" hint-size="100%,430px">

        <div style="position:relative;aspect-ratio:16/9;border-bottom:var(--border-width-2) solid var(--color-border);background:var(--color-section);overflow:hidden">
          <sc-if value="{{ hasImg }}" hint-placeholder-val="{{ false }}">
            <img src="{{ image }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block">
          </sc-if>
          <sc-if value="{{ coverPh }}" hint-placeholder-val="{{ true }}">
            <div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 11px,var(--color-hairline) 11px 13px)"></div>
            <span style="position:absolute;left:var(--space-3);top:var(--space-3);font-size:11px;font-weight:var(--font-weight-bold);letter-spacing:.1em;text-transform:uppercase;color:var(--color-muted-foreground);background:var(--color-card);padding:2px 6px">{{ phLabel }}</span>
          </sc-if>
          <sc-if value="{{ noMedia }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;inset:0;display:flex;align-items:flex-end;padding:var(--space-4)">
              <span style="font-size:var(--font-size-3xl);font-weight:var(--font-weight-extrabold);letter-spacing:-.03em;line-height:1;color:var(--color-primary);text-wrap:balance">{{ fieldMark }}</span>
            </div>
          </sc-if>
          <sc-if value="{{ isVideo }}" hint-placeholder-val="{{ false }}">
            <span aria-hidden="true" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--color-foreground);color:var(--color-background);font-size:18px;box-shadow:var(--shadow-btn)">▶</span>
            <span style="position:absolute;right:var(--space-2);bottom:var(--space-2);font-size:12px;font-weight:var(--font-weight-bold);font-variant-numeric:tabular-nums;color:var(--color-background);background:var(--color-foreground);padding:2px 6px">{{ duration }}</span>
          </sc-if>
        </div>

        <div style="height:264px;box-sizing:border-box;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);overflow:hidden">
          <div style="display:flex;align-items:center;gap:var(--space-2);min-width:0">
            <sc-if value="{{ logoAvatar }}" hint-placeholder-val="{{ true }}">
              <x-import component-from-global-scope="DsDesignSystem.Avatar" variant="tint" hint-size="40px,40px"><img src="assets/ds-logo-icon.svg" alt="" style="width:60%;height:60%;object-fit:contain"></x-import>
            </sc-if>
            <sc-if value="{{ initialsAvatar }}" hint-placeholder-val="{{ false }}">
              <x-import component-from-global-scope="DsDesignSystem.Avatar" variant="tint" hint-size="40px,40px">{{ initials }}</x-import>
            </sc-if>
            <span style="flex:1;min-width:0;font-size:var(--font-size-sm);font-weight:var(--font-weight-semibold);color:var(--color-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ sourceName }}</span>
            <sc-if value="{{ hasNet }}" hint-placeholder-val="{{ false }}">
              <span title="{{ netName }}" aria-label="{{ netName }}" style="flex:none;font-size:11px;font-weight:var(--font-weight-extrabold);letter-spacing:.04em;color:var(--color-foreground);border:var(--border-width-2) solid var(--color-border);padding:1px 5px;line-height:16px">{{ netChip }}</span>
            </sc-if>
          </div>

          <sc-if value="{{ hasType }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex"><x-import component-from-global-scope="DsDesignSystem.Badge" variant="label" hint-size="auto,22px">{{ typeMark }}</x-import></div>
          </sc-if>

          <sc-if value="{{ isTitle }}" hint-placeholder-val="{{ true }}">
            <div style="font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);line-height:23px;letter-spacing:-.01em;color:var(--color-foreground);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:{{ lines }};text-wrap:pretty">{{ textOut }}</div>
          </sc-if>
          <sc-if value="{{ isPost }}" hint-placeholder-val="{{ false }}">
            <div style="font-size:var(--font-size-base);font-weight:400;line-height:24px;color:var(--color-foreground);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:{{ lines }};text-wrap:pretty">{{ textOut }}</div>
          </sc-if>

          <div style="margin-top:auto;display:flex;flex-direction:column;gap:var(--space-2)">
            <sc-if value="{{ hasPartner }}" hint-placeholder-val="{{ false }}">
              <div style="font-size:12px;line-height:17px;font-weight:var(--font-weight-semibold);color:var(--color-muted-foreground);border-top:1px solid var(--color-hairline);padding-top:var(--space-2)">{{ partnerText }}</div>
            </sc-if>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);font-size:var(--font-size-sm);line-height:20px;font-weight:var(--font-weight-semibold);color:var(--color-muted-foreground)">
              <span>{{ date }}</span>
              <sc-if value="{{ external }}" hint-placeholder-val="{{ false }}">
                <span style="position:relative;font-weight:var(--font-weight-bold);color:var(--color-foreground)"><span aria-hidden="true">{{ netName }} ↗</span><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">, откроется в новой вкладке на площадке {{ netName }}</span></span>
              </sc-if>
            </div>
          </div>
        </div>

      </x-import>
    </a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:460},&quot;source&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;академия&quot;,&quot;колонка&quot;,&quot;telegram&quot;,&quot;vk&quot;,&quot;rutube&quot;,&quot;vk-видео&quot;,&quot;дзен&quot;],&quot;default&quot;:&quot;академия&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Материал&quot;},&quot;media&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;картинка&quot;,&quot;видео&quot;,&quot;нет&quot;],&quot;default&quot;:&quot;картинка&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Материал&quot;},&quot;partnerMark&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;нет&quot;,&quot;есть&quot;],&quot;default&quot;:&quot;нет&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Материал&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Тема&quot;},&quot;skeleton&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Состояние&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;author&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Страхов М. А.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;19 августа&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;duration&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1:12&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;partnerName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Партнёр А&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const src = p.source || 'академия';
    const media = p.media || 'картинка';
    const partner = p.partnerMark === 'есть' || p.partnerMark === true;
    const SRC = {
      'академия': { name: 'Академия', type: 'Новость', own: true, logo: true },
      'колонка': { name: p.author || 'Страхов М. А.', type: 'Колонка эксперта', own: true },
      'telegram': { name: 'BBM Academy · Telegram', net: 'Telegram', chip: 'TG', post: true, logo: true, url: 'https://t.me/' },
      'vk': { name: 'BBM Academy · VK', net: 'VK', chip: 'VK', post: true, logo: true, url: 'https://vk.com/' },
      'rutube': { name: 'BBM Academy · RuTube', net: 'RuTube', chip: 'RT', logo: true, url: 'https://rutube.ru/' },
      'vk-видео': { name: 'BBM Academy · VK Видео', net: 'VK Видео', chip: 'VK▶', logo: true, url: 'https://vkvideo.ru/' },
      'дзен': { name: 'BBM Academy · Дзен', net: 'Дзен', chip: 'Дз', logo: true, url: 'https://dzen.ru/' }
    };
    const s = SRC[src] || SRC['академия'];
    const SAMPLE = {
      'академия': 'Открыт набор центров в исследование эффективности PRP',
      'колонка': 'Ортобиология в России: чего не хватает практике',
      'telegram': 'Сегодня в 19:00 МСК — эфир о показаниях к PRP. Михаил Страхов разберёт три клинических случая и ответит на вопросы коллег. Регистрация — по ссылке в профиле канала, запись появится на сайте Академии через пару дней.',
      'vk': 'Записали первый выпуск второго сезона подкаста «Кто стоит за брендом». Спасибо гостям и команде производства — премьера в ноябре, а пока делимся кадрами со съёмочной площадки.',
      'rutube': 'PRP при гонартрозе — фрагмент эфира',
      'vk-видео': 'Как устроен проект «Ортобиология» — за минуту',
      'дзен': 'Как устроено бесплатное медицинское образование: модель Doctor.School'
    };
    const isPost = !!s.post;
    const hasType = !!s.own;
    const isVideo = media === 'видео';
    const noMedia = media === 'нет';
    const hasImg = !noMedia && !!p.image;
    const textOut = (isPost ? (p.text || p.title) : (p.title || p.text)) || SAMPLE[src];

    // body 264 − padding 32 − source row 40 − gaps 24 − date 20 = 148
    let avail = 148 - (hasType ? 36 : 0) - (partner ? 34 : 0);
    const lines = Math.max(2, Math.floor(avail / (isPost ? 24 : 23)));

    const initials = (s.name || '').replace(/\./g, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    const external = !s.own;

    return {
      themeClass: p.dark ? 'dark' : '',
      isSkeleton: !!p.skeleton, isCard: !p.skeleton,
      cardProps: { style: { padding: 0, gap: 0, overflow: 'hidden', display: 'block' } },
      fill: { style: { width: '100%', height: '100%', borderRadius: 0 } },
      href: p.href || (s.own ? 'academy-material.dc.html' : s.url),
      target: external ? '_blank' : undefined,
      rel: external ? 'noopener noreferrer' : undefined,
      hasImg, image: p.image || '',
      coverPh: !noMedia && !hasImg,
      phLabel: isVideo ? 'Превью видео' : 'Обложка',
      noMedia, isVideo,
      fieldMark: s.own ? s.type : s.net,
      duration: p.duration || '1:12',
      logoAvatar: !!s.logo, initialsAvatar: !s.logo, initials,
      sourceName: s.name,
      hasNet: !!s.net, netName: s.net || '', netChip: s.chip || '',
      hasType, typeMark: s.type || '',
      isTitle: !isPost, isPost, textOut, lines,
      hasPartner: partner, partnerText: 'Партнёрский материал · ' + (p.partnerName || 'Партнёр А'),
      date: p.date || '19 августа',
      external
    };
  }
}
</script>
</body>
</html>
