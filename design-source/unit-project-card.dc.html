<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/doctor-school-design-system-1366789c-9a05-4137-952e-61147c7a9550/_ds_bundle.css">
<link rel="stylesheet" href="_ds/doctor-school-design-system-1366789c-9a05-4137-952e-61147c7a9550/styles.css">
<style>/* ds-states:begin *//* generated by pnpm design:vendor from packages/design-system/src/styles/tokens.css; edits here are overwritten */[data-btn]{transition:all 150ms}[data-btn="primary"]:hover{background:var(--btn-hover,#0d3a77)!important;border-color:var(--btn-hover,#0d3a77)!important;box-shadow:2px 2px 0 var(--border,oklch(0.21 0.02 250))!important;transform:translate(2px,2px)}[data-btn="primary"]:active{box-shadow:none!important;transform:translate(4px,4px)}[data-btn="primary"]:focus-visible{box-shadow:4px 4px 0 var(--border,oklch(0.21 0.02 250)), 0 0 0 3px rgba(107, 177, 247, 0.5)!important}[data-btn="secondary"]:hover{background:var(--tint,#d3e8fd)!important;border-color:var(--primary,#2d84f2)!important;box-shadow:2px 2px 0 var(--elev,#aed4fb)!important;transform:translate(2px,2px)}[data-btn="secondary"]:active{box-shadow:none!important;transform:translate(4px,4px)}[data-btn="secondary"]:focus-visible{box-shadow:4px 4px 0 var(--elev,#aed4fb), 0 0 0 3px rgba(107, 177, 247, 0.5)!important}[data-btn]:disabled{opacity:.4;transform:none;box-shadow:none!important;pointer-events:none}[data-tab="false"]:hover{background:var(--tint,#d3e8fd)!important;color:var(--tint-fg,#114d9e)!important}[data-check]:hover{border-color:var(--primary,#2d84f2)!important}[data-link]:hover{text-decoration:underline!important}[data-link]:active{opacity:0.8!important}[data-ghost]:hover{background:var(--tint,#d3e8fd)!important;color:var(--tint-fg,#114d9e)!important}[data-ghost]:focus-visible{box-shadow:inset 0 0 0 3px rgba(107, 177, 247, 0.5)!important}/* ds-states:end */</style></helmet>
<div class="{{ themeClass }}" data-screen-label="unit-project-card" style="display:block;width:100%;height:100%;min-width:0;font-family:var(--font-sans)">
<a href="{{ href }}" style="display:flex;flex-direction:column;background:var(--color-card);border:var(--border-width-2) solid var(--color-border);box-shadow:var(--shadow-lg);text-decoration:none;height:100%;box-sizing:border-box;transition:box-shadow var(--duration-fast),transform var(--duration-fast)" style-hover="transform:translate(var(--space-0-5),var(--space-0-5));box-shadow:var(--shadow-md)" style-focus="box-shadow:var(--shadow-focus)">
  <div style="aspect-ratio:16/9;background:var(--color-tint);display:flex;align-items:center;justify-content:center;border-bottom:var(--border-width-2) solid var(--color-border);position:relative;overflow:hidden;flex:none">
    <span style="font-size:var(--font-size-4xl);font-weight:var(--font-weight-extrabold);letter-spacing:var(--font-letter-spacing-display);color:var(--color-primary-action)">{{ emblem }}</span>
    <span style="position:absolute;bottom:var(--space-2);right:var(--space-2-5);font-size:var(--font-size-2xs);font-weight:var(--font-weight-extrabold);letter-spacing:var(--font-letter-spacing-eyebrow);text-transform:uppercase;color:var(--color-tint-foreground);opacity:var(--opacity-50)">обложка</span>
  </div>
  <div style="padding:var(--space-4) var(--space-5) var(--space-5);display:flex;flex-direction:column;gap:var(--space-2);flex:1;min-width:0">
    <div style="display:flex;align-items:center;gap:var(--space-2-5);flex-wrap:wrap">
      <div style="font-size:var(--font-size-eyebrow);font-weight:var(--font-weight-extrabold);letter-spacing:var(--font-letter-spacing-micro);text-transform:uppercase;color:var(--color-primary-action)">{{ kind }}</div>
      <sc-if value="{{ hasStage }}" hint-placeholder-val="{{ false }}"><span style="font-size:var(--font-size-2xs);font-weight:var(--font-weight-extrabold);letter-spacing:var(--font-letter-spacing-micro);text-transform:uppercase;color:var(--color-tint-foreground);background:var(--color-tint);padding:var(--space-1) var(--space-2);white-space:nowrap">{{ stage }}</span></sc-if>
    </div>
    <div lang="ru" style="font-size:var(--font-size-lg);font-weight:var(--font-weight-extrabold);letter-spacing:var(--font-letter-spacing-heading);color:var(--color-foreground);line-height:var(--font-line-height-tight);overflow-wrap:break-word;hyphens:auto;text-wrap:balance">{{ title }}</div>
    <div style="font-size:var(--font-size-chip);line-height:var(--font-line-height-prose);color:var(--color-muted-foreground);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">{{ description }}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-top:auto;padding-top:var(--space-3);flex-wrap:wrap">
      <span style="font-size:var(--font-size-caption);font-weight:var(--font-weight-bold);color:var(--color-primary-action);text-decoration:underline;text-underline-offset:var(--space-1);white-space:nowrap">{{ count }}</span>
      <sc-if value="{{ hasPartner }}" hint-placeholder-val="{{ true }}">
        <span title="Партнёр направления" style="display:inline-flex;align-items:center;gap:var(--space-2);min-width:0">
          <span style="flex:none;width:var(--space-5);height:var(--space-5);display:inline-flex;align-items:center;justify-content:center;border:var(--border-width-2) solid var(--color-border);font-size:var(--font-size-2xs);font-weight:var(--font-weight-extrabold);color:var(--color-foreground);background:var(--color-card)">{{ partnerInitial }}</span>
          <span style="font-size:var(--font-size-eyebrow);font-weight:var(--font-weight-extrabold);letter-spacing:var(--font-letter-spacing-micro);text-transform:uppercase;color:var(--color-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Партнёр · {{ partnerName }}</span>
        </span>
      </sc-if>
    </div>
  </div>
</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:440},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Школа&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Школа травматологии и ортопедии&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;description&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Разборы клинических случаев от артроскопии до эндопротезирования — каждую неделю в прямом эфире.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;24 эфира&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;partnerName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Санофарм&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;emblem&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Тр&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;academy-project.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stage&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const partner = p.partnerName || '';
    return {
      // Тема — семантическими токенами DS: класс .dark на обёртке, как у unit-feed-card.
      themeClass: p.dark ? 'dark' : '',
      href: p.href || '#',
      kind: p.kind || 'Школа',
      title: p.title || '',
      description: p.description || '',
      count: p.count || '',
      hasStage: !!p.stage,
      stage: p.stage || '',
      emblem: p.emblem || (p.title || '?').replace(/^Школа\s+/i, '').slice(0, 2),
      hasPartner: !!partner,
      partnerName: partner,
      partnerInitial: partner ? partner[0] : ''
    };
  }
}
</script>
</body>
</html>
