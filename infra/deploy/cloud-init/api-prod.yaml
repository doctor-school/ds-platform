#cloud-config
# Base hardening for api-prod on first boot (spec §5). Non-root deploy user,
# firewall, Docker + compose plugin, timezone. App containers are brought up
# separately from infra/deploy/compose/api-prod/ (NOT here) once secrets are
# provisioned out-of-band into /etc/ds-platform/*.env (spec §5.4).

timezone: Europe/Moscow

package_update: true
package_upgrade: true
packages:
  - ufw
  - fail2ban
  - unattended-upgrades
  - ca-certificates
  - curl

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMhbEUW92rTm3l3HgO0ipwRSg1UnTRJrWYqit5Z2ViBV deploy@ds-api-prod"
  # #2984: the break-glass admin (release-pipeline spec §4). Its key is held
  # offline by the owner, carries no forced command and has full sudo (its own
  # sudoers file below); it is the only interactive admin path once root login is
  # off. The public key is rendered from var.prod_breakglass_ssh_pubkey_path (templatefile, api-prod.tf).
  - name: breakglass
    groups: [sudo]
    shell: /bin/bash
    ssh_authorized_keys:
      - "${breakglass_ssh_pubkey}"

write_files:
  # Directory for out-of-band secrets — filled by the provisioning runbook, never baked here.
  - path: /etc/ds-platform/.keep
    content: ""
    permissions: "0700"
  # #2984: ssh hardening (release-pipeline spec §4, §8 step (c)). The same bytes as
  # the drop-in of infra/deploy/bin/harden-ssh.sh, the converge for boxes that already
  # run (tools/deploy/harden-ssh.test.mjs pins them equal). The `PermitRootLogin yes`
  # of the image's main sshd_config is commented out in runcmd below.
  - path: /etc/ssh/sshd_config.d/10-ds-hardening.conf
    permissions: "0644"
    content: |
      # ds-platform ssh hardening (Issue #2984; release-pipeline spec §4).
      # Sorted before 50-cloud-init.conf and read before the main sshd_config:
      # sshd takes the first value it reads for each keyword.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      MaxStartups 10:30:60
      PermitUserEnvironment no
  - path: /etc/sudoers.d/91-ds-breakglass
    permissions: "0440"
    content: |
      breakglass ALL=(ALL) NOPASSWD:ALL
  # What this box serves; ds-deploy-entrypoint serves `upload-report` on `stage` only.
  - path: /etc/ds-platform/box-role
    permissions: "0644"
    content: |
      prod
  # Standing build-cache GC (#1419). `pnpm deploy:prod` builds the api/portal
  # images ON THIS BOX, and BuildKit keeps every layer it ever produced: the
  # cache grew unbounded to 54.6 GB / 77% disk before the 2026-08-21 cleanup.
  # `builder.gc` makes the daemon itself hold the cache under the cap, so the box
  # is safe even if a deploy never runs the post-deploy prune step. Written here
  # BEFORE the `get.docker.com` install in runcmd, so dockerd reads it on its
  # very first start.
  #
  # `defaultReservedSpace` is the modern spelling (docker 28+), matching the
  # `--reserved-space` CLI flag; the legacy `defaultKeepStorage` still validates
  # on 29.6.1 but is the older name.
  #
  # Since #2981 api-prod builds nothing (it pulls the recorded registry digests),
  # so this cap is a harmless backstop. Its figure is kept equal to
  # `BUILD_CACHE_RESERVED_SPACE` in `tools/staging/slot.mjs` (the stage prune) —
  # YAML cannot import the JS constant, so the two are kept in sync by hand.
  - path: /etc/docker/daemon.json
    content: |
      {
        "builder": {
          "gc": {
            "enabled": true,
            "defaultReservedSpace": "10GB"
          }
        }
      }
    permissions: "0644"

runcmd:
  # Docker CE + compose plugin (official convenience script).
  - curl -fsSL https://get.docker.com | sh
  # #1419: prove the daemon.json written above parses on THIS docker version.
  # `--validate` only parses the config — it never touches the running service —
  # so this is safe post-install and cannot break first boot. Deliberately
  # non-blocking (`|| echo`): a bad config would already have surfaced when
  # dockerd started, and halting cloud-init here would leave a half-provisioned
  # box. The failure is loud in /var/log/cloud-init-output.log instead.
  - dockerd --validate --config-file /etc/docker/daemon.json || echo "WARNING (#1419) /etc/docker/daemon.json failed dockerd --validate — build-cache GC policy is NOT in effect; fix the file and restart docker"
  # Host-level firewall (defence-in-depth alongside twc_firewall): SSH + web only.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl enable --now fail2ban
  - install -d -m 0700 -o root -g root /etc/ds-platform
  # #2982: state dir of the durable release entrypoint /usr/local/bin/ds-release
  # (status files /var/lib/ds-platform/release/<env>/<sha>.json).
  # The box carries no tree of its own, so every prod run (`pnpm deploy:prod`)
  # installs it from infra/deploy/bin/ds-release of the tree it ships, before any box
  # step: right after the ship, or from the operator checkout on `--rollback`.
  # It relies on systemd-run, flock, runuser and python3 from the base image.
  - install -d -m 0755 -o root -g root /var/lib/ds-platform/release
  # #2984: ssh hardening, the end state of infra/deploy/bin/harden-ssh.sh. Root
  # login is off (the drop-in above) and root holds no key; the CI keys of deploy
  # (forced command /usr/local/bin/ds-deploy-entrypoint, installed by every prod
  # run beside ds-release) are added by the lead with harden-ssh.sh, never baked here.
  - [
      "sed",
      "-E",
      "-i",
      's/^[[:space:]]*(PermitRootLogin[[:space:]]+yes.*)$/# \1  # ds-platform: set by sshd_config.d\/10-ds-hardening.conf/',
      "/etc/ssh/sshd_config",
    ]
  - truncate -s 0 /root/.ssh/authorized_keys
  - systemctl enable --now unattended-upgrades
  - sshd -t && systemctl reload ssh
