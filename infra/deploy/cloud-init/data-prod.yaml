#cloud-config
# Base hardening for data-prod on first boot (spec §5). PRIVATE host: NO public
# IPv4 — all egress goes through the VPC NAT router (twc_router.ds), reached via
# the default route below. Postgres/Redis are reachable only inside the VPC, and
# the twc_firewall already restricts to the VPC CIDR. Host ufw allows SSH only.
# App containers come up separately from infra/deploy/compose/data-prod/.
#
# Rendered by terraform templatefile() (data-prod.tf): ${router_gateway_ip} is the
# Timeweb-assigned gateway of twc_router.ds inside the VPC (var.vpc_router_gateway_ip).
#
# NOTE: unlike api-prod.yaml, packages install from `runcmd`, NOT the cloud-init
# `packages` module — this host has zero egress until the default route below is
# applied, and the package module runs BEFORE runcmd, so it would hang against
# unreachable mirrors. runcmd gives the explicit order: route first, then apt.

timezone: Europe/Moscow

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBWaxOrFAq4TUzvsFD+pkiTes/bwVY/u/DbNEtv11PiJ deploy@ds-data-prod"
  # #2984: the break-glass admin (release-pipeline spec §4). Its key is held
  # offline by the owner, carries no forced command and has full sudo (its own
  # sudoers file below); it is the only interactive admin path once root login is
  # off. The public key is rendered from var.prod_breakglass_ssh_pubkey_path (templatefile, data-prod.tf).
  - name: breakglass
    groups: [sudo]
    shell: /bin/bash
    ssh_authorized_keys:
      - "${breakglass_ssh_pubkey}"

write_files:
  # Default IPv4 route via the VPC NAT router — the ONLY egress path for this
  # IP-less host. IPv4 public resolvers ride the same path (Timeweb's provisioned
  # resolvers are IPv6-only and unreachable from the private plane).
  - path: /etc/netplan/60-vpc-default-route.yaml
    permissions: "0600"
    content: |
      network:
        version: 2
        ethernets:
          eth1:
            routes:
              - to: default
                via: ${router_gateway_ip}
            nameservers:
              addresses: [1.1.1.1, 8.8.8.8]
  # Directory for out-of-band secrets — filled by the provisioning runbook, never baked here.
  - path: /etc/ds-platform/.keep
    content: ""
    permissions: "0700"
  # #2984: ssh hardening (release-pipeline spec §4, §8 step (c)). The same bytes as
  # the drop-in of infra/deploy/bin/harden-ssh.sh, the converge for boxes that already
  # run (tools/deploy/harden-ssh.test.mjs pins them equal). The `PermitRootLogin yes`
  # of the image's main sshd_config is commented out in runcmd below.
  - path: /etc/ssh/sshd_config.d/10-ds-hardening.conf
    permissions: "0644"
    content: |
      # ds-platform ssh hardening (Issue #2984; release-pipeline spec §4).
      # Sorted before 50-cloud-init.conf and read before the main sshd_config:
      # sshd takes the first value it reads for each keyword.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      MaxStartups 10:30:60
      PermitUserEnvironment no
  - path: /etc/sudoers.d/91-ds-breakglass
    permissions: "0440"
    content: |
      breakglass ALL=(ALL) NOPASSWD:ALL
  # What this box serves; ds-deploy-entrypoint serves `upload-report` on `stage` only.
  - path: /etc/ds-platform/box-role
    permissions: "0644"
    content: |
      data

runcmd:
  # 1. Egress first: apply the NAT-router default route + IPv4 DNS.
  - netplan apply
  # 2. Base packages (same set as api-prod, installed here because egress only
  #    exists after step 1 — see NOTE above).
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get -y upgrade
  - DEBIAN_FRONTEND=noninteractive apt-get install -y ufw fail2ban unattended-upgrades ca-certificates curl
  # 3. Docker CE + compose plugin (official convenience script).
  - curl -fsSL https://get.docker.com | sh
  # 4. SSH only on the host firewall; 5432/6379 are exposed to the VPC by
  #    twc_firewall, never to the public internet (data-prod has no public IP).
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw --force enable
  - systemctl enable --now fail2ban
  - install -d -m 0700 -o root -g root /etc/ds-platform
  # #2982: state dir of the durable release entrypoint /usr/local/bin/ds-release
  # (status files /var/lib/ds-platform/release/<env>/<sha>.json).
  # The box carries no tree of its own, so every prod run (`pnpm deploy:prod`)
  # installs it from infra/deploy/bin/ds-release of the tree it ships, before any box
  # step: right after the ship, or from the operator checkout on `--rollback`.
  # It relies on systemd-run, flock, runuser and python3 from the base image.
  - install -d -m 0755 -o root -g root /var/lib/ds-platform/release
  # #2984: ssh hardening, the end state of infra/deploy/bin/harden-ssh.sh. Root
  # login is off (the drop-in above) and root holds no key; the CI keys of deploy
  # (forced command /usr/local/bin/ds-deploy-entrypoint, installed by every prod
  # run beside ds-release) are added by the lead with harden-ssh.sh, never baked here.
  - [
      "sed",
      "-E",
      "-i",
      's/^[[:space:]]*(PermitRootLogin[[:space:]]+yes.*)$/# \1  # ds-platform: set by sshd_config.d\/10-ds-hardening.conf/',
      "/etc/ssh/sshd_config",
    ]
  - truncate -s 0 /root/.ssh/authorized_keys
  - systemctl enable --now unattended-upgrades
  - sshd -t && systemctl reload ssh
