#cloud-config
# Base bootstrap for stage-1, the STAGE stand box (tech spec
# 2026-09-08-staging-previews-and-regression-contour-en.md §3, Issue #2061).
#
# It is api-prod.yaml with one addition (git, for the box checkout at
# /srv/ds-platform) and nothing else. The box runs containers and nothing else: an
# operator ships a committed tree over SSH and the box builds its own images, exactly
# as production does (spec §5, `tools/staging/slot.mjs`); the regression suite runs on
# the operator's machine against the slot's public hosts — so no Node toolchain, no
# Playwright host libraries, no CI agent and no unit of ours on this box.
#
# WHY IT MUST STAY THIS SHORT (#2121). Timeweb hard-resets a new server ~2 minutes
# after the IP and firewall resources attach, mid-first-boot. A `runcmd` that runs for
# minutes (a Node install, `playwright install-deps`, a tarball download) is killed
# part-way and leaves a half-provisioned box; the api-prod set below finishes inside
# that window and has provisioned reliably. Anything long-running belongs in a step
# run over SSH after `cloud-init status --wait`, never here.
#
# As on api-prod, NO application container is started here: the shared `stg-infra`
# project is brought up separately from infra/deploy/compose/stg-infra/ once the box
# env is provisioned into /etc/ds-platform/stage.env (see that directory's README).
#
# Rendered by templatefile() from stage-1.tf with ONE variable:
#   deploy_ssh_pubkey — the operator public key at var.stage_1_ssh_pubkey_path,
#   the same key Timeweb installs for root, so the `deploy` user is reachable
#   from first boot without a manual copy step.

timezone: Europe/Moscow

package_update: true
package_upgrade: true
packages:
  - ufw
  - fail2ban
  - unattended-upgrades
  - ca-certificates
  - curl
  - git

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - "${deploy_ssh_pubkey}"
  # #2984: the break-glass admin (release-pipeline spec §4). Its key is held
  # offline by the owner, carries no forced command and has full sudo (its own
  # sudoers file below); it is the only interactive admin path once root login is
  # off. The public key is rendered from var.stage_1_breakglass_ssh_pubkey_path (templatefile, stage-1.tf).
  - name: breakglass
    groups: [sudo]
    shell: /bin/bash
    ssh_authorized_keys:
      - "${breakglass_ssh_pubkey}"

write_files:
  # Directory for the box env set — filled by the Phase B provisioning step, never
  # baked here. stage.env carries SINK and TEST values only; the box holds no
  # production credential of any kind (spec §3 «Secrets and side effects», and the
  # C1 acceptance greps this directory against the production secret names).
  - path: /etc/ds-platform/.keep
    content: ""
    permissions: "0700"
  # #2984: ssh hardening (release-pipeline spec §4, §8 step (c)). The same bytes as
  # the drop-in of infra/deploy/bin/harden-ssh.sh, the converge for boxes that already
  # run (tools/deploy/harden-ssh.test.mjs pins them equal). The `PermitRootLogin yes`
  # of the image's main sshd_config is commented out in runcmd below.
  - path: /etc/ssh/sshd_config.d/10-ds-hardening.conf
    permissions: "0644"
    content: |
      # ds-platform ssh hardening (Issue #2984; release-pipeline spec §4).
      # Sorted before 50-cloud-init.conf and read before the main sshd_config:
      # sshd takes the first value it reads for each keyword.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      MaxStartups 10:30:60
      PermitUserEnvironment no
  - path: /etc/sudoers.d/91-ds-breakglass
    permissions: "0440"
    content: |
      breakglass ALL=(ALL) NOPASSWD:ALL
  # What this box serves; ds-deploy-entrypoint serves `upload-report` on `stage` only.
  - path: /etc/ds-platform/box-role
    permissions: "0644"
    content: |
      stage

  # Byte-identical to api-prod's daemon.json (#1419) — kept for parity so both boxes
  # validate the same daemon config. Its `builder.gc` cap bounds the BuildKit build
  # cache — this box builds every slot image itself (spec §5), so the cap is live here
  # exactly as on api-prod. Images are bounded by `slot down` (removes the slot's
  # SHA-tagged images) and by the operator-run `pnpm stage:slot gc` prune with the
  # reserved-space policy of prod.mjs (spec §9, #2064 scope). Written BEFORE the
  # get.docker.com install in runcmd so dockerd reads it on its very first start.
  - path: /etc/docker/daemon.json
    content: |
      {
        "builder": {
          "gc": {
            "enabled": true,
            "defaultReservedSpace": "10GB"
          }
        }
      }
    permissions: "0644"

runcmd:
  # Docker CE + compose plugin (official convenience script), same as api-prod.
  - curl -fsSL https://get.docker.com | sh
  # #1419 parity: prove the daemon.json written above parses on THIS docker version.
  # Non-blocking on purpose — halting cloud-init would leave a half-provisioned box.
  - dockerd --validate --config-file /etc/docker/daemon.json || echo "WARNING (#1419) /etc/docker/daemon.json failed dockerd --validate — build-cache GC policy is NOT in effect; fix the file and restart docker"
  # Host firewall (defence-in-depth alongside twc_firewall.stage_1): SSH + web only.
  # Since #2984 twc_firewall.stage_1 opens 22 to GitHub-hosted runners too; a CI key
  # reaches only the forced command /usr/local/bin/ds-deploy-entrypoint.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl enable --now fail2ban
  - install -d -m 0700 -o root -g root /etc/ds-platform
  # #2982: state dir of the durable release entrypoint /usr/local/bin/ds-release
  # (status files /var/lib/ds-platform/release/<env>/<sha>.json).
  # The box carries no tree of its own, so every operator run (`pnpm deploy:prod`,
  # `pnpm stage:slot`) installs it from infra/deploy/bin/ds-release before any box
  # step: right after the ship, or from the operator checkout on `--rollback`.
  # It relies on systemd-run, flock, runuser and python3 from the base image.
  - install -d -m 0755 -o root -g root /var/lib/ds-platform/release
  # #2984: ssh hardening, the end state of infra/deploy/bin/harden-ssh.sh. Root
  # login is off (the drop-in above) and root holds no key; the CI keys of deploy
  # (forced command /usr/local/bin/ds-deploy-entrypoint, installed by every operator
  # run beside ds-release) are added by the lead with harden-ssh.sh, never baked here.
  - [
      "sed",
      "-E",
      "-i",
      's/^[[:space:]]*(PermitRootLogin[[:space:]]+yes.*)$/# \1  # ds-platform: set by sshd_config.d\/10-ds-hardening.conf/',
      "/etc/ssh/sshd_config",
    ]
  - truncate -s 0 /root/.ssh/authorized_keys
  - systemctl enable --now unattended-upgrades
  - sshd -t && systemctl reload ssh
