#cloud-config
# Base bootstrap for stage-1, the STAGE stand box (tech spec
# 2026-09-08-staging-previews-and-regression-contour-en.md §3, Issue #2061).
#
# It is api-prod.yaml with one addition (git, for the box checkout at
# /srv/ds-platform) and nothing else. NOTHING that a preview needs is built here:
# images are built and the regression suite runs on GitHub-hosted runners (spec §5),
# and the pull-based slot deployer arrives with the slot script (step 4, #2064) — so
# no Node toolchain, no Playwright host libraries and no CI agent on this box.
#
# WHY IT MUST STAY THIS SHORT (#2121). Timeweb hard-resets a new server ~2 minutes
# after the IP and firewall resources attach, mid-first-boot. A `runcmd` that runs for
# minutes (a Node install, `playwright install-deps`, a tarball download) is killed
# part-way and leaves a half-provisioned box; the api-prod set below finishes inside
# that window and has provisioned reliably. Anything long-running belongs in a step
# run over SSH after `cloud-init status --wait`, never here.
#
# As on api-prod, NO application container is started here: the shared `stg-infra`
# project is brought up separately from infra/deploy/compose/stg-infra/ once the box
# env is provisioned into /etc/ds-platform/stage.env (see that directory's README).
#
# Rendered by templatefile() from stage-1.tf with ONE variable:
#   deploy_ssh_pubkey — the operator public key at var.stage_1_ssh_pubkey_path,
#   the same key Timeweb installs for root, so the `deploy` user is reachable
#   from first boot without a manual copy step.

timezone: Europe/Moscow

package_update: true
package_upgrade: true
packages:
  - ufw
  - fail2ban
  - unattended-upgrades
  - ca-certificates
  - curl
  - git

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - "${deploy_ssh_pubkey}"

write_files:
  # Directory for the box env set — filled by the Phase B provisioning step, never
  # baked here. stage.env carries SINK and TEST values only; the box holds no
  # production credential of any kind (spec §3 «Secrets and side effects», and the
  # C1 acceptance greps this directory against the production secret names).
  - path: /etc/ds-platform/.keep
    content: ""
    permissions: "0700"

  # Byte-identical to api-prod's daemon.json (#1419) — kept for parity so both boxes
  # validate the same daemon config. Its `builder.gc` cap bounds the BuildKit build
  # cache ONLY, and this box never builds (images are pulled from GHCR, spec §5), so
  # it is inert here: pulled images are bounded instead by `slot down` (removes the
  # slot's SHA-tagged images) and by the nightly `slot gc` image prune with the
  # reserved-space policy of prod.mjs (spec §9, #2064 scope). Written BEFORE the
  # get.docker.com install in runcmd so dockerd reads it on its very first start.
  - path: /etc/docker/daemon.json
    content: |
      {
        "builder": {
          "gc": {
            "enabled": true,
            "defaultReservedSpace": "10GB"
          }
        }
      }
    permissions: "0644"

runcmd:
  # Docker CE + compose plugin (official convenience script), same as api-prod.
  - curl -fsSL https://get.docker.com | sh
  # #1419 parity: prove the daemon.json written above parses on THIS docker version.
  # Non-blocking on purpose — halting cloud-init would leave a half-provisioned box.
  - dockerd --validate --config-file /etc/docker/daemon.json || echo "WARNING (#1419) /etc/docker/daemon.json failed dockerd --validate — build-cache GC policy is NOT in effect; fix the file and restart docker"
  # Host firewall (defence-in-depth alongside twc_firewall.stage_1): SSH + web only.
  # No port is opened for CI and none is needed: the slot deployer polls GitHub
  # OUTBOUND, so this box takes no inbound CI path, no deploy key and no CI-facing 22.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl enable --now fail2ban
  - install -d -m 0700 -o root -g root /etc/ds-platform
