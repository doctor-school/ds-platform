{
  "name": "ds-data-prod",
  "services": {
    "postgres": {
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "50m",
          "max-file": "3"
        }
      },
      "build": {
        "context": "./postgres",
        "dockerfile": "Dockerfile"
      },
      "image": "ds-postgres:pg17-partman-pgbackrest",
      "restart": "unless-stopped",
      "env_file": [
        "/etc/ds-platform/data.env"
      ],
      "environment": {
        "POSTGRES_USER": "ds",
        "POSTGRES_DB": "ds_prod"
      },
      "command": [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf"
      ],
      "volumes": [
        "pgdata:/var/lib/postgresql/data",
        "./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro",
        "./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro",
        "./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro",
        "pgsocket:/var/run/postgresql",
        "pgbackrest_log:/var/log/pgbackrest"
      ],
      "ports": [
        "${VPC_IP:?set VPC_IP to data-prod private IP}:5432:5432"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U ds -d ds_prod"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 5,
        "start_period": "20s"
      }
    },
    "redis": {
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "50m",
          "max-file": "3"
        }
      },
      "image": "redis:7-alpine",
      "restart": "unless-stopped",
      "command": [
        "redis-server",
        "--appendonly",
        "yes"
      ],
      "volumes": [
        "redisdata:/data"
      ],
      "ports": [
        "${VPC_IP:?set VPC_IP to data-prod private IP}:6379:6379"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "redis-cli",
          "ping"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 5
      }
    },
    "pgbackrest": {
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "50m",
          "max-file": "3"
        }
      },
      "build": {
        "context": "./pgbackrest",
        "dockerfile": "Dockerfile"
      },
      "image": "ds-pgbackrest:local",
      "restart": "unless-stopped",
      "env_file": [
        "/etc/ds-platform/data.env"
      ],
      "environment": {
        "TZ": "Europe/Moscow"
      },
      "volumes": [
        "pgdata:/var/lib/postgresql/data:ro",
        "pgsocket:/var/run/postgresql",
        "./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro",
        "pgbackrest_log:/var/log/pgbackrest"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      }
    }
  },
  "volumes": {
    "pgdata": null,
    "redisdata": null,
    "pgsocket": null,
    "pgbackrest_log": null
  }
}
