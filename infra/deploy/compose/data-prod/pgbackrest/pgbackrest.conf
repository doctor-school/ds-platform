# DS Platform data-prod — pgbackrest repo + stanza config (DSO-100 spec §6.3).
# Mounted read-only into BOTH the postgres container (for archive_command) and the
# pgbackrest sidecar (for scheduled backups). Only NON-secret, NON-deploy-specific
# policy lives here; every secret and every per-deploy value is injected via the
# PGBACKREST_* env from data.env (data.env.example), so this file is committable:
#   PGBACKREST_REPO1_S3_BUCKET      pgbackrest_bucket_full_name (terraform output)
#   PGBACKREST_REPO1_S3_ENDPOINT    pgbackrest_s3_hostname (terraform output)
#   PGBACKREST_REPO1_S3_REGION      Timeweb S3 region
#   PGBACKREST_REPO1_S3_KEY         S3 access key of the restricted S3 user
#   PGBACKREST_REPO1_S3_KEY_SECRET  ds-data-prod-pgbackrest (infra/deploy/README.md)
#   PGBACKREST_REPO1_CIPHER_PASS    repo AES-256-CBC passphrase (secret)
# and per offsite repo N = 2, 3 (#3670): PGBACKREST_REPON_S3_KEY / _S3_KEY_SECRET /
# _S3_ENDPOINT, set through data-secret.mjs, and PGBACKREST_REPON_CIPHER_PASS, which
# the box generates (it never exists at that repo's provider).

[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-uri-style=path
# Retention: 7 daily fulls (spec §6.3). No retention on the partition drop-mask side
# — that is a Postgres/pg_partman concern, not a backup concern.
repo1-retention-full=7
# Encrypt the repo (backups + archived WAL) at rest with AES-256-CBC; passphrase via
# PGBACKREST_REPO1_CIPHER_PASS (never in this file).
repo1-cipher-type=aes-256-cbc
# WAL archiving to repo1 is ASYNCHRONOUS and this file configures repo1 ALONE, so
# PostgreSQL's archive_command (postgres/pgbackrest-archive.sh) waits on repo1 only.
# No offsite repo is ever added here (#4298): pgBackRest 2.60's multi-repo push stops
# pushing to EVERY repo after one repo fails (pgbackrest/pgbackrest#2926, fix not
# released), and even fixed it keeps the healthy repo at most one batch window
# ahead, so one offsite outage would stall repo1, grow pg_wal and, at the queue
# limit, drop WAL from every repo. The spool holds status files only, and pgBackRest
# recreates it, so it lives in each container's own /var/spool/pgbackrest (the images
# create it), not on a volume.
archive-async=y
spool-path=/var/spool/pgbackrest
# Past 16 GiB of WAL repo1 has not acknowledged (a repo1 outage), pgBackRest reports
# the whole queue archived and drops it, rather than let pg_wal fill the 80 GB disk
# and stop PostgreSQL; PITR then breaks past that point until the next full.
# ds-read's WAL line shows the queue growing long before that.
archive-push-queue-max=16GiB
start-fast=y
log-level-console=info
log-level-file=info
log-path=/var/log/pgbackrest
process-max=2

# Offsite repos (#3670), each on only while data.env holds all four of its names.
# pgbackrest-offsite.sh writes each one's OWN config, /etc/pgbackrest/offsite/repoN/
# pgbackrest.conf: this file minus repo1 and its async archiving, plus the `#offsite: `
# lines and that repo's `#repoN: ` lines below; pgbackrest-repo.sh runs pgBackRest
# under it. The archive_command spools each segment repo1 holds for every repo that is
# on, and the sidecar's wal-offsite-push.sh pushes the spool to it with a synchronous
# archive-push (#4298). Offsite backups (backup.sh offsite) run under the same config
# with archive-check, so their WAL comes through the spool: archive-timeout leaves
# room for the pusher's minute. Buckets, versioning, Object Lock and lifecycle are the
# provider-side owner's (infra/deploy/README.md); this box only writes to them.
# Retention is by time: 35 days of fulls (weekly, crontab) keep every backup an
# expire deletes older than the buckets' 30-day lock, so expire never meets a locked
# object; the buckets' 35-day noncurrent lifecycle reaps overwritten info files.
#offsite: archive-timeout=600
# repo2 — IDrive e2 SG2 (Object Lock GOVERNANCE 30 d). IDrive drops RU source
# addresses, so repo2 goes through the repo2-tunnel compose service (#4287): it carries
# the endpoint's name (data.env PGBACKREST_REPO2_S3_ENDPOINT=s3.ap-southeast-2.idrivee2.com)
# as its alias on the network it shares with the pgbackrest sidecar alone (the only
# container that talks to an offsite repo) and forwards 443 to IDrive over SSH via the
# relay host. No storage-host / -port / verify-tls here: pgBackRest connects to that
# name, so SNI, the certificate check and the signature stay IDrive's.
#repo2: repo2-type=s3
#repo2: repo2-path=/pgbackrest
#repo2: repo2-s3-bucket=bbm-ds-pgbackrest
#repo2: repo2-s3-region=ap-southeast-2
#repo2: repo2-s3-uri-style=path
#repo2: repo2-cipher-type=aes-256-cbc
#repo2: repo2-retention-full-type=time
#repo2: repo2-retention-full=35
# repo3 — Onidel bbm-sydney, Ceph RGW (Object Lock COMPLIANCE 30 d).
#repo3: repo3-type=s3
#repo3: repo3-path=/pgbackrest
#repo3: repo3-s3-bucket=bbm-ds-pgbackrest
#repo3: repo3-s3-region=ap-southeast-2
#repo3: repo3-s3-uri-style=path
#repo3: repo3-cipher-type=aes-256-cbc
#repo3: repo3-retention-full-type=time
#repo3: repo3-retention-full=35

[ds]
# The one stanza — the ds_prod cluster on this box. pgbackrest reads PGDATA files
# directly (shared volume) and connects to Postgres over the shared unix socket
# (local `trust` in the official image's pg_hba) as the superuser `ds`.
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
pg1-user=ds
pg1-database=ds_prod
