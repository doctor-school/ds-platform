# DS Platform stg-infra — Postgres 17 tuning for the STAGE box (#2061).
#
# Loaded via: postgres -c config_file=/etc/postgresql/postgresql.conf
#
# It is neither the dev profile (infra/dev-stand/postgres/postgresql.conf.dev, one
# developer, 512 MB shared_buffers) nor the prod profile
# (infra/deploy/compose/data-prod/postgres/postgresql.conf, a dedicated 4/8 box with
# WAL archiving). This server sits on a SHARED 16 GB box (preset 4807) next to
# stg-infra's other containers, up to three preview slots, an in-flight image build
# and the Playwright suite — so the budget below is deliberately conservative:
# Postgres gets ~2 GB of shared buffers, not the ~4 GB a 16 GB dedicated box would
# take. Raising it is how the box starts OOM-killing builds.
#
# NO WAL ARCHIVING and NO pgbackrest here (unlike data-prod): the box carries no
# unique state — `terraform apply` recreates it and stg-infra + `ds_golden` rebuild
# from the repo (spec §9 «Box down»).

# --- Extensions / background workers ---
# pg_partman background worker (ADR-0003 §3) — partition auto-creation runs INSIDE
# Postgres. Loading the library requires a restart, so the library line is here even
# though the maintenance target differs from production.
#
# `pg_partman_bgw.dbname` names the databases the worker maintains, and on this box
# the set is not static: slot databases are created and dropped by `slot up` /
# `slot down` (step 4). The worker is pointed at `ds_golden` — the template every
# slot database is cloned from — and NOT at the slot databases, deliberately:
#   - a slot lives hours to days, far shorter than the monthly partition interval,
#     so no slot ever needs a partition created after its clone, and
#   - the alternative (rewriting this line and restarting Postgres on every `slot
#     up`) would bounce the shared database server for every preview.
# A scenario that genuinely needs a partition boundary crossed inside a slot calls
# `partman.run_maintenance()` on its own database from the test, which is the same
# seam #136 uses. Recorded here rather than left implicit.
shared_preload_libraries = 'pg_partman_bgw'
pg_partman_bgw.dbname = 'ds_golden'
pg_partman_bgw.role = 'ds'
pg_partman_bgw.interval = 3600

# --- Connections ---
# Listen on all container interfaces. Nothing publishes 5432 to the host: the only
# clients are containers on the `stg-infra` network (each slot's api, Zitadel,
# Cerbos) — compose.yml declares no `ports` for this service.
listen_addresses = '*'
# Budget: 3 slots x (api pool ~20 + migrate 5) + Zitadel ~25 + the seed/clone tooling
# + psql sessions from the slot script, with headroom for a slot that is being torn
# down while another comes up. Each backend costs ~10 MB, so 300 is ~3 GB worst case
# — affordable next to the 2 GB shared_buffers below, and cheaper than a slot failing
# to migrate at 03:00 because the previous suite left sessions open.
max_connections = 300

# hba_file / ident_file must point back into PGDATA: with config_file OUTSIDE PGDATA
# they would otherwise default next to this file and not be found (the official
# entrypoint generates them inside PGDATA). Dev-stand and data-prod precedent.
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'

# --- Memory (16 GB box SHARED with slots, builds and the browser suite) ---
# shared_buffers is capped at 2 GB by the brief's sizing note, not by the usual
# 25%-of-RAM rule: the other ~14 GB is spoken for (stg-infra ~4 GB, 3 idle slots
# ~6 GB, one image build ~3 GB, Playwright ~2 GB — variables.tf → stage_1_preset_id).
shared_buffers = 2GB
# The planner hint, not an allocation: what the OS page cache plausibly holds for
# Postgres on a box this busy. Deliberately below the prod ratio.
effective_cache_size = 4GB
work_mem = 16MB
# Sized for the operation that actually matters here: `CREATE DATABASE <slot>
# TEMPLATE ds_golden` plus the index builds of a migration on a fresh clone. Small
# enough that a few concurrent slot creations cannot add up to real pressure.
maintenance_work_mem = 512MB

# --- WAL ---
# wal_level=minimal is NOT used even though nothing streams from here: `minimal`
# would require max_wal_senders=0 and buys little on NVMe, while `replica` keeps the
# cluster diagnosable with the same tooling as production. No archive_mode, no
# archive_command — there is no backup repository on this box (see header).
wal_level = replica
# Slot creation from a template and a full golden seed are write bursts; a small
# max_wal_size would checkpoint through them. 4 GB of the 160 GB disk is cheap next
# to the images the box stores.
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9

# --- Planner (NVMe) ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Logging ---
# Louder than production on purpose: this server is a debugging surface for failed
# preview runs, and its logs are read after the fact from `docker compose logs`.
log_min_duration_statement = 500ms
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
# Which slot database a connection belongs to is the first question when a preview
# misbehaves; %d in the prefix answers it only once the session is logged.
log_connections = on
log_disconnections = on

# --- Timezone (server storage in UTC, as everywhere else) ---
timezone = 'UTC'
