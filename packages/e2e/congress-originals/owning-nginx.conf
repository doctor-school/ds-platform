# ОРТОБИОЛОГИЯ-2027 — production vhost on tools-prod-tw (Issue #6).
#
# `infra/host/provision.sh` always installs this file into sites-available, but
# enables it only with `--enable-production` after a certificate covering BOTH
# orthobio.ru and www.orthobio.ru has been verified. This makes the DNS switch
# safe: the new origin already serves valid TLS before public A records move.
#
# Production and preview deliberately share one release root. The bytes,
# redirects and branded 404 that CI verified are identical; only the vhost
# controls indexing. The preview keeps its X-Robots-Tag forever, while this
# vhost must never add one.

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name orthobio.ru;

    root /var/www/orthobio-site/public;
    index index.html;

    access_log /var/log/nginx/orthobio.ru.access.log;
    error_log  /var/log/nginx/orthobio.ru.error.log;

    add_header Cache-Control $orthobio_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # form-action 'self': the congress sign-up form posts to this origin only
    # (the /api proxy below). script-src/frame-src/connect-src stay unset on
    # purpose — that is what lets the Yandex SmartCaptcha script and frame load.
    add_header Content-Security-Policy "base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=86400" always;

    include /etc/nginx/snippets/orthobio-redirects.conf;

    # Same-origin proxy for the congress sign-up form: the platform API has no
    # CORS. This host's egress IP must be in the platform's TRUSTED_PROXIES
    # (launch check on ds-platform#2292), or its per-IP rate limit keys on us.
    # The upstream name is resolved at config load, so a reload on a host
    # without DNS fails at `nginx -t`, not at request time.
    # Exact matches only: any other /api/ path falls through to the static 404.
    # No add_header in these blocks, so the server-level security headers still
    # apply; upstream status codes pass through untouched. The upstream's own
    # Cache-Control is hidden so the cache map's `no-store` is the only one.
    # No stage-gate include here: api.doctor.school is not behind basic auth.
    location = /api/v1/congress/sign-up {
        if ($request_method != POST) {
            return 405;
        }
        client_max_body_size 16k;
        proxy_pass https://api.doctor.school/v1/congress/sign-up;
        proxy_http_version 1.1;
        proxy_set_header Host api.doctor.school;
        proxy_hide_header Cache-Control;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/public/specialties {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        proxy_pass https://api.doctor.school/v1/public/specialties;
        proxy_http_version 1.1;
        proxy_set_header Host api.doctor.school;
        proxy_hide_header Cache-Control;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    ssl_certificate /etc/letsencrypt/live/orthobio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orthobio.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTPS www must terminate with a valid certificate before redirecting. Sending
# it straight to the apex preserves path/query and creates one redirect hop.
server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name www.orthobio.ru;

    add_header Strict-Transport-Security "max-age=86400" always;
    return 301 https://orthobio.ru$request_uri;

    ssl_certificate /etc/letsencrypt/live/orthobio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orthobio.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP apex and www both move directly to canonical HTTPS apex. Cert issuance
# happens through DNS-01 before this vhost is enabled, so ACME does not need a
# special HTTP location here.
server {
    listen 80;
    listen [::]:80;
    server_name orthobio.ru www.orthobio.ru;
    return 301 https://orthobio.ru$request_uri;
}
