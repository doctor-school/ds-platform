# prod-surface readiness manifest (#771) — the committed source of truth for
# which user-reachable App-Router routes are allowed to face production.
#
# Every `page.tsx`/`page.ts` under `apps/portal/app`, `apps/admin/app` and
# `apps/doctor/app` MUST
# have exactly one entry here; `tools/lint/prod-surface-lint.ts` (CI job
# `prod-surface`, BLOCK) fails on any unlisted route, any stale entry, and any
# scaffold-tell copy on a `product-ready` route.
#
# How to classify a route:
#   - `product-ready` — the surface is a real product deliverable (Stage-B
#     approved or equivalent): no placeholder/dev copy, no debug/claims dumps,
#     no "skeleton" self-description. The scaffold-tell heuristic applies.
#   - `deferred`      — the surface is knowingly scaffold-grade; it MUST carry
#     `issue: "#N"` referencing the OPEN Issue tracking its real build
#     (AGENTS.md §6 "No untracked seam / scaffold"). Deferred routes are exempt
#     from the tell heuristic — the manifest is the only suppression mechanism.
#
# Adding a route without classifying it here reddens CI by design: classify it
# honestly, never soften the heuristic to get green.

routes:
  # apps/portal — product-grade post-#769 (facade re-point) / #770 (real /account).
  - app: portal
    route: /
    file: apps/portal/app/page.tsx
    status: product-ready
  - app: portal
    route: /@chrome
    file: apps/portal/app/@chrome/page.tsx
    status: product-ready
  - app: portal
    route: /@chrome/[...catchAll]
    file: apps/portal/app/@chrome/[...catchAll]/page.tsx
    status: product-ready
  - app: portal
    route: /login
    file: apps/portal/app/login/page.tsx
    status: product-ready
  - app: portal
    route: /register
    file: apps/portal/app/register/page.tsx
    status: product-ready
  - app: portal
    route: /reset
    file: apps/portal/app/reset/page.tsx
    status: product-ready
  - app: portal
    route: /verify
    file: apps/portal/app/verify/page.tsx
    status: product-ready
  - app: portal
    route: /account
    file: apps/portal/app/account/page.tsx
    status: product-ready
  - app: portal
    route: /account/events
    file: apps/portal/app/account/events/page.tsx
    status: product-ready
  - app: portal
    route: /webinars
    file: apps/portal/app/webinars/page.tsx
    status: product-ready
  - app: portal
    route: /webinars/[slug]
    file: apps/portal/app/webinars/[slug]/page.tsx
    status: product-ready
  - app: portal
    route: /webinars/[slug]/room
    file: apps/portal/app/webinars/[slug]/room/page.tsx
    status: product-ready

  # apps/doctor — the doctor.school storefront (#1440 scaffold, #1478 017 shell,
  # #1480 017 EARS-2 hero). The shell layout and the home hero (kicker, headline,
  # goal, the four scale counters) are REAL product content — no placeholder copy
  # and no stubbed number: a counter with no source is omitted, not zeroed. The
  # PAGE is still incomplete, so the route stays `deferred`: 017 EARS-4/9/10/11
  # build the specialty catalog, the nearest events, «Что исследовать» and the
  # leaderboard, and ADR-0015 §2 stage 3 migrates the marketing routes out of
  # apps/promo. The status flips to `product-ready` when those blocks land and
  # the page carries its Stage-B verdict. It also is not publicly
  # reachable: no compose service and no Caddy vhost point at this app; ADR-0015
  # §7 makes the host cut-over a release-time step.
  - app: doctor
    route: /
    file: apps/doctor/app/(storefront)/page.tsx
    status: deferred
    issue: "#1430"

  # apps/admin — 007 admin console (login + events CRUD/lifecycle), all real
  # Refine surfaces; root is a pure redirect to /events.
  - app: admin
    route: /
    file: apps/admin/app/page.tsx
    status: product-ready
  - app: admin
    route: /login
    file: apps/admin/app/login/page.tsx
    status: product-ready
  # 011 EARS-4/5: the forced TOTP-enrollment screen. A real product deliverable —
  # the Stage-A layout the product owner picked (#718, 2026-08-07), driven live in
  # `apps/admin/e2e/mfa-enrollment.spec.ts`. It is the ONLY surface a
  # `mfa_pending_enrollment` admin can reach, and the bootstrap path for the
  # admins who exist today (PD-1).
  - app: admin
    route: /mfa/enroll
    file: apps/admin/app/mfa/enroll/page.tsx
    status: product-ready
  # 011 EARS-6/12: the TOTP challenge screen — the one every admin login after the
  # first passes through. A real product deliverable in the same Stage-A language
  # as the enrollment card it follows, driven live in
  # `apps/admin/e2e/mfa-login.spec.ts` and axe-scanned (clean + error state) in
  # `apps/admin/e2e/a11y/a11y-axe.e2e.spec.ts`.
  - app: admin
    route: /mfa/challenge
    file: apps/admin/app/mfa/challenge/page.tsx
    status: product-ready
  - app: admin
    route: /events
    file: apps/admin/app/events/page.tsx
    status: product-ready
  - app: admin
    route: /events/create
    file: apps/admin/app/events/create/page.tsx
    status: product-ready
  - app: admin
    route: /events/[id]
    file: apps/admin/app/events/[id]/page.tsx
    status: product-ready
  # 012 EARS-1 (#1283): the project authoring vertical — the shared taxonomy admin
  # list shell plus the Stage-A composition-B tabbed detail (#1282, owner pick
  # 2026-08-17). Real product deliverables, driven live in
  # `apps/admin/e2e/taxonomy-projects.spec.ts` and axe-scanned in
  # `apps/admin/e2e/a11y/a11y-axe.e2e.spec.ts`. The detail ships ONE tab
  # («Основное») rather than empty «Связи»/«Публикация» placeholders — those tabs
  # arrive with the slices that make them work (#1288/#1291/#1292, #1287/#1295/#1296).
  - app: admin
    route: /projects
    file: apps/admin/app/projects/page.tsx
    status: product-ready
  - app: admin
    route: /projects/create
    file: apps/admin/app/projects/create/page.tsx
    status: product-ready
  - app: admin
    route: /projects/[id]
    file: apps/admin/app/projects/[id]/page.tsx
    status: product-ready
  # 012 EARS-2 (#1284): the expert authoring vertical on the same shared list shell
