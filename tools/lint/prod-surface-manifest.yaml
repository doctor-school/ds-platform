  # `apps/admin/e2e/taxonomy-experts.spec.ts` and axe-scanned in
  # `apps/admin/e2e/a11y/a11y-axe.e2e.spec.ts`. Same one-tab rule as projects: no
  # empty «Связи»/«Публикация» placeholder ships ahead of the slice that fills it.
  - app: admin
    route: /experts
    file: apps/admin/app/experts/page.tsx
    status: product-ready
  - app: admin
    route: /experts/create
    file: apps/admin/app/experts/create/page.tsx
    status: product-ready
  - app: admin
    route: /experts/[id]
    file: apps/admin/app/experts/[id]/page.tsx
    status: product-ready
  # 012 EARS-3 (#1285), renamed per ADR-0016 §5 (#1483): the curated-direction
