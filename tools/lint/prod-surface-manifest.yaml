    status: product-ready
  - app: admin
    route: /direction-specialties/[id]
    file: apps/admin/app/direction-specialties/[id]/page.tsx
    status: product-ready
  - app: admin
    route: /direction-adjacency
    file: apps/admin/app/direction-adjacency/page.tsx
    status: product-ready
  - app: admin
